name: Aplicar ediciones

# Regenera la página cuando el administrador guarda una edición (data/ediciones.json)
# o cuando cambia el diseño de la página (plantillas o mesa/pagina.py).
# No usa el modelo: no tiene costo de API.
on:
  push:
    branches: [main]
    paths:
      - "data/ediciones.json"
      - "templates/**"
      - "mesa/pagina.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mesa-caliente-barrido
  cancel-in-progress: false

jobs:
  pagina:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Regenerar la página con las ediciones
        run: python -m mesa.pagina

      - name: Guardar la página en main
        run: |
          git config user.name "mesa-caliente-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
            exit 0
          fi
          git commit -m "Ediciones aplicadas ($(date -u +%Y-%m-%d %H:%M) UTC)"
          for intento in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((intento * 5))
          done
          echo "No se pudo guardar en main." >&2
          exit 1
