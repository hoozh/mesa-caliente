name: Barrido diario

on:
  schedule:
    - cron: "45 12 * * *"   # todos los días a las 12:45 UTC (horario principal)
    - cron: "25 13 * * *"   # respaldo: solo corre si hoy todavía no hubo una corrida exitosa
    - cron: "45 15 * * *"   # respaldo: solo corre si hoy todavía no hubo una corrida exitosa
  workflow_dispatch:            # botón "Run workflow" para correrlo a mano
    inputs:
      origen:
        description: "Opcional. Escriba «externo» si la corrida la dispara otro sistema: se omite si hoy ya hubo una exitosa."
        type: string
        required: false
        default: ""
      medir_sei:
        description: "Medición: redactar dos veces (sin y con los documentos de SEI) y registrar el costo de cada una"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mesa-caliente-barrido
  cancel-in-progress: false

jobs:
  barrido:
    runs-on: ubuntu-24.04   # versión fija: no cambia sola cuando ubuntu-latest pase a 26.04
    timeout-minutes: 20
    env:
      # El archivo de resultados no publicados va al repositorio privado hoozh/mesa-caliente-privado.
      TIENE_PRIVADO: ${{ secrets.MESA_PRIVADO_TOKEN != '' }}
      # Documentos vigentes de SEI (hoozh/SEO-Articles, docs/estandares/) para la redacción. Clave de solo lectura.
      TIENE_SEI: ${{ secrets.SEI_LECTURA_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Descargar el repositorio privado
        if: env.TIENE_PRIVADO == 'true'
        uses: actions/checkout@v7
        with:
          repository: hoozh/mesa-caliente-privado
          token: ${{ secrets.MESA_PRIVADO_TOKEN }}
          path: privado

      # Privacidad: los documentos van a una carpeta temporal fuera del repositorio y nunca se imprimen.
      # Si falta el secreto o un archivo, el barrido sigue como siempre y lo avisa en el pie y en los costos.
      - name: Descargar los documentos de SEI
        if: env.TIENE_SEI == 'true'
        env:
          SEI_LECTURA_TOKEN: ${{ secrets.SEI_LECTURA_TOKEN }}
        run: |
          set +x
          carpeta="$RUNNER_TEMP/sei"
          mkdir -p "$carpeta"
          for f in guia-traduccion-poker.md reglas-comunes-sei.md estandar-editorial-notas.md redaccion-natural-anti-ia.md; do
            if curl -sf -o "$carpeta/$f" \
                 -H "Authorization: Bearer $SEI_LECTURA_TOKEN" \
                 -H "Accept: application/vnd.github.raw+json" \
                 "https://api.github.com/repos/hoozh/SEO-Articles/contents/docs/estandares/$f"; then
              echo "Documento de SEI descargado: $f"
            else
              rm -f "$carpeta/$f"
              echo "::warning::Falta el documento de SEI $f (la redacción sigue sin él)."
            fi
          done

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr el barrido
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MESA_MODELO: ${{ vars.MESA_MODELO }}
          EVENTO: ${{ github.event_name }}
          ORIGEN_ENTRADA: ${{ inputs.origen }}
          MESA_DIR_PRIVADO: ${{ env.TIENE_PRIVADO == 'true' && format('{0}/privado', github.workspace) || '' }}
          MESA_DIR_SEI: ${{ env.TIENE_SEI == 'true' && format('{0}/sei', runner.temp) || '' }}
          MESA_MEDIR_SEI: ${{ inputs.medir_sei && '1' || '' }}
        # Programadas y externas se omiten si hoy ya hubo una corrida exitosa; las manuales siempre corren.
        run: |
          origen="${ORIGEN_ENTRADA,,}"   # en minúsculas
          origen="${origen// /}"          # sin espacios
          if [ "$EVENTO" = "schedule" ]; then
            # GitHub entrega los horarios con horas de atraso. Un respaldo que llega antes de las 12:00 UTC
            # (después de medianoche) pertenece al día anterior: no corre, así no le quita su lugar
            # al barrido de la mañana que dispara cron-job.org.
            if [ "$(date -u +%H)" -lt 12 ]; then
              echo "Respaldo atrasado (llegó a las $(date -u +%H:%M) UTC): se omite."
              exit 0
            fi
            python -m mesa.corrida --origen automatica --omitir-si-hubo-exito-hoy
          elif [ "$origen" = "externo" ]; then
            python -m mesa.corrida --origen externo --omitir-si-hubo-exito-hoy
          else
            python -m mesa.corrida --origen manual
          fi

      - name: Guardar datos y página en main
        run: |
          git config user.name "mesa-caliente-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data config docs
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
            exit 0
          fi
          git commit -m "Barrido $(date -u +%Y-%m-%d) ($(date -u +%H:%M) UTC)"
          for intento in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((intento * 5))
          done
          echo "No se pudo guardar en main." >&2
          exit 1

      - name: Guardar el archivo de resultados en el repositorio privado
        if: ${{ !cancelled() && env.TIENE_PRIVADO == 'true' }}
        working-directory: privado
        run: |
          git config user.name "mesa-caliente-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados
          if git diff --cached --quiet; then
            echo "Sin resultados nuevos para el archivo."
            exit 0
          fi
          git commit -m "Archivo de resultados $(date -u +%Y-%m-%d) ($(date -u +%H:%M) UTC)"
          for intento in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((intento * 5))
          done
          echo "No se pudo guardar el archivo en el repositorio privado." >&2
          exit 1
