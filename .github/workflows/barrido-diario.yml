name: Barrido diario

on:
  schedule:
    - cron: "45 12 * * *"   # todos los días a las 12:45 UTC
  workflow_dispatch: {}       # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: mesa-caliente-barrido
  cancel-in-progress: false

jobs:
  barrido:
    runs-on: ubuntu-24.04   # versión fija: no cambia sola cuando ubuntu-latest pase a 26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr el barrido
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MESA_MODELO: ${{ vars.MESA_MODELO }}
        run: python -m mesa.corrida --origen ${{ github.event_name == 'schedule' && 'automatica' || 'manual' }}

      - name: Guardar datos y página en main
        run: |
          git config user.name "mesa-caliente-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data config docs
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
            exit 0
          fi
          git commit -m "Barrido $(date -u +%Y-%m-%d) ($(date -u +%H:%M) UTC)"
          for intento in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((intento * 5))
          done
          echo "No se pudo guardar en main." >&2
          exit 1
