name: Gestionar tema caliente

on:
  workflow_dispatch:
    inputs:
      accion:
        description: "Acción"
        type: choice
        options: [agregar, quitar, desactivar]
        default: agregar
        required: true
      nombre:
        description: "Nombre del tema (por ejemplo: Caso Paul Gregg)"
        type: string
        required: true
      palabras_clave:
        description: "Palabras clave separadas por coma (para agregar; por ejemplo: Paul Gregg, MeshAgent, superuser)"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: mesa-caliente-barrido   # nunca al mismo tiempo que un barrido
  cancel-in-progress: false

jobs:
  tema:
    runs-on: ubuntu-24.04   # versión fija
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar la lista de temas
        env:
          TEMA_ACCION: ${{ inputs.accion }}
          TEMA_NOMBRE: ${{ inputs.nombre }}
          TEMA_PALABRAS: ${{ inputs.palabras_clave }}
        run: python -m mesa.temas

      - name: Actualizar la página
        run: python -m mesa.pagina

      - name: Guardar en main
        env:
          TEMA_ACCION: ${{ inputs.accion }}
          TEMA_NOMBRE: ${{ inputs.nombre }}
        run: |
          git config user.name "mesa-caliente-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/temas_calientes.json docs
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar."
            exit 0
          fi
          git commit -m "Tema caliente: ${TEMA_ACCION} «${TEMA_NOMBRE}»"
          for intento in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((intento * 5))
          done
          echo "No se pudo guardar en main." >&2
          exit 1
