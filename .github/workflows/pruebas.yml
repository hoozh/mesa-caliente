name: Pruebas

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "docs/**"

jobs:
  pruebas:
    runs-on: ubuntu-24.04   # versión fija: no cambia sola cuando ubuntu-latest pase a 26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pruebas sin red ni API
        run: python -m pytest -q
