name: Pruebas

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "docs/**"

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pruebas sin red ni API
        run: python -m pytest -q
