a e industria", "credito": "PokerNews", "destacada": false, "dia": "2026-11-26", "foto": "https://pnimg.net/w/articles/0/6b0/72c0f11313.jpg", "fuente": "PokerNews", "id": "2026-11-26-a4108d2f", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "Michael Mizrachi se suma a Solana d\u00edas antes del inicio de WSOP Paradise"}, {"bajada": "Tyler Willse, Executive Tournament Director de Asian Poker Tour, habla sobre su rol y su formaci\u00f3n bajo directores como Jack Effel y Toby Stone. El piso del APT se ha adaptado recientemente al slide dealing.", "cat": "Pol\u00e9mica e industria", "credito": "PokerNews", "destacada": false, "dia": "2026-11-26", "foto": "https://pnimg.net/w/articles/0/6b0/68e519dd51.jpg", "fuente": "PokerNews", "id": "2026-11-26-6cb47cd9", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "Tyler Willse lidera la operaci\u00f3n del piso de Asian Poker Tour tras trabajar con Effel y Stone"}, {"bajada": "Andrew Robl public\u00f3 un desaf\u00edo en redes contra Eric Wasserson, el jugador con mayores ganancias en cash games televisados, tras perder en las \u00faltimas sesiones de High Stakes Poker. En una mano reciente, Robl dej\u00f3 el resultado de un bote de US$ 1.2 millones al azar.", "cat": "Noticias", "credito": "C\u00f3digo Poker", "destacada": false, "dia": "2026-11-26", "foto": "https://images.codigopoker.com/wp-content/uploads/2026/11/25100151/robl-vs-wasserson.webp", "fuente": "C\u00f3digo Poker", "id": "2026-11-26-284aacc5", "nf": 2, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "Andrew Robl desaf\u00eda a Eric Wasserson en High Stakes Poker tras perder tres sesiones consecutivas"}, {"bajada": "Kristen Foxen cerr\u00f3 el primer d\u00eda del $150.000 NLH 10th Anniversary Special Triton con 798.000 fichas (80 big blinds) tras una remontada en un triple all-in contra Daniel Dvoress y Nikita Kuznetsov.", "cat": "Noticias", "credito": "C\u00f3digo Poker", "destacada": false, "dia": "2026-11-26", "foto": "https://images.codigopoker.com/wp-content/uploads/2026/11/25000950/kfoxen.webp", "fuente": "C\u00f3digo Poker", "id": "2026-11-26-ac880b9a", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "Kristen Foxen lidera el $150K NLH 10th Anniversary Special Triton tras remontada"}, {"bajada": "El EPT Prague 2026 de PokerStars incluir\u00e1 por primera vez torneos de Sviten Special (mezcla de 5-Card Omaha y 5-Card Draw) y S.O.R.B.E.T. (rotaci\u00f3n de Stud, Omaha Hi-Lo, Razz, Badugi, Stud Hi-Lo y 2-7 Triple Draw). Los torneos buscan expandir opciones para jugadores de mixed games.", "cat": "Torneos y eventos", "credito": "PokerNews", "destacada": false, "dia": "2026-11-26", "foto": "https://pnimg.net/w/articles/0/6b0/59a439d030.jpg", "fuente": "PokerNews", "id": "2026-11-26-0edcfeb8", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "EPT Prague 2026 presenta nuevos formatos de mixed games: Sviten Special y S.O.R.B.E.T."}, {"bajada": "Vaagn Galustyan y Armin Martirosian, de Southern California, recibieron dos a\u00f1os de probatoria tras confesar un esquema de card-marking en Mississippi Stud en Pala Casino y Harrah\u0027s Resort Southern California.", "cat": "Pol\u00e9mica e industria", "credito": "PokerNews", "destacada": false, "dia": "2026-11-26", "foto": "https://pnimg.net/w/articles/0/6b0/5750cd20bc.jpg", "fuente": "PokerNews", "id": "2026-11-26-0103e6e8", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "Dos hombres de California evitan c\u00e1rcel tras admitir fraude de card-marking en Mississippi Stud"}, {"bajada": "Matthias Eibinger enfrent\u00f3 un overbet de 178% del pot de Bryn Kenney en el river con bottom pair en el Triton Invitational $200.000 de North Cyprus. Tras deliberaci\u00f3n, Eibinger llam\u00f3 y vio el overpair de Kenney.", "cat": "Noticias", "credito": "PokerNews", "destacada": false, "dia": "2026-11-26", "foto": "https://pnimg.net/w/articles/0/6b0/4a6678910a.png", "fuente": "PokerNews", "id": "2026-11-26-b40d89b8", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "Matthias Eibinger llama un overbet masivo de Bryn Kenney en el Triton Invitational $200K"}, {"bajada": "Jo\u00e3o Victor Menezes venci\u00f3 el Millionaire Maker record del BSOP Millions.", "cat": "Resultados", "credito": "PokerNews Brasil", "destacada": false, "dia": "2026-11-26", "foto": "https://pnimg.net/w/articles/0/6b0/7881a55469.jpg", "fuente": "PokerNews Brasil", "id": "2026-11-26-a9b98a9b", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Felipe Boianovsky [nacionalidad a confirmar] suma dos mesas finales valiosas en APT Championship Taip\u00e9i; Jo\u00e3o Victor Menezes gana Millionaire Maker en BSOP Millions"}, {"bajada": "Ryan Brown derrot\u00f3 un field de 370 entradas en el WSOP Circuit Main Event $1.700 No-Limit Hold\u0027em de Caesars New Orleans, reclamando su segundo Circuit Main Event ring y US$ 110.938 m\u00e1s un paquete a WSOP Paradise. Brown hab\u00eda terminado cuarto en el WSOP Circuit Main Event de TCH Social Austin en septiembre y noveno en su defensa del t\u00edtulo en Council Bluffs antes de esta victoria.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-25", "foto": "", "fuente": "WSOP.com", "id": "2026-11-25-09c107b3", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Ryan Brown gana su segundo WSOP Circuit Main Event ring en Caesars New Orleans con US$ 110.938"}, {"bajada": "PartyPoker ha anunciado planes para la edici\u00f3n 2027 de su live tour, confirmando nueve stops a lo largo del a\u00f1o, incluyendo expansi\u00f3n a Canad\u00e1.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-25", "foto": "", "fuente": "Poker Industry PRO", "id": "2026-11-25-82e38218", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "PartyPoker Tour expandir\u00e1 a Canad\u00e1 en 2027 con nueve paradas"}, {"bajada": "El slide dealing, donde la carta se mantiene plana y se gu\u00eda a lo largo de la mesa en lugar de ser lanzada, se expande desde Europa hacia grandes salas como el Asian Poker Tour Championship y Las Vegas como medida de seguridad. El cambio se debe a preocupaciones sobre integridad del juego, incluyendo esquemas de fraude con c\u00e1maras ocultas detectados en Par\u00eds, donde un pitched card expone brevemente su reverso; el European Poker Tour introdujo slide dealing a principios de 2024.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-11-25", "foto": "", "fuente": "PokerNews", "id": "2026-11-25-54f4dff0", "nf": 2, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "Slide dealing se expande globalmente como m\u00e9todo antifraude en mesas de poker"}, {"bajada": "Kyle Tinkham gan\u00f3 el RunGood Poker Series OG Clubhouse $600 Main Event en Oak Grove, Kentucky, pese a haber faltado a los primeros 40 minutos de juego para asistir a la iglesia. Tinkham colect\u00f3 US$ 44.801 como campe\u00f3n inaugural del OG Clubhouse Main Event, derrotando un field de 409 entradas que gener\u00f3 un prize pool de US$ 208.590.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-25", "foto": "", "fuente": "PokerNews", "id": "2026-11-25-6471d884", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Kyle Tinkham gana el RunGood Poker Series OG Clubhouse Main Event por US$ 44.801 tras asistir a iglesia"}, {"bajada": "El APT Championship Main Event 2026 en Redspace Taipei registr\u00f3 600 entradas, superando su garant\u00eda de NTD $165 millones y convirti\u00e9ndose en el segundo Main Event de la serie. El campe\u00f3n 2025 Nishant Sharma fue eliminado en D\u00eda 1 y no defender\u00e1 su t\u00edtulo. Entre los contendientes activos est\u00e1n Erik Seidel, Daniel Neilson, Alexandru Papazian, Ivan Deyra y Pavel Plesuv.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-25", "foto": "", "fuente": "PokerNews", "id": "2026-11-25-5c8ca361", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "APT Championship Main Event 2026 con 600 entradas; Nishant Sharma eliminado en D\u00eda 1"}, {"bajada": "Mark Hughes, conocido como \"Old Bear\", falleci\u00f3 el 17 de octubre de 2026 (naci\u00f3 el 20 de febrero de 1955). Hughes fue un miembro y querido de BARGE (Big August Rec.Gambling Excursion), la comunidad de poker que se re\u00fane anualmente en Las Vegas desde 1991. Era ingeniero retirado de la NASA y motociclista \u00e1vido.", "cat": "Obituario", "credito": "", "destacada": false, "dia": "2026-11-25", "foto": "", "fuente": "PokerNews", "id": "2026-11-25-dda5152d", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "Mark \"Old Bear\" Hughes, miembro de BARGE"}, {"bajada": "Ryan Feldman, due\u00f1o de Hustler Casino Live, fue stacked seis veces en sus primeras tres horas de juego en la transmisi\u00f3n PokerGO High Stakes Poker entre domingo y lunes, perdiendo cuatro all-ins el domingo incluyendo un bote de US$ 300.000 a Michael \"Texas Mike\" Moncek y US$ 589.000 a Andrew Robl. El lunes comenz\u00f3 down US$ 400.000 tras perder bolsas adicionales pero logr\u00f3 remontarse para ganar US$ 914.000 en un bote, demostrando su capacidad de recuperaci\u00f3n.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-11-25", "foto": "", "fuente": "PokerNews", "id": "2026-11-25-3fb9c091", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "Ryan Feldman remonta en High Stakes Poker tras perder US$ 900.000 en dos d\u00edas"}, {"bajada": "Jorge Coello, jugador gallego tambi\u00e9n conocido por el nick \"ToTheMazinho\", gan\u00f3 el CNP Winamax 2026 Main Event de \u20ac550 en Casino Gran Madrid, Torrelodones, superando 2.703 entradas y embols\u00e1ndose 136.436 \u20ac tras un deal a cuatro bandas. El torneo gener\u00f3 una bolsa de premios de 1.196.550 \u20ac repartida entre 282 clasificados, superando las 2.684 entradas del 2025. Coello hab\u00eda reducido sus apariciones presenciales para enfocarse en cash online y vida familiar.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-25", "foto": "", "fuente": "PokerNews en espa\u00f1ol", "id": "2026-11-25-5a6554aa", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Jorge Coello [nacionalidad a confirmar] gana la Gran Final del CNP Winamax 2026 con 136.436 \u20ac"}, {"bajada": "Luan Coelho se coron\u00f3 campe\u00f3n del BSOP Millions 2026 Main Event tras una marat\u00f3n de 12 horas en D\u00eda Final que se extendi\u00f3 a madrugada, ganando R$ 1.386.000 en un acuerdo heads-up. El Main Event sum\u00f3 2.871 entradas de 1.323 jugadores \u00fanicos, el segundo mayor field solo superado por 2018 con 3.231 entradas, generando un prize pool de R$ 11.357.950. Juliano Marques fue vice-campe\u00f3n con R$ 1.134.000 y Guilherme Augusto tercero con R$ 650.000.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-25", "foto": "", "fuente": "PokerNews Brasil", "id": "2026-11-25-da5c3fff", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Luan Coelho [nacionalidad a confirmar] campe\u00f3n del BSOP Millions 2026 Main Event con R$ 1.386.000"}, {"bajada": "El BSOP divulg\u00f3 el cronograma 2027 con ocho eventos: los tres festivales principales BSOP Summer, BSOP Winter y BSOP Millions, m\u00e1s cinco nuevas etapas BSOP Open con duraciones de cinco a siete d\u00edas cada una dispersas por Brasil. Los nuevos festivales m\u00e1s cortos buscan abrir puertas para debutantes y dar m\u00e1s oportunidades a regulares del circuito a lo largo del a\u00f1o.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-25", "foto": "", "fuente": "PokerNews Brasil", "id": "2026-11-25-65f8d6ce", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "BSOP anuncia ocho eventos para 2027 con nuevo formato BSOP Open en m\u00faltiples ciudades"}, {"bajada": "", "cat": "Tema caliente", "credito": "", "destacada": false, "dia": "2026-11-25", "foto": "", "fuente": "CardPlayer", "id": "2026-11-25-tema-c37e6bea", "nf": 1, "region": "", "sec": "tema", "secs": ["temas"], "titulo": "Tema: Triton North Cyprus"}, {"bajada": "Poker Industry PRO anunci\u00f3 los PRO Online Poker Awards, su primer premio para la industria del poker en l\u00ednea, con 50 nominaciones en 10 categor\u00edas. PokerStars y GGPoker encabezan las nominaciones con ocho selecciones cada una; ambas fueron nominadas en siete categor\u00edas iguales, incluyendo Online Poker Operator of the Year. BetRivers Poker y CoinPoker recibieron cinco nominaciones cada una.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-24", "foto": "", "fuente": "Pokerfuse", "id": "2026-11-24-6faa60c3", "nf": 2, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Poker Industry PRO lanza los primeros PRO Online Poker Awards con 50 nominaciones"}, {"bajada": "Bryan Taylor captur\u00f3 el \u00a31.250 GUKPT Grand Final Midi Main en el Grosvenor Victoria de Londres con un premio de \u00a352.780 tras acuerdo entre cuatro jugadores en la mesa final. El torneo gener\u00f3 275 entradas y una bolsa de premios de \u00a3287.370. Es el tercer t\u00edtulo de Taylor en el Grosvenor Victoria durante 2026.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-24", "foto": "", "fuente": "PokerNewsDaily", "id": "2026-11-24-267007c7", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Bryan Taylor gana el GUKPT Grand Final Midi Main del Grosvenor Victoria por \u00a352.780"}, {"bajada": "En el APT Championship 2026 en Taip\u00e9i, Vincent Huang gan\u00f3 el $25.000 no-limit hold\u0027em high roller con 81 entradas y premio principal de US$ 369.828, su segundo mayor resultado en vivo. Chang Lee gan\u00f3 el $50.000 high roller. Huang acumul\u00f3 672 puntos Card Player Player of the Year y casi US$ 3.9 millones en cashes en carrera.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-24", "foto": "", "fuente": "CardPlayer", "id": "2026-11-24-f8f2dc56", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Vincent Huang y Chang Lee ganan los high rollers del APT Championship 2026 en Taip\u00e9i"}, {"bajada": "Los nominados para los Seventh Annual Global Poker Awards fueron anunciados, con Daniel Negreanu, Alan Keating, Jennifer Tilly y Phil Hellmuth entre los candidatos en la categor\u00eda Most Entertaining Player. Stephen Chidwick, Adrian Mateos, Alex Foxen y Phil Ivey compiten por Most Feared Live Tournament Player. Entre las nuevas categor\u00edas figuran Best Table Mate y tres categor\u00edas Most Feared Player. Los ganadores se anunciar\u00e1n el 4 de diciembre.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-24", "foto": "", "fuente": "PokerNews", "id": "2026-11-24-edeb897d", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Nominados para los Seventh Annual Global Poker Awards; ganadores el 4 de diciembre"}, {"bajada": "Jesse Jones captur\u00f3 su cuarto anillo RunGood Poker Series en el $800 Main Event del RGPS Golden Expedition Council Bluffs, ganando US$ 57.713. El torneo atrajo 396 entradas y gener\u00f3 un prize pool de $277.200, superando la garant\u00eda. Jones venci\u00f3 a Kyle Schmidt en un heads-up breve y reclam\u00f3 su tercer t\u00edtulo RGPS Main Event en los \u00faltimos tres a\u00f1os.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-24", "foto": "", "fuente": "PokerNews", "id": "2026-11-24-1ff559c2", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Jesse Jones gana su cuarto anillo RGPS en el Main Event de Council Bluffs con US$ 57.713"}, {"bajada": "En la primera noche de High Stakes Poker, Kevin Hart se enfrent\u00f3 a Michael \u0027Texas Mike\u0027 Moncek en una mano que alcanz\u00f3 m\u00e1s de US$ 5 millones en el pozo. Tras mucho tiempo de reflexi\u00f3n, Hart rechaz\u00f3 un call de m\u00e1s de US$ 1.41 millones, evitando lo que hubiera sido el mayor pozo en la historia del programa. Texas Mike mostr\u00f3 A\u26669\u2663 dominando A\u26635\u2660 de Hart.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-24", "foto": "", "fuente": "PokerNews", "id": "2026-11-24-46b953b1", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Kevin Hart rechaza call en mano de m\u00e1s de US$ 5 millones en High Stakes Poker"}, {"bajada": "En las Triton Super High Roller Series de Chipre, el espa\u00f1ol Sergio Aido termin\u00f3 10\u00ba por US$ 117.000 y Juan Pardo cay\u00f3 14\u00ba por US$ 100.000 en el Evento #8: $60.000 NLH 7-Handed. Pieter Aerts, belga, gan\u00f3 el torneo con US$ 1.434.000, convirti\u00e9ndose en el jugador m\u00e1s r\u00e1pido en alcanzar tres t\u00edtulos Triton, necesitando solo 34 participaciones.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-24", "foto": "", "fuente": "PokerNews en espa\u00f1ol", "id": "2026-11-24-d0c30cb7", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Sergio Aido y Juan Pardo cobran en el Triton $60.000 7-Handed de Chipre; Pieter Aerts gana y logra su tercer t\u00edtulo Triton en 34 eventos"}, {"bajada": "Gabriel Tavares, jugador de Samba Team de Brasil, logr\u00f3 su mejor resultado en la Triton Super High Roller Series North Cyprus al terminar sexto en el Evento #5: $50.000 NLH 8-Handed por US$ 375.000, su mayor premio en circuitos de torneos en vivo. Jonathan Jaffe gan\u00f3 el evento y su tercer trofeo Triton con US$ 1.627.000.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-24", "foto": "", "fuente": "PokerNews Brasil", "id": "2026-11-24-3ca03845", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Gabriel Tavares, Brasil, sixth en el Triton $50.000 eight-max de Chipre por US$ 375.000"}, {"bajada": "El Millionaire Maker del BSOP Millions 2026 de R$ 1.200 (aproximadamente US$ 200) cerr\u00f3 sus d\u00edas clasificatorios con 5.051 entradas, superando la anterior marca de 4.162 inscripciones establecida en el BSOP Millions 2021 hace cinco a\u00f1os. El campo brasile\u00f1o contin\u00faa en juego con 257 jugadores remanentes; el campe\u00f3n recibir\u00e1 R$ 1 mill\u00f3n (aproximadamente US$ 167.000).", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-24", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-24-6c338119", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "BSOP Millions Millionaire Maker bate r\u00e9cord brasile\u00f1o con 5.051 entradas"}, {"bajada": "Kelvin Kerber, catarinense, gan\u00f3 el 250K Super High Roller del BSOP Millions el domingo con un premio de R$ 3.217.500 tras acuerdo en heads-up contra Renan Bruschi, quien fue vice-campe\u00f3n por R$ 2.632.500. El torneo de 49 entradas distribuy\u00f3 R$ 11.400.000. Es el segundo mayor premio de Kerber en vivo, superado solo por su vice-campeonato en el \u20ac 25K High Roller del EPT Monte Carlo 2026.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-24", "foto": "", "fuente": "PokerNews Brasil", "id": "2026-11-24-7f8e6afd", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Kelvin Kerber, Brasil, gana el 250K Super High Roller del BSOP Millions por R$ 3.217.500"}, {"bajada": "", "cat": "Tema caliente", "credito": "", "destacada": false, "dia": "2026-11-24", "foto": "", "fuente": "CardPlayer", "id": "2026-11-24-tema-675621f6", "nf": 1, "region": "", "sec": "tema", "secs": ["temas"], "titulo": "Tema: Neymar Jr"}, {"bajada": "", "cat": "Tema caliente", "credito": "", "destacada": false, "dia": "2026-11-24", "foto": "", "fuente": "tightpoker.com", "id": "2026-11-24-tema-c37e6bea", "nf": 2, "region": "", "sec": "tema", "secs": ["temas"], "titulo": "Tema: Triton North Cyprus"}, {"bajada": "El jugador lituano Paulius Plausinaitis domin\u00f3 el Triton Invitational X $200.000 en North Cyprus, ganando US$ 5.380.000 en su primer tridente. El torneo reuni\u00f3 107 entradas y gener\u00f3 US$ 21.400.000 en premios.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-23", "foto": "", "fuente": "PokerNews en espa\u00f1ol", "id": "2026-11-23-a90d99e9", "nf": 2, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Paulius Plausinaitis gana el Triton Invitational X por US$ 5.380.000"}, {"bajada": "PokerStars dejar\u00e1 el mercado de Nueva Zelanda el 26 de noviembre de 2026, tras fallar Flutter Entertainment en obtener licencia bajo el nuevo r\u00e9gimen de juego en l\u00ednea del pa\u00eds. Los jugadores podr\u00e1n acceder a su cuenta para retirar fondos pero no podr\u00e1n jugar.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-11-23", "foto": "", "fuente": "Pokerfuse", "id": "2026-11-23-50949bf3", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "PokerStars se retira de Nueva Zelanda el 26 de noviembre"}, {"bajada": "Bryan Taylor conquist\u00f3 el \u00a31.250 GUKPT Grand Final Midi Main en el Grosvenor Victoria, ganando \u00a352.780 tras un acuerdo cu\u00e1druple.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-23", "foto": "", "fuente": "PokerNews", "id": "2026-11-23-ff9ccbc3", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Bryan Taylor gana su tercer t\u00edtulo en el Grosvenor Victoria en 2026"}, {"bajada": "La embajadora de PokerStars Kerryjane Craigie colabora con Victoria Livschitz y Octopi Poker para crear una comunidad de aprendizaje exclusiva para mujeres, que incluye recursos de entrenamiento, grupo Discord solo para mujeres y coaching en vivo mensual.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-11-23", "foto": "", "fuente": "PokerNews", "id": "2026-11-23-3cb29873", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "Kerryjane Craigie lanza comunidad de aprendizaje exclusiva para mujeres con Octopi Poker"}, {"bajada": "El WSOP Paradise en Baha Mar (Bahamas) celebrar\u00e1 el Solana Showdown el 12 de diciembre, evento solo por invitaci\u00f3n con cripto influenciadores compitiendo por un brazalete y US$ 50.000. Entre los confirmados est\u00e1n N3on, Easy, Mayne, Jaylene y otros.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-23", "foto": "", "fuente": "PokerNews", "id": "2026-11-23-f7e562e0", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "WSOP Paradise acoger\u00e1 segundo Solana Showdown con influenciadores cripto"}, {"bajada": "El GGMillion$ Festival de GGPoker en noviembre ofrece US$ 50 millones garantizados con buy-ins de US$ 500 a US$ 10.000, exclusivo para jugadores de altas apuestas. El festival otorga paquetes a WSOP Paradise Live (US$ 10k a US$ 30k) a los campeones.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-23", "foto": "", "fuente": "Pokerfuse", "id": "2026-11-23-cacb1988", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "GGMillion$ Festival ofrece US$ 50 millones garantizados con paquetes a WSOP Paradise"}, {"bajada": "La estrella del f\u00fatbol brasile\u00f1o Neymar Jr. gan\u00f3 el BSOP Millions R$ 15.000 1-Day High Roller en WTC Sheraton, ganando R$ 380.000. Gilmar Ara\u00fajo fue segundo con R$ 250.000; Marcelo Henrique Agrella Bernardino tercero con R$ 170.000.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-23", "foto": "", "fuente": "PokerNewsDaily", "id": "2026-11-23-f42f63fc", "nf": 2, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Neymar Jr. gana el BSOP Millions R$ 15.000 1-Day High Roller"}, {"bajada": "El jugador brasile\u00f1o Kelvin Kerber conquist\u00f3 el 250K Super High Roller del BSOP Millions tras tres d\u00edas de competencia. Renan Bruschi fue segundo; ambos acordaron los premios en el heads-up final. Rafael Moraes cay\u00f3 quinto como l\u00edder al inicio de la mesa final.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-23", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-23-9e0cbb0b", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Kelvin Kerber gana el 250K Super High Roller del BSOP Millions"}, {"bajada": "Tres argentinos llegaron a la mesa final del R$ 10.000 Grand High Roller del BSOP Millions: Rodrigo Maseda tercero por R$ 198.000, Gonzalo Almeida quinto por R$ 111.000 (su segundo t\u00edtulo en el festival) y Juli\u00e1n Yebra sexto por R$ 84.000. Gustavo Dias venci\u00f3 a Caique Sanches en heads-up, ganando R$ 405.000.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-23", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-23-d40b0d76", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Rodrigo Maseda, tercero en el R$ 10.000 Grand High Roller del BSOP Millions"}, {"bajada": "", "cat": "Tema caliente", "credito": "", "destacada": false, "dia": "2026-11-23", "foto": "", "fuente": "CardPlayer", "id": "2026-11-23-tema-c37e6bea", "nf": 1, "region": "", "sec": "tema", "secs": ["temas"], "titulo": "Tema: Triton North Cyprus"}, {"bajada": "El torneo gratuito de ClubWPT Gold (plataforma con marca World Poker Tour) super\u00f3 el r\u00e9cord anterior de GGPoker con 420.714 registros. El evento comenz\u00f3 el 1 de noviembre y vence el 29 de noviembre con tres sesiones de D\u00eda 1 cada d\u00eda y un D\u00eda 2 final. Los jugadores pueden entrar m\u00faltiples veces gratuitamente; un chip equivale a US$ 1 en efectivo.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-22", "foto": "", "fuente": "PokerNews", "id": "2026-11-22-51ab5e20", "nf": 3, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "ClubWPT Gold establece r\u00e9cord mundial con 420.714 inscripciones en freeroll de US$ 5 millones"}, {"bajada": "\"The Battle for Texas Poker\", producida por P\u0026R Creative y dirigida por Alan Jackson, fue presentada en el Alamo Drafthouse Cinema de Austin con el objetivo de destacar la historia del p\u00f3ker en Texas y convencer a legisladores de aclarar la ley. La docuserie fue impulsada por Texas Card House, cuyo CEO Ryan Crow particip\u00f3 activamente en la producci\u00f3n. El primer episodio se enfoca en el origen de los clubes de p\u00f3ker en el estado, comenzando con Texas Card House en 2014.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-11-22", "foto": "", "fuente": "PokerNews", "id": "2026-11-22-b28fc180", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "Docuserie \"The Battle for Texas Poker\" busca cambiar leyes de p\u00f3ker en Texas"}, {"bajada": "Linda Johnson, miembro del Poker Hall of Fame, participa en el segundo Asian Poker Tour Championship en Taip\u00e9i, donde ha casheado cuatro veces e ingres\u00f3 a la mesa final del Women\u0027s Championship patrocinado por Ladies International Poker. Johnson destaca que el cronograma incluye eventos femeninos en casi todos los d\u00edas del festival, reflejando el crecimiento de la participaci\u00f3n de mujeres en el p\u00f3ker competitivo.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-11-22", "foto": "", "fuente": "PokerNews", "id": "2026-11-22-b255bab5", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "Linda Johnson comenta presencia femenina en campos del poker en Asian Poker Tour Championship"}, {"bajada": "Lafaya Mitchell, terapeuta con m\u00e1s de experiencia en trastornos del espectro autista y jugadora de p\u00f3ker, lanz\u00f3 el libro \"Poker: A Woman\u0027s Game\". El manual combina relatos personales, perspectiva de terapia y estrategias para que las mujeres se desempe\u00f1en en espacios dominados por hombres. Mitchell es creadora de \"The Lafaya Way\", un modelo de cuatro pasos para la regulaci\u00f3n emocional, y es madre de seis hijos.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-11-22", "foto": "", "fuente": "PokerNews", "id": "2026-11-22-f22ea011", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "Lafaya Mitchell publica \"Poker: A Woman\u0027s Game\" con perspectiva terap\u00e9utica"}, {"bajada": "Neymar Jr., embajador de PokerStars, gan\u00f3 el BSOP Millions 1-Day High Roller el viernes en el WTC Sheraton de S\u00e3o Paulo, derrotando a su amigo Gil Cebola en heads-up. El evento con buy-in de R$ 15.000 fue el primero que conquista en circuito BSOP tras a\u00f1os de competencia. En 2018 hab\u00eda llegado a mesa final del BSOP High Roller, terminando sexto. Nacionalidad indicada por la fuente: Brasil.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-22", "foto": "", "fuente": "PokerNews", "id": "2026-11-22-b8d45191", "nf": 3, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Neymar Jr. gana su primer t\u00edtulo en el BSOP Millions, 1-Day High Roller por R$ 380.000"}, {"bajada": "Sergio Cobo lidera con 3.530.000 fichas entre los 100 sobrevivientes del Main Event del BSOP Millions tras 2.871 inscripciones al cierre del Nivel 20 (10.000/25.000 con BB Ante 25.000). Otros argentinos avanzados incluyen a Gaspar Fern\u00e1ndez (2.800.000) y Federico Sturzenegger (2.230.000). Entre los 22 hispanoamericanos remanentes est\u00e1n Gustavo Soler (campe\u00f3n 2016), Nicol\u00e1s Sagra, Leonel Otazo y otros competidores latinoamericanos. El Main Event contin\u00faa el domingo desde las 13:00 con el premio mayor de R$ 1.520.000.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-22", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-22-4ed80255", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Sergio Cobo comanda a 100 sobrevivientes del Main Event del BSOP Millions"}, {"bajada": "El BSOP Millions avanza con desarrollo del 250K Super High Roller llegando a mesa final, mientras el Main Event mantiene a m\u00faltiples competidores latinoamericanos en disputa. La fuente no precisa nombres de finalistas ni resultados concretos del 250K Super High Roller ni datos adicionales sobre otros eventos.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-22", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-22-9c5d6ecd", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "BSOP Millions 2026: finalistas del 250K Super High Roller y desarrollo del Main Event"}, {"bajada": "Con 209 entradas acumuladas en cuatro vuelos, el prize pool parcial asciende a MXN$ 731.500. El D\u00eda 1E corre a ritmo turbo.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-22", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-22-bc67e10e", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Erasmo Vel\u00e1zquez [nacionalidad a confirmar] lidera el Espejo Humeante en Casino Palace CDMX con 497.000 fichas"}, {"bajada": "", "cat": "Tema caliente", "credito": "", "destacada": false, "dia": "2026-11-22", "foto": "", "fuente": "PokerNewsDaily", "id": "2026-11-22-tema-89923a9e", "nf": 1, "region": "", "sec": "tema", "secs": ["temas"], "titulo": "Tema: No-Limit Hold\u0027em"}, {"bajada": "El jugador de alto nivel de India Santhosh Suvarna, residente de Bangalore, gan\u00f3 el torneo $30.000 no-limit hold\u0027em turbo de ocho manos de Triton North Cyprus con 109 entradas, sumando su segundo trofeo (trident trophy). D\u00edas antes hab\u00eda sido runner-up en el evento inaugural por US$ 725.000. Suvarna ahora acumula m\u00e1s de US$ 25,2 millones en ganancias en torneos en vivo, con m\u00e1s de US$ 12,9 millones provenientes de 39 finales de mesa en Triton.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-21", "foto": "", "fuente": "CardPlayer", "id": "2026-11-21-1ccc2167", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Santhosh Suvarna gana su segundo tridente de Triton en North Cyprus $30.000 turbo por US$ 823.000"}, {"bajada": "La jugadora Natalia Rozova gan\u00f3 el Campeonato Asian Poker Tour Championship con 127 inscripciones, generando un fondo de premios de TWD 3.800.000, r\u00e9cord para un evento femenino en Asia. Rozova recibi\u00f3 TWD 966.280 (aproximadamente US$ 30.000 seg\u00fan conversiones del 20 de noviembre de 2026) tras vencer a Karmen Law en heads-up con una cooler de colores (flush sobre flush). Es la segunda ganadora del APTC Championship de Nueva Zelanda despu\u00e9s de Kevin Lee.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-21", "foto": "", "fuente": "PokerNews", "id": "2026-11-21-16f5299c", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Natalia Rozova gana el APTC Women\u0027s Championship con 127 entradas, r\u00e9cord femenino en Asia"}, {"bajada": "Poker Dream 27 Sri Lanka se llevar\u00e1 a cabo en City of Dreams Sri Lanka en Colombo del 11 al 17 de enero de 2027. El Main Event garantiza US$ 500.000 en premios. Los paquetes Early Bird se agotaron en cuatro d\u00edas de su venta inicial; Poker Dream relanz\u00f3 una segunda ronda de estas ofertas.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-21", "foto": "", "fuente": "PokerNewsDaily", "id": "2026-11-21-1ac3fb2e", "nf": 2, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Poker Dream 27 Sri Lanka anuncia Main Event con US$ 500.000 garantizados (enero 2027)"}, {"bajada": "THMC London regresa a Genting Casino Stratford del 1 al 6 de diciembre para cerrar la temporada 2026 de 15 eventos en cinco continentes. El Main Event (\u00a3250+\u00a330) garantiza \u00a3150.000 en premios con siete vuelos iniciales (3\u20136 de diciembre). Este es el tercer a\u00f1o consecutivo del evento en Genting Stratford y marca el cierre de la gira de The Hendon Mob.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-21", "foto": "", "fuente": "PokerNews", "id": "2026-11-21-e9d0d948", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "The Hendon Mob Championship London cierra temporada con Main Event \u00a3150K GTD (1\u20136 de diciembre)"}, {"bajada": "El carioca Pedro Cassar se coron\u00f3 campe\u00f3n del 100K Super High Roller del BSOP Millions 2026 con 49 entradas, derrotando a Dennys Ramos en heads-up. Cassar recibi\u00f3 R$ 1.475.000; Ramos, campe\u00f3n del Main Event 2022, cobr\u00f3 R$ 975.000 como runner-up. Paulo Pinto tercero con R$ 688.000. Mesa final con nombres destacados del p\u00f3ker brasile\u00f1o e internacional, incluyendo al portugu\u00e9s Andr\u00e9 Moreira.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-21", "foto": "", "fuente": "PokerNews Brasil", "id": "2026-11-21-e50c1a11", "nf": 2, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Pedro Cassar gana el 100K Super High Roller del BSOP Millions por R$ 1.475.000"}, {"bajada": "El argentino Octavio Borra se coron\u00f3 campe\u00f3n del R$ 2.500 One Day del BSOP Millions 2026 con 312 entradas y R$ 612.400 en premios. Borra recibi\u00f3 R$ 128.000 tras vencer a Allan Rasmus Dyrstad (R$ 85.000, runner-up). Agust\u00edn Borges, compatriota, lleg\u00f3 a la mesa final en sexta posici\u00f3n con R$ 23.000. Este es el tercer t\u00edtulo argentino en la edici\u00f3n, tras Nicol\u00e1s Sagra y Gonzalo Almeida.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-21", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-21-c70528a7", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Octavio Borra (Argentina) gana el R$ 2.500 One Day del BSOP Millions por R$ 128.000"}, {"bajada": "El empresario brasile\u00f1o Jeferson Zaminhan, conocido como \u0027Par\u00e1\u0027, conquist\u00f3 el 6K 2-Day DeepStack del BSOP Millions 2026 con 171 entradas, ganando R$ 190.000. Se convierte en el tercer jugador con dos t\u00edtulos en esta edici\u00f3n, despu\u00e9s de Gabriel N\u00f3brega y Fabiano Kovalski. Diego Sorgatto (runner-up, R$ 127.000) y Marcelo Giordano (tercero, R$ 83.000) completaron el podio. La mesa final incluy\u00f3 a argentinos Blas Torres (quinto, R$ 48.400) y Francisco De Belaustegui (s\u00e9ptimo, R$ 29.000).", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-21", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-21-031869d9", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Jeferson Zaminhan (\u0027Par\u00e1\u0027) gana el 6K 2-Day DeepStack del BSOP Millions, tercer bicampe\u00f3n"}, {"bajada": "PokerStars, GGPoker y 888 confirman su salida del mercado de Nueva Zelanda tras no asegurar licencia en la nueva regulaci\u00f3n de juego en l\u00ednea. Flutter Entertainment, empresa matriz de PokerStars, no logr\u00f3 superar la etapa de elegibilidad del proceso de solicitud. Desde el 26 de noviembre, PokerStars dejar\u00e1 de estar disponible en el pa\u00eds; operar sin licencia v\u00e1lida conlleva multas significativas y bloqueo de ISP.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-11-20", "foto": "", "fuente": "GamblingNews", "id": "2026-11-20-3cfae078", "nf": 3, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "PokerStars, GGPoker y 888 se retiran de Nueva Zelanda antes del 26 de noviembre"}, {"bajada": "Resorts World New York City abrir\u00e1 una sala de poker con 30 mesas a mediados de diciembre, marcando la primera sala de poker en casino de Nueva York. La apertura est\u00e1 prevista para el 17 de diciembre como parte de un proyecto de expansi\u00f3n de US$ 5.5 mil millones. La sala cobrar\u00e1 rake del 10% con tope de US$ 10, similar a otras salas de la regi\u00f3n.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-20", "foto": "", "fuente": "CardPlayer", "id": "2026-11-20-3ebc5ac3", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Resorts World NYC abre sala de poker de 30 mesas en diciembre"}, {"bajada": "Jonathan Jaffe se impuso en el evento de US$ 50.000 no-limit hold\u0027em eight-max del Triton North Cyprus 2026, con 140 entradas, para sumar su tercer trofeo Triton. El jugador de 39 a\u00f1os declar\u00f3 que fue su tercera victoria en la serie de high stakes; sus dos triunfos anteriores fueron en Monte Carlo 2023 y Jeju 2025. Con esta victoria, Jaffe acumula casi US$ 24.5 millones en ganancias de por vida.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-20", "foto": "", "fuente": "CardPlayer", "id": "2026-11-20-9dd0852f", "nf": 2, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Jonathan Jaffe gana el Triton North Cyprus $50.000 eight-max por US$ 1.627.000"}, {"bajada": "Maurice Hawkins se impuso en el evento de US$ 600 no-limit hold\u0027em del WSOP Circuit en Caesars New Orleans, ganando su 27\u00ba anillo y extendiendo su r\u00e9cord. Hawkins, que ha registrado 63 cashes en 2026 con seis anillos este a\u00f1o, ampl\u00eda su ventaja a cinco anillos sobre Daniel Lowery. El premio fue de US$ 13.873 y eleva sus ganancias de carrera a US$ 7.849.898.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-20", "foto": "", "fuente": "CardPlayer", "id": "2026-11-20-049e410f", "nf": 2, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Maurice Hawkins gana su 27\u00ba anillo WSOP Circuit en New Orleans"}, {"bajada": "Alex Anton, en su viaje al Asian Poker Tour Championship de Taip\u00e9i, ha acumulado US$ 2.5 millones en ganancias durante 2026 con dos brazaletes WSOP (uno en vivo, uno en l\u00ednea) y un t\u00edtulo Triton. El jugador ha jugado en Corea del Sur, Iowa, California y Europa antes de llegar a Taip\u00e9i, donde se disputa el Super High Roller de TWD 825.000 (aproximadamente US$ 25.000).", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-11-20", "foto": "", "fuente": "PokerNews", "id": "2026-11-20-da7ab810", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "Alex Anton en Asian Poker Tour Championship en Taip\u00e9i tras breakout 2026"}, {"bajada": "El PGT KickOff Online de CoinPoker ha pagado US$ 25.96 millones en los primeros nueve d\u00edas de su calendario de 23 d\u00edas, con m\u00e1s de US$ 27 millones en garant\u00edas restantes antes de cerrar el 30 de noviembre. El festival ha registrado 815.059 entradas de 34.955 jugadores de 175 pa\u00edses a trav\u00e9s de 300 eventos completados. El campo fue el $215 CoinMillion [2-Day] con 5.081 entradas.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-11-20", "foto": "", "fuente": "CardPlayer", "id": "2026-11-20-ccc60d9f", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "CoinPoker PGT KickOff Online ha pagado US$ 25.96 millones en nueve d\u00edas"}, {"bajada": "La empresa sueca Betsson ha lanzado p\u00f3ker en l\u00ednea en Francia, convirti\u00e9ndose en el noveno operador con licencia en el mercado regulado del pa\u00eds. Betsson se une a la red iPoker Europe en la jurisdicci\u00f3n francesa.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-11-20", "foto": "", "fuente": "Poker Industry PRO", "id": "2026-11-20-beca70ec", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "Betsson lanza p\u00f3ker en l\u00ednea en Francia como noveno operador regulado"}, {"bajada": "El jugador \u0027GucciNIKE\u0027 derrot\u00f3 a Jared Bleznick en 5-card pot-limit Omaha en CoinPoker con una victoria de aproximadamente US$ 600.000. Los juegos llegaron hasta US$ 500-$1.000, con preflop agresi\u00f3n pesada caracterizando muchas de las manos.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-20", "foto": "", "fuente": "CardPlayer", "id": "2026-11-20-330c872b", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "GucciNIKE gana US$ 600.000 en PLO5 contra Jared Bleznick en CoinPoker"}, {"bajada": "Xiang Zou se impuso en el $350 Mini Main Event del Borgata Fall Poker Open 2026 con 1.515 entradas, ganando su primer trofeo Borgata y US$ 80.000.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-20", "foto": "", "fuente": "PokerNews", "id": "2026-11-20-1cd5262d", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Xiang Zou gana el Borgata Fall Poker Open $350 Mini Main Event por US$ 80.000"}, {"bajada": "Juan Pardo, de M\u00e1laga, termin\u00f3 cuarto en el evento de US$ 50.000 no-limit hold\u0027em eight-max del Triton North Cyprus 2026, embols\u00e1ndose US$ 602.000. El torneo reuni\u00f3 140 entradas en el Merit Royal Diamond Hotel \u0026 Spa generando bolsa de US$ 7.000.000. Pardo a\u00fan persigue su primer tridente en la serie Triton.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-20", "foto": "", "fuente": "PokerNews en espa\u00f1ol", "id": "2026-11-20-71d1c81d", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Juan Pardo [nacionalidad a confirmar], cuarto en el Triton North Cyprus $50.000 eight-max por US$ 602.000"}, {"bajada": "Carlos Serrano (Colombia) finaliz\u00f3 quinto en el 50K Super High Roller 1-Day del BSOP Millions 2026, con 33 registros, ganando R$ 101.820; fue el \u00fanico extranjero entre los seis premiados. Sebasti\u00e1n Fonseca (Colombia) lleg\u00f3 al heads-up del 4K Freezeout con 158 registros pero fue derrotado por Kaio Camargo. El festival se desarrolla del 13 al 28 de noviembre en el WTC Sheraton, S\u00e3o Paulo.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-20", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-20-dad10284", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Carlos Serrano y Sebasti\u00e1n Fonseca destacan en BSOP Millions 2026 en S\u00e3o Paulo"}, {"bajada": "Darci Fantin encabeza el D\u00eda 2 del 100K Super High Roller (buy-in R$ 100.000) del BSOP Millions 2026 con 1.275.000 fichas tras la jornada inaugural con 38 inscritos y 13 en dinero. Fabiano Kovalski y Andr\u00e9 Moreira, ganador del 75K Super High Roller, tambi\u00e9n avanzan.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-20", "foto": "", "fuente": "PokerNews Brasil", "id": "2026-11-20-27c5906e", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Darci Fantin [nacionalidad a confirmar] lidera D\u00eda 2 del 100K Super High Roller en BSOP Millions"}, {"bajada": "Gal Yifrach se llev\u00f3 el t\u00edtulo del PokerStars North American Poker Tour Main Event en noviembre de 2025, con un premio de US$ 543.025 desde un buy-in de US$ 5.300. Seg\u00fan PokerNews, Yifrach posee un brazalete WSOP y acumula m\u00e1s de US$ 2,9 millones en ganancias de torneos en vivo.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-19", "foto": "", "fuente": "PokerNewsDaily", "id": "2026-11-19-fe0a9fcf", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Gal Yifrach gana el PokerStars NAPT Main Event por US$ 543.025"}, {"bajada": "Joe McKeehen captur\u00f3 su sexto t\u00edtulo de 2026 al vencer el Borgata Fall Poker Open en Atlantic City, derrotando un field de 482 jugadores para ganar US$ 210.500. McKeehen fue campe\u00f3n mundial en 2015.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-19", "foto": "", "fuente": "CardPlayer", "id": "2026-11-19-99537d20", "nf": 2, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Joe McKeehen gana el Borgata Fall Poker Open con 482 entradas por US$ 210.500"}, {"bajada": "Esta es su segunda victoria en un evento id\u00e9ntico de Triton (gan\u00f3 el mismo torneo en 2024 en Montenegro), y con los bounties pendientes de apertura, sus ganancias superar\u00e1n el mill\u00f3n de d\u00f3lares.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-19", "foto": "", "fuente": "CardPlayer", "id": "2026-11-19-a7e3433a", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Artsiom Lasouski gana el Triton North Cyprus $40.000 Mystery Bounty por US$ 679.000"}, {"bajada": "El 12 de noviembre, la Oficina del Sheriff Harris ejecut\u00f3 \u00f3rdenes de allanamiento en Katy Poker Room, ubicada al oeste de Houston. Cuatro personas fueron arrestadas. La investigaci\u00f3n, llevada a cabo durante aproximadamente un a\u00f1o, determin\u00f3 que el lugar cobraba rake ilegalmente de cada mano, violando la ley de juego de Texas. El Harris, Sean Teare, declar\u00f3 que los jugadores eran enga\u00f1ados al perder un porcentaje de sus ganancias.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-11-19", "foto": "", "fuente": "CardPlayer", "id": "2026-11-19-00d12ef4", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "Allanamiento en Katy Poker Room (Houston) por operaci\u00f3n de apuestas ilegal"}, {"bajada": "Sky Poker complet\u00f3 su migraci\u00f3n de la red Playtech iPoker hacia la red PokerStars Network (PSN), finalizando la migraci\u00f3n de redes de Flutter.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-11-19", "foto": "", "fuente": "Poker Industry PRO", "id": "2026-11-19-2ac8bc00", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "Sky Poker migra de iPoker a PokerStars Network"}, {"bajada": "El European Poker Tour regresa a Praga del 2 al 13 de diciembre con un cronograma completo. El evento estrella es el \u20ac5.300 EPT Main Event, con el t\u00edtulo defensor Matan Krakow ganador del a\u00f1o anterior por \u20ac778.255. El festival incluye juegos mixtos, high rollers y el \u20ac1.100 PokerStars Open Main Event.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-19", "foto": "", "fuente": "PokerNews", "id": "2026-11-19-73d9cd08", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "EPT Prague 2026 anuncia cronograma de diciembre con Main Event \u20ac5.300"}, {"bajada": "Ignition Casino estren\u00f3 el 19 de noviembre en su canal de YouTube la serie \"Y\u0027All In\", un reality de viaje y comedia que presenta a jugadores profesionales de poker, comediantes y celebridades en un recorrido por Texas. El elenco incluye a Jared Bleznick (con m\u00e1s de US$ 10 millones en ganancias en vivo y un brazalete WSOP), Jeremy Becker y Lexy Gavin-Mather, junto con comediantes. David Tuchman act\u00faa como presentador.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-11-19", "foto": "", "fuente": "CardPlayer", "id": "2026-11-19-4480c917", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "Ignition Casino lanza serie de realidad \"Y\u0027All In\" con jugadores de poker y celebridades"}, {"bajada": "Wilson Guti\u00e9rrez, de Bucaramanga, Colombia, invirti\u00f3 solo US$ 22 en un sat\u00e9lite organizado por el embajador del circuito Sebasti\u00e1n Fonseca y se gan\u00f3 el bounty de R$ 1.000.000 (aproximadamente US$ 173.000) en el Start-Up Mystery Million del BSOP Millions 2026. El torneo, con entrada de R$ 1.500 (US$ 260), fue jugado en el WTC Sheraton de S\u00e3o Paulo.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-19", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-19-35e71120", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Wilson Guti\u00e9rrez, colombiano, abre el sobre de R$ 1 mill\u00f3n en BSOP Millions Start-Up Mystery Million"}, {"bajada": "J\u00eaniffer Ritter, jugadora brasile\u00f1a, finaliz\u00f3 tercera en el GGMasters High Roller US$ 1.050 de GGPoker con un premio de US$ 75.435, el de su carrera. El torneo reuni\u00f3 739 entradas y distribuy\u00f3 US$ 750.000. Ritter fue la \u00fanica brasile\u00f1a en la mesa final.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-19", "foto": "", "fuente": "PokerNews Brasil", "id": "2026-11-19-975c997d", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "J\u00eaniffer Ritter tercera en GGMasters High Roller US$ 1.050 por US$ 75.435"}, {"bajada": "Fabiano Kovalski replic\u00f3 su victoria en el 50K Super High Roller 1-Day, ganando R$ 600.000 en su segundo t\u00edtulo del festival, sumando R$ 1.240.000. Carlos Serrano, colombiano, finaliz\u00f3 quinto en el mismo torneo por R$ 101.820, demostrando regularidad en el circuito brasile\u00f1o. Serrano fue en 2025 el primer extranjero en ganar el Campeonato Brasile\u00f1o de Poker.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-19", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-19-573be004", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Fabiano Kovalski y Carlos Serrano destacados en BSOP Millions con dos t\u00edtulos y mesa final"}, {"bajada": "Gonzalo Almeida, argentino, venci\u00f3 en el R$ 10.000 2-Day High Roller PKO del BSOP Millions 2026 con 132 inscripciones. En la mesa final tambi\u00e9n particip\u00f3 Carlos Serrano, que termin\u00f3 s\u00e9ptimo. Este fue el primer triunfo argentino en un High Roller del festival.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-19", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-19-9f4cf737", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Gonzalo Almeida gana el R$ 10.000 2-Day High Roller PKO del BSOP Millions por R$ 243.000"}, {"bajada": "El campe\u00f3n WSOP 2015 McKeehen venci\u00f3 a Jason Nguyen en heads-up tras una batalla de casi tres horas para llevarse el t\u00edtulo del evento $2.700. McKeehen elogi\u00f3 el juego de su oponente pero fue cr\u00edtico con su propia actuaci\u00f3n. Su victoria se suma a otros resultados recientes: Seminole Hard Rock Poker Open Championship por US$ 460.000, dos eventos WSOP Circuit en Atlantic City y un evento US$ 10.000 en PokerGo Las Vegas.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-18", "foto": "", "fuente": "PokerNews", "id": "2026-11-18-0fd89f2e", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Joe McKeehen gana el Borgata Fall Poker Open Championship por US$ 210.500"}, {"bajada": "Garcia captur\u00f3 su primer t\u00edtulo de Main Event en circuito y su cuarto anillo WSOP Circuit al vencer un field de 666 entradas en Elgin, Illinois. Comenz\u00f3 el d\u00eda final como chip leader y mantuvo esa posici\u00f3n durante casi toda la mesa final. Con esta victoria, sus ganancias en torneos live superan los US$ 4 millones. Brian Batt termin\u00f3 como runner-up con US$ 121.638.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-18", "foto": "", "fuente": "WSOP.com", "id": "2026-11-18-a18d0950", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Cord Garcia gana el WSOP Circuit Grand Victoria Main Event por US$ 182.455"}, {"bajada": "Aslanli logr\u00f3 su primer t\u00edtulo en Triton tras derrotar a Daniel Dvoress en heads-up en un torneo eight-max. Aslanli remont\u00f3 desde una posici\u00f3n desfavorable durante una batalla que incluy\u00f3 grandes oscilaciones antes de cerrar el t\u00edtulo.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-18", "foto": "", "fuente": "CardPlayer", "id": "2026-11-18-15aff767", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Rafael Aslanli gana el Triton North Cyprus $30.000 High Roller por US$ 1.149.000"}, {"bajada": "El jugador turco Bedir, de 44 a\u00f1os, captur\u00f3 su primer trofeo Triton al vencer un field de 218 entradas en el evento inaugural de la serie. Su victoria representa su mejor resultado en carrera y lo posiciona en segundo lugar en la lista de ganancias de Turqu\u00eda, con US$ 8,4 millones en total, por detr\u00e1s de Orpen Kisacikoglu (US$ 24,8 millones).", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-18", "foto": "", "fuente": "CardPlayer", "id": "2026-11-18-78100c2a", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Selahaddin Bedir gana el Triton North Cyprus $25.000 Kickoff Event por US$ 1.093.000"}, {"bajada": "El jugador ruso Karmatckii logr\u00f3 un resultado personal r\u00e9cord al ganar el torneo de mayor buy-in en Triton ONE, venciendo un field de 488 entradas. Su premio llev\u00f3 su ganancia en torneos live a US$ 6,4 millones. Karmatckii se\u00f1al\u00f3 que cada cuatro a\u00f1os marca un hito en su carrera: hace cuatro a\u00f1os tuvo su mejor cash en Merit, y hace ocho a\u00f1os gan\u00f3 el EPT Sochi 2018.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-18", "foto": "", "fuente": "CardPlayer", "id": "2026-11-18-a7070b2c", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Arsenii Karmatckii gana el Triton ONE $15.000 High Roller por US$ 1.325.000"}, {"bajada": "El jugador de altos niveles israel\u00ed Yifrach se declar\u00f3 culpable de dos cargos por operar un negocio de juego ilegal y conspiraci\u00f3n para lavar dinero a trav\u00e9s de una sala de m\u00e1quinas tragamonedas entre 2018 y 2022. Ser\u00e1 sentenciado a prisi\u00f3n federal el 25 de enero de 2027 y probablemente ser\u00e1 deportado tras cumplir su condena. Yifrach fue detenido por ICE en el aeropuerto de LAX en julio despu\u00e9s de regresar de un viaje al extranjero.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-11-18", "foto": "", "fuente": "PokerNews", "id": "2026-11-18-bd9e434e", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "Gal Yifrach se declara culpable de juego ilegal y enfrenta deportaci\u00f3n de EE.UU."}, {"bajada": "CoinPoker es patrocinador oficial del Celebrity Poker Tour Championship Season III, una final que se juega el 18 de noviembre en Las Vegas con US$ 100.000 en premios totales (US$ 70.000 en dinero m\u00e1s un paquete de US$ 30.000 que incluye entrada al Main Event WSOP 2027 y una semana en Baha Mar). El campo incluye celebridades de deportes, entretenimiento y redes sociales, con participantes como el linebacker retirado Willie McGinest y el anunciador UFC Bruce Buffer. El streamer N3on gan\u00f3 el Invitational XIII en septiembre sin experiencia previa en torneos.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-18", "foto": "", "fuente": "CardPlayer", "id": "2026-11-18-16c53133", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "CoinPoker patrocina el Celebrity Poker Tour Championship $100.000 en Las Vegas"}, {"bajada": "El festival es el de Stake.us en ganancias garantizadas, superando Century Millions (mayo) y World KO Championship Poker Series (verano), ambos con 1 mill\u00f3n garantizado.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-18", "foto": "", "fuente": "Pokerfuse", "id": "2026-11-18-ee865238", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Stake Poker ejecuta su mayor festival de torneos con la Jacked Poker Series"}, {"bajada": "GTO Wizard, descrita como la plataforma n\u00famero uno de entrenamiento en poker, celebra su 6\u00ba aniversario ofreciendo acceso gratuito completo a su suscripci\u00f3n Elite a todos los usuarios del 16 al 23 de noviembre. El evento incluye acceso a todas las caracter\u00edsticas para Hold\u0027em y Pot-Limit Omaha. Adem\u00e1s, el Head Coach Tom Tombos21 Boshoff conducir\u00e1 transmisiones educativas diarias en YouTube del 17 al 21 de noviembre, mostrando trucos para maximizar el conocimiento de la plataforma.", "cat": "Software", "credito": "", "destacada": false, "dia": "2026-11-18", "foto": "", "fuente": "PokerNews", "id": "2026-11-18-7d794b53", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "GTO Wizard celebra su 6\u00ba aniversario con acceso gratuito a Elite durante una semana"}, {"bajada": "El jugador catarinense Emanuel Maluf, del equipo BitB, super\u00f3 un field de 131 entradas en el R$ 10.000 2-Day High Roller para capturar el t\u00edtulo y R$ 265.000. Esta es su segunda victoria en el 2-Day High Roller del BSOP Millions: en 2024 gan\u00f3 el mismo evento con un buy-in de R$ 25.000, derrotando a Alisson Piekazewicz en heads-up para llevar R$ 595.075. En esta edici\u00f3n, Maluf derrot\u00f3 a Marcelo Takashi en heads-up, quien fue runner-up con R$ 177.000.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-18", "foto": "", "fuente": "PokerNews Brasil", "id": "2026-11-18-5f47713c", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Emanuel Maluf [nacionalidad a confirmar] gana el 2-Day High Roller del BSOP Millions 2026 por R$ 265.000"}, {"bajada": "El jugador paranaense Daniel Almeida, integrante del Midas Team, captur\u00f3 el 50K Super High Roller Invitational tras comenzar la mesa final con el stack m\u00e1s peque\u00f1o y doblar en momentos decisivos. Almeida derrot\u00f3 a Gil Ara\u00fajo \"Gil Cebola\" en heads-up, con un prize pool r\u00e9cord de R$ 6.852.150 (152 entradas). Gil qued\u00f3 como runner-up con R$ 1.118.400 y el portugu\u00e9s Pedro Neves tercero con R$ 960.850. El jugador de f\u00fatbol Neymar Jr. fue uno de los 152 participantes pero fue eliminado en la burbuja de la mesa final.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-18", "foto": "", "fuente": "PokerNews Brasil", "id": "2026-11-18-e5637f53", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Daniel Almeida gana el 50K Super High Roller Invitational del BSOP Millions 2026 por R$ 1.360.150"}, {"bajada": "El jugador portugu\u00e9s Andr\u00e9 Moreira lleg\u00f3 como l\u00edder dominante al D\u00eda Final del 75K Super High Roller del BSOP Millions 2026 con casi el triple de fichas que su m\u00e1s cercano perseguidor, con 29 inscripciones finales. Moreira mantuvo su ventaja durante la etapa final, derrotando a Alisson Piekazewicz en heads-up, quien qued\u00f3 como runner-up con R$ 562.000. Kelvin Kerber termin\u00f3 tercero con R$ 345.000 y Ariel Bah\u00eda cuarto con R$ 185.000.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-18", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-18-d26c3dda", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Andr\u00e9 Moreira gana el 75K Super High Roller del BSOP Millions 2026 por R$ 920.000"}, {"bajada": "Troy Mclean, de Australia, gan\u00f3 el Event #1: TWD 16,000 National Cup Championship del APT Championship 2026 en Taipei, superando un campo r\u00e9cord de 2.459 entradas. Mclean cerr\u00f3 con una ganancia de TWD 3.256.000 (~$99.880) tras una aceptaci\u00f3n de trato de tres v\u00edas y asegur\u00f3 un lugar en el Main Event de TWD 330.000 que comienza el 23 de noviembre.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-17", "foto": "", "fuente": "PokerNews", "id": "2026-11-17-6d370c94", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Troy Mclean gana el Event #1 National Cup Championship de APT Taipei con 2.459 registros"}, {"bajada": "Luis Vargas gan\u00f3 el RunGood Poker Series Golden Expedition San Antonio $600 Main Event en Lodge Card Club, superando 386 entradas y ganando $37,579. Es su primer t\u00edtulo RunGood, su primer cash en la serie y el mayor resultado en vivo de su carrera.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-17", "foto": "", "fuente": "PokerNews", "id": "2026-11-17-5a9ac2e1", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Luis Vargas gana el primer Main Event de RGPS San Antonio"}, {"bajada": "Tras una investigaci\u00f3n interna, Hustler Casino Live confirm\u00f3 que no encontr\u00f3 evidencia de trampa, colusi\u00f3n o soft-playing de Britney Jing. Sin embargo, hall\u00f3 que ella ten\u00eda un inter\u00e9s financiero en Chengsi \"C Ye\" Ye mientras ambos jugaban en el mismo juego, violando las pol\u00edticas de conflicto de intereses de la sala. Ambos jugadores fueron suspendidos de las transmisiones de HCL por un per\u00edodo no especificado.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-11-17", "foto": "", "fuente": "PokerNews", "id": "2026-11-17-7beac128", "nf": 4, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "Hustler Casino Live descarta trampas en Britney Jing pero suspende a dos jugadores por conflicto de intereses"}, {"bajada": "Tomas Geleziunas, que vuela la bandera lituana pero es figura reconocida del circuito de p\u00f3ker irland\u00e9s, gan\u00f3 el \u20ac500 No Limit Hold\u0027em Main Event del PartyPoker Tour Cork. Con 342 entradas que generaron una piscina de premios de \u20ac152.635, Geleziunas asegur\u00f3 \u20ac25.500 tras un trato heads-up con Curtis Harrison, su cuarta mayor ganancia en vivo.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-17", "foto": "", "fuente": "PokerNews", "id": "2026-11-17-4eead584", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Tomas Geleziunas gana el PartyPoker Tour Main Event Cork por \u20ac25.500"}, {"bajada": "Artsiom Batsian gan\u00f3 el \u20ac1.500 Main Event de WSOP Circuit en Casino Middelkerke, B\u00e9lgica, superando 259 entradas y ganando \u20ac75.000. Es su primer anillo WSOPC y su mejor score en vivo, derrotando a Samy Barka en la final.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-17", "foto": "", "fuente": "PokerNews", "id": "2026-11-17-e8f8613e", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Artsiom Batsian gana su primer anillo WSOP Circuit en Casino Middelkerke por \u20ac75.000"}, {"bajada": "Los cuatro principales operadores de p\u00f3ker sweepstakes de EE.UU. est\u00e1n realizando sus series de torneos insignia este mes, con garant\u00edas que suman US$ 11,5 millones, en momentos en que un n\u00famero creciente de estados busca restringir o prohibir el modelo de sweepstakes.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-11-17", "foto": "", "fuente": "Poker Industry PRO", "id": "2026-11-17-267b4cdd", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "Operadores de sweepstakes de EE.UU. garantizan US$ 11,5 millones en cuatro series principales de torneos"}, {"bajada": "SolPoker anunci\u00f3 que cualquier jugador firmado puede abrir una mesa de cash p\u00fablica o privada, establecer la variante de juego o permitir que el bot\u00f3n elija entre cinco modos de juego cada mano, y cambiar las apuestas por votaci\u00f3n mayoritaria. Las mesas no cobran rake y todos los juegos son verificables on-chain en USDC con dep\u00f3sitos en SOL.", "cat": "Torneos y even primer t\u00edtulo Triton y su segundo score de siete cifras, llevando sus ganancias de por vida a m\u00e1s de $3.7 millones.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-16", "foto": "", "fuente": "CardPlayer", "id": "2026-11-16-57b4aa4c", "nf": 3, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Raoul Kanme gana el Triton ONE North Cyprus Main Event por US$ 1.320.000"}, {"bajada": "WPT Global anunci\u00f3 que cesar\u00e1 sus operaciones en Nueva Zelanda a partir del 1 de diciembre, fecha l\u00edmite establecida por la nueva ley de casinos en l\u00ednea de ese pa\u00eds para proveedores que no soliciten una licencia.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-11-16", "foto": "", "fuente": "Poker Industry PRO", "id": "2026-11-16-56feab83", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "WPT Global se retira de Nueva Zelanda antes del 1 de diciembre"}, {"bajada": "El profesional Gabriel N\u00f3brega conquist\u00f3 dos t\u00edtulos en 24 horas durante la etapa inicial del BSOP Millions 2026 en S\u00e3o Paulo: el 25K 1-Day High Roller (R$ 380.000, derrotando a Felipe Zhou en heads-up) y el 6K 2-Day Mystery Bounty (R$ 102.000 m\u00e1s R$ 67.000 en bounties).", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-16", "foto": "", "fuente": "PokerNews Brasil", "id": "2026-11-16-22f4ac05", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Gabriel N\u00f3brega [nacionalidad a confirmar] gana dos torneos en el BSOP Millions 2026"}, {"bajada": "El dominicano Francis Cruz Pe\u00f1a se coron\u00f3 campe\u00f3n del Evento #12 US$ 3.000 High Roller de la WSOP Circuit Panam\u00e1 2026 en el Sortis Hotel, Spa \u0026 Casino. Con 53 registros y US$ 159.000 recaudados, Cruz lleg\u00f3 a la final como chip leader y derrot\u00f3 en heads-up al paname\u00f1o Hertsel Levy.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-16", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-16-78eb1169", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Francis Cruz gana su primer anillo WSOP Circuit en Panam\u00e1 con High Roller US$ 3.000"}, {"bajada": "El salvadore\u00f1o Eduardo Ventura Guerra se coron\u00f3 campe\u00f3n del Evento #11 US$ 500 The Closer NLH de la WSOP Circuit Panam\u00e1 2026 con una remontada desde la sexta posici\u00f3n de la mesa final. Ventura derrot\u00f3 al guatemalteco Mario Del Valle en heads-up y se llev\u00f3 US$ 28.196 en efectivo m\u00e1s un paquete de US$ 5.000 para las WSOP Bahamas.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-16", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-16-bc4851c5", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Eduardo Ventura gana su primer anillo WSOP Circuit Panam\u00e1 en The Closer US$ 500"}, {"bajada": "Resorts World New York City, ubicado en Queens cerca del aeropuerto JFK, tiene previsto inaugurar su primera sala de poker a finales de a\u00f1o, posiblemente el 17 de diciembre seg\u00fan reportes de la comunidad. Ser\u00eda la primera sala de poker dentro de los l\u00edmites de Nueva York City, una regi\u00f3n metropolitana con m\u00e1s de 20 millones de residentes. PokerNews confirm\u00f3 que la sala est\u00e1 en planes, aunque la direcci\u00f3n de relaciones p\u00fablicas del casino no respondi\u00f3 las solicitudes de comentarios.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-15", "foto": "", "fuente": "PokerNews", "id": "2026-11-15-fe22ef52", "nf": 2, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Resorts World NYC planea abrir sala de poker en diciembre"}, {"bajada": "Sangannagari, con cinco anillos WSOP Circuit entre online y live, se impuso en la final de siete jugadores del evento $500 No-Limit Hold\u0027em del Borgata Fall Poker Open 2026. El campe\u00f3n, que acumula cerca de US$ 1,4 millones en ganancias live y m\u00e1s de US$ 1,9 millones online, comenz\u00f3 tercero en fichas pero control\u00f3 la mesa. Su mano decisiva fue un limped pocket aces heads-up contra John McDonald, quien check-calle\u00f3 bets en todas las calles con solo cuarta pareja.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-15", "foto": "", "fuente": "PokerNews", "id": "2026-11-15-c1421767", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Sridhar Sangannagari gana el BetMGM Hybrid $500 del Borgata Fall Poker Open por US$ 22.050"}, {"bajada": "La serie \"Y\u0027All In\", producida por Artisans On Fire, debutar\u00e1 en YouTube el 19 de noviembre como un reality show de poker, comedia y viajes que recorre Texas. El elenco incluye a los jugadores Jared Bleznick, Lexy Gavin-Mather, Jeremy Becker, Xuan Liu y Tyson Apostol, junto a celebridades como el luchador Mick Foley y el comediante Tony Hinchcliffe. El programa combina entretenimiento y personalidades del poker m\u00e1s all\u00e1 de lo que sucede en la mesa.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-11-15", "foto": "", "fuente": "PokerNews", "id": "2026-11-15-f04a19cb", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "Nuevo reality show \"Y\u0027All In\" estrena en YouTube con jugadores de poker y celebridades"}, {"bajada": "El WSOP Circuit inicia en Caesars New Orleans del 12 al 23 de noviembre de 2026 con 18 eventos ring. El Main Event de US$ 1.700 No-Limit Hold\u0027em, que comienza el 19 de noviembre, cuenta con US$ 500.000 garantizados y tres vuelos iniciales de 40.000 fichas. Todos los ganadores de ring en la serie reciben un paquete WSOP Paradise 2026 de US$ 5.000. En mayo, Corey Harrison gan\u00f3 el Main Event anterior en Nueva Orleans con 420 entradas y US$ 122.221.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-15", "foto": "", "fuente": "WSOP.com", "id": "2026-11-15-20cf2773", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "WSOP Circuit regresa a Caesars New Orleans con 18 eventos y Main Event de US$ 1.700"}, {"bajada": "Un club de poker en Toronto se reh\u00fasa a pagar un bad beat que se activ\u00f3 cuando AAAQQ+ perdi\u00f3 con una mano m\u00ednima de US$ 20. El incidente ha generado discusi\u00f3n en la comunidad de reddit sobre la obligaci\u00f3n de los establecimientos de cumplir con sus promesas de bad beat.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-11-15", "foto": "", "fuente": "Reddit r/poker", "id": "2026-11-15-2505c2d4", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "Club de Toronto se niega a pagar bad beat de US$ 30.000"}, {"bajada": "Aunque ha participado en livestreams como The Lodge Card Club ($50/$100/$200), Jumalon prefiere ser selectivo con sus partidas de cash. Ha considerado un potencial buy-in de US$ 250.000 para 2027.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-11-15", "foto": "", "fuente": "PokerNews", "id": "2026-11-15-66ad66b4", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "Lucas Jumalon rechaz\u00f3 jugar en enorme cash game de Hustler Casino Live con Negreanu"}, {"bajada": "El Evento #3 Main Event de US$ 1.700 de la WSOP Circuit Panam\u00e1 2026 re\u00fane nueve finalistas tras recibir 596 registros y superar largamente su garant\u00eda de US$ 500.000 al alcanzar US$ 1.013.200 en recaudaci\u00f3n. El paname\u00f1o Hertsel Levy lidera con 6,8 millones de fichas (67 big blinds), seguido por el venezolano Luis P\u00e9rez Marrero con 5,9 millones y el colombiano Santiago Montes con 5,8 millones, quien busca su segundo anillo del festival. Los nueve finalistas tienen asegurado US$ 10.000, con primer lugar de US$ 160.000.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-15", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-15-d72a736e", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Main Event WSOP Circuit Panam\u00e1 2026 avanza con nueve finalistas tras duplicar garant\u00eda"}, {"bajada": "PokerStars anunci\u00f3 el calendario 2027 del European Poker Tour con paradas en Par\u00eds, Montecarlo, Barcelona, Malta y Praga. El principal cambio es la reducci\u00f3n del buy-in de los Main Events de \u20ac5.300 a \u20ac5.000. Adem\u00e1s, se unific\u00f3 el costo de los Main Events de los PokerStars Open a \u20ac1.250 (antes variaba entre \u20ac1.100 y \u20ac1.650 seg\u00fan si coincid\u00eda con EPT). El director de eventos Cedric Billot se\u00f1al\u00f3 que el cambio responde a la retroalimentaci\u00f3n de jugadores.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-15", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-15-32387cc9", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "EPT 2027 reduce buy-in de Main Events a \u20ac5.000 y unifica PokerStars Open"}, {"bajada": "Umut Ozturk, ganador del MSPT Player of the Year en dos ocasiones, conquist\u00f3 el MSPT Riverside Casino Main Event el fin de semana pasado, su tercera victoria en un Main Event de la serie durante la temporada 17.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-14", "foto": "", "fuente": "tightpoker.com", "id": "2026-11-14-ae1dfd8e", "nf": 2, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Umut Ozturk gana su tercer MSPT Main Event de 2026"}, {"bajada": "Martin Zamani, estadounidense, se convirti\u00f3 en el segundo jugador de la historia en ganar cinco brazaletes WSOP en torneos online al vencer en el No-Limit Hold\u0027em Fall Saver de US$500. Zamani derrot\u00f3 a Shane Martin en heads-up y se llev\u00f3 US$51.331 con un field de 610 entradas. David Peters (octava posici\u00f3n) y James Collopy (s\u00e9ptima posici\u00f3n) tambi\u00e9n participaron en una mesa final de alto nivel.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-14", "foto": "", "fuente": "PokerNews en espa\u00f1ol", "id": "2026-11-14-03862615", "nf": 2, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Martin Zamani iguala el r\u00e9cord con su quinto brazalete WSOP online"}, {"bajada": "Vitaly Kovyazin, contratista de Nueva York con cashes desde 2004, derrot\u00f3 a Omar Taveras en heads-up del Borgata Fall Poker Open Half-A-Milly Almighty (US$600) para ganar US$88.315 y los trofeos de Borgata y BetMGM Poker. El evento reuni\u00f3 1.006 entradas.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-14", "foto": "", "fuente": "PokerNews", "id": "2026-11-14-4d90cb35", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Vitaly Kovyazin gana el Borgata Half-A-Milly Almighty por US$88.315"}, {"bajada": "PokerStars lanz\u00f3 el calendario del European Poker Tour 2027 con cinco festivales principales y tres paradas regionales adicionales confirmadas. El principal cambio es que el buy-in del Main Event se redujo de \u20ac5.300 a \u20ac5.000 por primera vez en m\u00e1s de una d\u00e9cada.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-14", "foto": "", "fuente": "tightpoker.com", "id": "2026-11-14-a7099353", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "PokerStars anuncia calendario del EPT 2027 con cinco paradas principales"}, {"bajada": "Daniel Negreanu, ocho veces campe\u00f3n de brazalete WSOP, y su esposa Amanda Negreanu dieron la bienvenida a su primer hijo juntos, un ni\u00f1o llamado Roman Negreanu, nacido el viernes 13 de noviembre. Negreanu eligi\u00f3 el nombre por su conexi\u00f3n con sus ra\u00edces rumanas y su admiraci\u00f3n por el jugador de hockey Roman Josi.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-11-14", "foto": "", "fuente": "PokerNews", "id": "2026-11-14-fe182599", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "Daniel Negreanu y su esposa Amanda reciben a su primer hijo"}, {"bajada": "El Main Event del WSOP Circuit Panam\u00e1 2026 (Evento #3, US$1.700 buy-in) alcanz\u00f3 596 registros y una recaudaci\u00f3n de US$1.013.200, superando el doble de su bolsa garantizada de US$500.000. Tras cinco vuelos clasificatorios, 58 jugadores avanzaron al D\u00eda 2.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-14", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-14-0ccc0ccf", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Main Event WSOP Circuit Panam\u00e1 2026 re\u00fane 596 registros y duplica su garant\u00eda"}, {"bajada": "El jugador mexicano Gerardo Hern\u00e1ndez Olivares gan\u00f3 su primer anillo en el WSOP Circuit Panam\u00e1 2026 y busca un segundo t\u00edtulo en el Main Event del festival.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-14", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-14-36fc1127", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Gerardo Hern\u00e1ndez Olivares conquista su primer anillo WSOP Circuit Panam\u00e1"}, {"bajada": "Renny Barrett conquist\u00f3 su primer anillo del WSOP Circuit Panam\u00e1, brindando un nuevo protagonista al poker jamaiquino.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-14", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-14-d31ef2b0", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Renny Barrett gana su primer anillo WSOP Circuit Panam\u00e1 por Jamaica"}, {"bajada": "El colombiano Rafael Pardo conquist\u00f3 su primer anillo en el WSOP Circuit Panam\u00e1 2026.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-14", "fo
