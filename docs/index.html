a\u00f1ol", "id": "2026-11-02-tema-d9177b87", "nf": 2, "region": "", "sec": "tema", "secs": ["temas"], "titulo": "Tema: Adri\u00e1n Mateos"}, {"bajada": "Danielle Ford, candidata independiente para gobernadora de Nevada, comenz\u00f3 a jugar poker en 2011 despu\u00e9s de un a\u00f1o de estudio autodidacta. Ha servido en juntas escolares estatales y locales; conoci\u00f3 a Daniel Makowsky en la WSOP, escribi\u00f3 para PokerAti y particip\u00f3 en eventos de Charity Series of Poker donde reclut\u00f3 miembros de su equipo actual de campa\u00f1a.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-11-01", "foto": "", "fuente": "PokerNewsDaily", "id": "2026-11-01-84ad3494", "nf": 2, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "Danielle Ford, candidata independente a gobernadora de Nevada, tiene ra\u00edces en poker desde 2011"}, {"bajada": "El Second Chance Mystery Bounty de la Winner Poker Series (WPS) Medell\u00edn 2026 en Casino Hollywood Milla de Oro ya super\u00f3 su garantizado inicial de $180.000.000 COP. El Vuelo 1A ($1.500.000 buy-in) registr\u00f3 110 entradas ($165.000.000 COP recaudado) con Miguel Rodal \u0027El Chory\u0027 (Colombia) liderando con 686.000 fichas; el Vuelo 1B Turbo (52 entradas, $78.000.000 COP) lo lidera Salvador Roca (El Salvador) con 317.000 fichas. El pozo acumulado alcanza $356.400.000 COP con 33 jugadores avanzando al D\u00eda 2 de ambos vuelos.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-01", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-01-37298992", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Second Chance Mystery Bounty WPS Medell\u00edn supera garantizado inicial de $180.000.000 COP"}, {"bajada": "El Main Event de la Winner Poker Series (WPS) Medell\u00edn en Casino Hollywood Milla de Oro recolect\u00f3 671 registros generando $1.476.200.000 COP (buy-in $2.200.000 COP; garantizado inicial $800.000.000 COP). Del campo original, 68 jugadores cobraron y 33 avanzaron al D\u00eda 3. El campe\u00f3n recibir\u00e1 $250.000.000 COP m\u00e1s paquete de US$ 7.500 para WSOP Super Circuit LATAM Punta Cana 2027 (entrada Main Event US$ 3.500 + alojamiento Hard Rock Hotel \u0026 Casino).", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-01", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-01-5e18fd54", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Daniele Primerano [nacionalidad a confirmar] lidera Main Event WPS Medell\u00edn con 2.625.000 fichas tras reunir 671 registros"}, {"bajada": "Nacho Barbero (Argentina) avanz\u00f3 a la mesa final de nueve jugadores del Main Event WSOP Circuit Madrid (\u20ac1.500 buy-in, 918 inscripciones, \u20ac1.164.942 pozo) con 2.430.000 fichas. Comenz\u00f3 como chip leader del D\u00eda 1 con 1.517.000 fichas pero fue el m\u00e1s corto en la mesa final. Tambi\u00e9n clasific\u00f3 Crist\u00f3bal Ochoa (latino) con 2.630.000 fichas. El ganador recibir\u00e1 \u20ac207.000, anillo WSOP Circuit y paquete de US$ 5.000 para WSOP Paradise; ambos finalistas aseguran \u20ac14.200.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-01", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-01-8a56da9e", "nf": 2, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Nacho Barbero (Argentina) es finalista en WSOP Circuit Madrid; Pierre Calamusa gana primer anillo en High Roller"}, {"bajada": "La fuente menciona acci\u00f3n del D\u00eda 2 con jugadores como Jorge Preciado, Diego Ponce y La M\u00e1quina en el campo, pero no precisa el monto del pozo, el buy-in, las fichas de Garay ni detalles finales.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-01", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-01-c1a82f46", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Rafael Garay [nacionalidad a confirmar] lide a": "GGPoker abri\u00f3 su PLO Series 2026 con m\u00e1s de 450 torneos de Pot-Limit Omaha y buy-ins desde US$ 15 hasta US$ 10.000. La serie suma US$ 20 millones en garant\u00edas totales, incluyendo seis eventos de US$ 1 mill\u00f3n de prize pool y tres GGMillion$ PLO de US$ 10.000.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-10-31", "foto": "", "fuente": "PokerNews", "id": "2026-10-31-42bae066", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "GGPoker lanza PLO Series con garant\u00eda de US$ 20 millones del 1 al 17 de noviembre"}, {"bajada": "Betsson se convirti\u00f3 en la novena operadora autorizada para poker online en Francia por L\u0027Autorit\u00e9 nationale des jeux. Utilizar\u00e1 la plataforma iPoker de Playtech y permitir\u00e1 liquidez internacional compartida, ofreciendo a jugadores franceses competencia contra oponentes internacionales.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-10-31", "foto": "", "fuente": "GamblingNews", "id": "2026-10-31-24936f7f", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "Betsson recibe licencia francesa de poker online; lanzar\u00e1 iPoker con Playtech"}, {"bajada": "GucciNIKE y Giselle54, dos jugadores online an\u00f3nimos, dominan las mesas de high stakes en CoinPoker con ganancias r\u00e9cord en 2026. Seg\u00fan RailBird.VIP, GucciNIKE lidera con US$ 3.194.301 en ganancias desde que la plataforma comenz\u00f3 a rastrear, seguido por Giselle54 con US$ 2.483.059. Ambos juegan regularmente heads-up en mesas de US$ 500/US$ 1.000 de PLO, PLO5 y PLO6.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-10-31", "foto": "", "fuente": "CardPlayer", "id": "2026-10-31-13559f68", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "GucciNIKE y Giselle54 lideran ganancias de 2026 en cash games de CoinPoker"}, {"bajada": "El Main Event de Winner Poker Series Medell\u00edn 2026 en Casino Hollywood complet\u00f3 vuelos clasificatorios 1D y 1E con prize pool acumulado de $1.394.800.000 COP. Santiago Mesa encabez\u00f3 el vuelo 1D con 477.000 fichas, seguido por su compatriota colombiano Daniel Bernal con 416.000. El vuelo 1E cerr\u00f3 con 36 movimientos y $79.000.000 COP en recaudaci\u00f3n, con 45 jugadores avanzando al D\u00eda 2.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-10-31", "foto": "", "fuente": "Poker Noticias", "id": "2026-10-31-01071a68", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Santiago Mesa y Daniel Bernal lideran vuelos clasificatorios del Main Event WPS Medell\u00edn"}, {"bajada": "El jugador ecuatoriano \u0027mataperra\u0027 finaliz\u00f3 segundo en un torneo SpinUp de KKPoker el 29 de octubre con entrada de US$ 10 y multiplicador de 100.000x, ganando US$ 200.000. El ganador \u0027id845341\u0027 de Hungr\u00eda se llev\u00f3 US$ 700.000, mientras que \u0027iNednw1fe\u0027 tambi\u00e9n de Hungr\u00eda obtuvo US$ 100.000 en tercero, formando un prize pool total de US$ 1 mill\u00f3n.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-10-31", "foto": "", "fuente": "Poker Noticias", "id": "2026-10-31-d73c78d3", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Mataperra de Ecuador obtiene US$ 200.000 en SpinUp de KKPoker con entrada de US$ 10"}, {"bajada": "El jugador espa\u00f1ol El\u00edas Guti\u00e9rrez \u0027Zeros\u0027 lanz\u00f3 \u0027Zeros Poker Escuela\u0027, nuevo canal de YouTube dedicado exclusivamente a educaci\u00f3n y an\u00e1lisis estrat\u00e9gico de poker. El proyecto incluye participaci\u00f3n de otros profesores de su escuela y busca publicar contenido especializado regularmente, idealmente una vez por semana, tras a\u00f1os combinando entretenimiento con educaci\u00f3n en su canal principal.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-10-31", es ganador de dos brazaletes WSOP con m\u00e1s de US$ 19 millones en premios de torneos en vivo.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-10-30", "foto": "", "fuente": "PokerNews", "id": "2026-10-30-0a904660", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "Dan \u0027Jungleman\u0027 Cates publica libro \u0027Pokerworld\u0027 sobre poker de altas apuestas en mayo"}, {"bajada": "La temporada 2 de Hellmuth\u0027s Home Game se transmite los lunes por CBS Sports, filmada en Grand Sierra Resort en Reno, Nevada. El episodio 3 present\u00f3 a Phil Hellmuth, Charlie Hook, Dan \u0027Jungleman\u0027 Cates, Kelly Lucas (anteriormente Kelly Minkin), Stanley Tang y Ethan \u0027Rampage\u0027 Poker Yau en un cash game de US$ 25/50 con ante de big blind de US$ 50.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-10-30", "foto": "", "fuente": "PokerNews", "id": "2026-10-30-920b6652", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "Hellmuth\u0027s Home Game Season 2: Ethan Rampage Poker Yau sufre paliza en Reno"}, {"bajada": "El WSOP Circuit llega a Casino Middelkerke Betfirst by Partouche en B\u00e9lgica del 6 al 15 de noviembre, con nueve eventos de anillos de oro. La serie comienza el 6 de noviembre con el \u20ac300 No-Limit Hold\u0027em Mini Main Event, e incluye un \u20ac550 Mystery Bounty y un \u20ac2.500 High Roller, con un \u20ac300 Omaha tournament el d\u00eda final.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-10-30", "foto": "", "fuente": "PokerNews", "id": "2026-10-30-289e2698", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "WSOP Circuit se dirige a B\u00e9lgica en noviembre con nueve anillos de oro"}, {"bajada": "ClubWPT Gold paus\u00f3 sus operaciones en Nevada tras una represi\u00f3n estatal contra sitios de poker sweepstakes, aunque actualiz\u00f3 sus preguntas frecuentes indicando que es una pausa y no un cierre definitivo. El operador expres\u00f3 optimismo de que modificaciones de producto permitir\u00edan reanudar en un futuro con ambiente regulatorio en evoluci\u00f3n, similar a estrategias usadas previamente en California y Nueva York.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-10-30", "foto": "", "fuente": "Pokerfuse", "id": "2026-10-30-355bfcb6", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "ClubWPT Gold pausa operaciones en Nevada; busca reanudar con modificaciones de producto"}, {"bajada": "Allen Kessler lleva su Chainsaw Mixed Series of Poker a Atlantic City del 4 al 14 de noviembre en el Borgata durante el Borgata Fall Poker Open, con dos campeonatos: \u20ac1.100 H.O.R.S.E. Championship con garant\u00eda de US$ 25.000 y \u20ac1.100 T.O.R.S.E. Championship con garant\u00eda de US$ 35.000. Incluye varios eventos de US$ 600 en variantes de juegos mixtos como Omaha, Stud y Triple Draw.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-10-30", "foto": "", "fuente": "PokerNews", "id": "2026-10-30-c1571a89", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Allen Kessler trae Chainsaw Mixed Series a Atlantic City en noviembre"}, {"bajada": "El jugador del Team Winamax Pierre Calamusa (\u0027LeVietF0u\u0027) gan\u00f3 el evento #6 High Roller de \u20ac2.500 del WSOP Circuit Madrid, conquistando su primer anillo del circuito. El torneo reuni\u00f3 143 entradas y gener\u00f3 \u20ac302.445 en premios distribuidos entre 22 finalistas. Calamusa se impuso en heads-up al italiano Michael Liguccioni, quien recibi\u00f3 \u20ac49.400. El bielorruso Aliaksandr Shylko complet\u00f3 el podio con \u20ac32.900.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-10-30", "foto": "", "fuente": "PokerNews en espa\u00f1ol", "id": "2026-10-30-e23d6faf", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Pierre Calamusa gana High Roller WSOP Circuit Madrid por \u20ac77.000, primer anillo"}, {"bajada": "El colombiano Jhon Grisales conquist\u00f3 el evento Progresivo K.O. de la Winner Poker Series 2026 en Casino Hollywood de Medell\u00edn, tras remontar desde ser short stack en la mesa final. Con tres jugadores en competencia, los finalistas hicieron deal conservando los bounties acumulados. Grisales se llev\u00f3 $41.000.000 COP m\u00e1s $2.200.000 COP en recompensas, totalizando $43.200.000 COP. El evento con buy-in de $1.300.000 COP alcanz\u00f3 241 movimientos, superando las expectativas, con prize pool total de $269.920.000 COP distribuido entre 26 premiados.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-10-30", "foto": "", "fuente": "Poker Noticias", "id": "2026-10-30-218c8176", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Jhon Grisales gana Progresivo K.O. Winner Poker Series Medell\u00edn con remontada desde short stack"}, {"bajada": "Andoni Larrabe, quien en 2014 alcanz\u00f3 la mesa final del WSOP Main Event con 22 a\u00f1os terminando sexto por US$ 1.622.471, reapareci\u00f3 en el WSOP Circuit Madrid como chip leader del D\u00eda 1A del Main Event de \u20ac1.500 con 764.000 fichas. El jugador vasco de Arrasate hab\u00eda desaparecido de los focos principales despu\u00e9s de 2014 con apariciones espor\u00e1dicas. Larrabe super\u00f3 a C\u00e9sar Monta\u00f1\u00e9s (728.000) y Youssef Aboussaad (677.000).", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-10-30", "foto": "", "fuente": "PokerNews en espa\u00f1ol", "id": "2026-10-30-77d352e1", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Andoni Larrabe [nacionalidad a confirmar] lidera D\u00eda 1A WSOP Circuit Madrid; November Nine de 2014 regresa a competici\u00f3n"}, {"bajada": "", "cat": "Tema caliente", "credito": "", "destacada": false, "dia": "2026-10-30", "foto": "", "fuente": "PokerNews", "id": "2026-10-30-tema-e5e9ea5a", "nf": 1, "region": "", "sec": "tema", "secs": ["temas"], "titulo": "Tema: Lucas Jumalon"}, {"bajada": "", "cat": "Tema caliente", "credito": "", "destacada": false, "dia": "2026-10-30", "foto": "", "fuente": "Poker Red", "id": "2026-10-30-tema-d9177b87", "nf": 1, "region": "", "sec": "tema", "secs": ["temas"], "titulo": "Tema: Adri\u00e1n Mateos"}, {"bajada": "Fabiano Kovalski, entrenador de Samba Poker Team, gan\u00f3 el torneo de US$ 10.000 GGMillion$ despu\u00e9s de jugar 91 ediciones del evento. Kovalski hab\u00eda llegado a 11 finales con dos runner-ups antes de conseguir su primera victoria en la modalidad.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-10-29", "foto": "", "fuente": "PokerListings", "id": "2026-10-29-bb6e14cd", "nf": 2, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Fabiano Kovalski gana GGMillion$ US$ 10.000 por US$ 464.794 en su intento 91"}, {"bajada": "Chino Rheem, cuatro veces campe\u00f3n de serie en PokerGO Tour, gan\u00f3 el $5.300 PGT Sprint Opener venciendo 92 entradas. La victoria es su d\u00e9cimo t\u00edtulo PGT en carrera y lleva sus ganancias acumuladas a m\u00e1s de US$ 20.3 millones; adem\u00e1s asegur\u00f3 4.669 puntos en la competencia anual de CardPlayer.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-10-29", "foto": "", "fuente": "CardPlayer", "id": "2026-10-29-e36e043a", "nf": 2, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Chino Rheem gana PGT Sprint Kickoff Event por US$ 119.600; acumula quinto t\u00edtulo de serie"}, {"bajada": "Paddy Power, operador irland\u00e9s de apuestas, migr\u00f3 de la piel iPoker a PokerStars Network (PSN), uni\u00e9ndose al pool global de jugadores de PokerStars. El movimiento completa otro paso en el plan de Flutter de consolidar sus marcas de poker online.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-10-29", "foto": "", "fuente": "Poker Industry PRO", "id": "2026-10-29-aecdf6d9", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Paddy Power cambia de iPoker a PokerStars Network; consolida plan de Flutter"}, {"bajada": "Irish Open expande su tour internacional llevando 36 eventos a Marrakech, Marruecos, del 10 al 15 de noviembre. El \u20ac1.155 Main Event cuenta con \u20ac500.000 garantizados y cuatro starting flights; PokerNews cubrir\u00e1 en vivo el evento desde Casino de Marrakech.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-10-29", "foto": "", "fuente": "PokerNews", "id": "2026-10-29-54b0699f", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Irish Open trae 36 eventos a Marrakech con \u20ac500.000 garantizados en Main Event"}, {"bajada": "Borgata Fall Poker Open regresa del 4 al 17 de noviembre con m\u00e1s de US$ 4 millones en garant\u00edas. El festival incluye $2.700 Championship Event, Chainsaw Mixed Series, series Bar Poker Open y m\u00faltiples eventos colaterales en Atlantic City.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-10-29", "foto": "", "fuente": "PokerNews", "id": "2026-10-29-1e66b83a", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Borgata Fall Poker Open 2026 ofrece m\u00e1s de US$ 4 millones en garant\u00edas"}, {"bajada": "World Series of Poker Circuit retorna a Dusk Till Dawn, Nottingham, del 6 al 15 de noviembre con 13 anillos y al menos \u00a32 millones en garant\u00edas. El \u00a31.500 Main Event incluye \u00a31 mill\u00f3n garantizado; los 13 campeones reciben paquete de US$ 5.000 para WSOP Paradise.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-10-29", "foto": "", "fuente": "PokerNews", "id": "2026-10-29-1607b792", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "WSOPC UK en Dusk Till Dawn: 13 anillos y \u00a31 mill\u00f3n garantizado en Main Event"}, {"bajada": "Fernando Mayor Molina, jugador colombiano, encabeza el conteo con 790.000 fichas del Progresivo K.O. de las Winner Poker Series 2026 en Medell\u00edn. El torneo super\u00f3 su garant\u00eda de $150.000.000 COP con buy-in de $1.300.000 COP y 241 entradas; repartir\u00e1 $42 millones COP al campe\u00f3n adem\u00e1s de bounties acumulados.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-10-29", "foto": "", "fuente": "Poker Noticias", "id": "2026-10-29-3a6e61af", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Fernando Mayor Molina lidera Progresivo K.O. de Winner Poker Series Medell\u00edn con 790.000 fichas"}, {"bajada": "Marjorie Bradford y Jamie Kempf inaugurar\u00e1n el 12 de noviembre en Rowlett, Texas, The Den Poker Lounge, una de las primeras salas de poker propiedad exclusiva de mujeres en el estado. La sala operar\u00e1 como club social buscando mayor inclusi\u00f3n femenina en el poker.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-10-29", "foto": "", "fuente": "PokerNews Brasil", "id": "2026-10-29-d7a8229d", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "The Den Poker Lounge, sala propiedad exclusiva de mujeres, se inaugura en Texas"}, {"bajada": "CoinPoker y PokerGO Tour lanzan PGT Online a partir del 8 de noviembre de 2026 hasta noviembre 2027 con US$ 250 millones en premios garantizados distribuidos en seis festivales. El PGT Kickoff Online (8-30 noviembre) ofrece Main Event de US$ 530 con US$ 5 millones garantizados; culmina con final de 50 jugadores ganador-lleva-todo en Las Vegas por US$ 1.000.000.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-10-29", "foto": "", "fuente": "Poker Noticias", "id": "2026-10-29-64969f44", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "PGT Online inicia 8 de noviembre en CoinPoker ": "", "fuente": "tightpoker.com", "id": "2026-10-28-f7b9cc78", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "Lynne Ji acusada de intento de asesinato en Las Vegas"}, {"bajada": "La Asian Poker Tour Online en Natural8 contin\u00faa estableciendo nuevos m\u00e1ximos; el Mini Main Event atrajo 19.229 entradas, el mayor field en los cuatro a\u00f1os de historia del festival, con 14 de 20 Trophy Events ya completados y 11 estableciendo nuevos r\u00e9cords.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-10-28", "foto": "", "fuente": "Poker.org", "id": "2026-10-28-af921e4a", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "APT Online rompe r\u00e9cords en series finales con 19.229 entradas en Mini Main Event"}, {"bajada": "Quoc Mai encabeza a seis finalistas en el WPT Bay 101 Shooting Star main event de US$ 5.300 del 2026, con 584 entradas totales; la mesa final retrasada se reanudar\u00e1 el 15 de diciembre en Las Vegas con Quoc Mai portando 10.165.000 fichas.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-10-28", "foto": "", "fuente": "CardPlayer", "id": "2026-10-28-f9074d0d", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Quoc Mai lidera mesa final del WPT Bay 101 Shooting Star con US$ 470.500 en juego"}, {"bajada": "Los embajadores de PokerStars Maria Konnikova y James Hartigan estrenaron \"The Tough Call\", un podcast con 10 episodios en la temporada 1; el primer episodio fue con Jason Koon y nuevos episodios se liberan cada martes hasta el 29 de diciembre.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-10-28", "foto": "", "fuente": "PokerNews", "id": "2026-10-28-756e4a7f", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Maria Konnikova y James Hartigan lanzan podcast \"The Tough Call\" patrocinado por PokerStars"}, {"bajada": "El Monday rado embajador global de WSOP Academy; viajar\u00e1 por paradas del WSOP Circuit para seleccionar a un jugador emergente que recibir\u00e1 una entrada gratuita al Main Event de 2027 y acceso a eventos especiales de WSOP Academy.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-10-28", "foto": "", "fuente": "Poker Noticias", "id": "2026-10-28-070e7c9c", "nf": 4, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Lucas Jumalon, campe\u00f3n WSOP 2026 por US$ 10 millones, designado embajador global de WSOP Academy"}, {"bajada": "El brasile\u00f1o Jonatas Gomes gan\u00f3 un bounty de US$ 157.649 en el US$ 108 Mystery Main Event de Bounty Hunter Series de GGPoker; Alan Karas fue runner-up en GGMasters US$ 150 entre 7.368 entradas por US$ 104.229; Artur Berg lleg\u00f3 tercero en GGMasters High Rollers US$ 1.050 por US$ 81.127.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-10-28", "foto": "", "fuente": "PokerNews Brasil", "id": "2026-10-28-55627bdd", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Jonatas Gomes y Alan Karas ganan premios de seis d\u00edgitos en GGPoker; Jonatas obtiene bounty de US$ 157.649"}, {"bajada": "WSOP Paradise 2026 (2-17 de diciembre, Baha Mar Resort, Nassau, Bahamas) modific\u00f3 las comisiones tras reclamos de jugadores como Shaun Deeb; eventos de US$ 100.000 reducen comisi\u00f3n de US$ 3.000 a US$ 2.000, High Rollers US$ 50.000 de US$ 2.000 a US$ 1.000, y eventos US$ 10.000 disminuyen 20% en tarifas administrativas de US$ 500 a US$ 400.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-10-28", "foto": "", "fuente": "Poker Noticias", "id": "2026-10-28-6cb36a8b", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "WSOP Paradise 2026 reduce comisiones administrativas en eventos de altas apuestas"}, {"bajada": "", "cat": "Tema caliente", "credito": "", "destacada": false, "dia": "2026-1 7a5", "nf": 5, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "Sammy Farha acusado de agredir a dealer en Houston; video confirma incidente y recibe banning permanente"}, {"bajada": "PokerGO Tour (PGT) se asoci\u00f3 con CoinPoker para hospedar seis series consecutivas bajo la marca PGT desde noviembre 2026 hasta noviembre 2027 con un total de US$ 250 millones garantizados. La primera serie, PGT Online, arranca el 8 de noviembre con 50 torneos trophy con buy-ins de US$ 44 a US$ 1.500; incluye garant\u00edas de US$ 100.000 a US$ 5.000.000 y culmina con un Vegas Final winner-take-all de US$ 1.000.000 con 50 asientos disponibles para ganadores de Millionaire Challenges.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-10-27", "foto": "", "fuente": "PokerListings", "id": "2026-10-27-0832febc", "nf": 4, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "PokerGO Tour llega a CoinPoker con US$ 250 millones garantizados de noviembre 2026 a noviembre 2027"}, {"bajada": "Stake, plataforma de casino online y sportsbook de criptomonedas, design\u00f3 al profesional colombiano de poker Farid Jattin como su primer embajador de poker.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-10-27", "foto": "", "fuente": "Poker Industry PRO", "id": "2026-10-27-5f8a71f4", "nf": 2, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Farid Jattin, profesional colombiano de poker, se convierte en primer embajador de Stake Poker"}, {"bajada": "Virtual Gaming Worlds (VGW), empresa detr\u00e1s de Chumba Casino, Global Poker y Luckyland Slots, reportedly contin\u00faa operando en Arizona casi dos a\u00f1os despu\u00e9s de que el departamento de regulaci\u00f3n estatal emitiera una orden de cese en noviembre 2024. Reguladores argumentaron que el modelo de negocio de VGW violaba la ley estatal; VGW disputa esa interpretaci\u00f3n alegando que las plataformas de sweepstakes no caen bajo las leyes de apuestas de Arizona. Permanece incierto si las autoridades tomar\u00e1n acciones formales.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-10-27", "foto": "", "fuente": "GamblingNews", "id": "2026-10-27-6643e06b", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "VGW enfrenta nuevas acusaciones en Arizona tras continuar operando casi dos a\u00f1os despu\u00e9s de orden de cese"}, {"bajada": "El PokerNews Online Championship (PNOC) Mystery Main Event alcanz\u00f3 su mesa final con ocho jugadores, incluyendo al embajador de 888 Aaron Barone. Con 1.091 entradas, el torneo super\u00f3 su garant\u00eda y gener\u00f3 US$ 254.203 en premios; se distribuyeron bounties de hasta US$ 25.000. Barone lleva 1.460.290 fichas (37 big blinds) en cuarta posici\u00f3n; el top prize es US$ 21.098 m\u00e1s bounties ganados. La acci\u00f3n contin\u00faa el 27 de octubre a las 7:00 p.m. GMT.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-10-27", "foto": "", "fuente": "PokerNews", "id": "2026-10-27-8ebe1d11", "nf": 3, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Aaron Barone alcanza mesa final del PokerNews Online Championship Mystery Main Event con US$ 254.203 en prize pool"}, {"bajada": "Eric Bunch se impuso sobre 341 entradas en el RunGood Poker Series Golden Expedition Hard Rock Tulsa Main Event de US$ 800 para ganar US$ 50.173 y su quinto anillo RunGood, llevando sus ganancias en eventos RunGood a casi US$ 200.000. Rachel Rodgers fue su rival en heads-up.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-10-27", "foto": "", "fuente": "PokerNews", "id": "2026-10-27-13c61262", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Eric Bunch gana quinto anillo RunGood en RGPS Hard Rock Tulsa Main Event"}, {"bajada": "El Main Event de la Winner Poker Series Medell\u00edn disput\u00f3 su primer vuelo con 115 inscripciones, 38 reentradas y 135 movimientos, generando $336 millones COP recaudados. Camilo Cardona lider\u00f3 con 608.000 fichas y asegur\u00f3 un bono de $9 millones COP como chipleader del D\u00eda 1A; 30 jugadores clasificaron al D\u00eda 2. El torneo tiene garantizado de $800 millones COP y buy-in de $2.200.000 COP.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-10-27", "foto": "", "fuente": "Poker Noticias", "id": "2026-10-27-13c0fa2b", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Camilo Cardona [nacionalidad a confirmar] lidera D\u00eda 1A del Main Event WPS Medell\u00edn con 608.000 fichas y bono de $9 millones COP"}, {"bajada": "El jugador colombiano Luis Horacio Botero, conocido como \"Super Man\" en las mesas, se coron\u00f3 campe\u00f3n del Deep Stack Turbo de la Winner Poker Series Medell\u00edn.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-10-27", "foto": "", "fuente": "Poker Noticias", "id": "2026-10-27-e5ea24aa", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Luis Horacio Botero \"Super Man\" gana Deep Stack Turbo de las Winner Poker Series Medell\u00edn"}, {"bajada": "Giovanny Reyes se convirti\u00f3 en campe\u00f3n del High Roller de la Winner Poker Series Medell\u00edn tras superar en heads-up al jugador peruano Aldo Miyashiro. Nacionalidad indicada por la fuente: Colombia.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-10-27", "foto": "", "fuente": "Poker Noticias", "id": "2026-10-27-3b2b0c0a", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Giovanny Reyes gana High Roller WPS Medell\u00edn derrotando al peruano Aldo Miyashiro"}, {"bajada": "Joel Trevi\u00f1o se coron\u00f3 campe\u00f3n del Opener de la Palace Series of Poker edici\u00f3n Calaverita tras superar en heads-up al capitalino Pedro Tapia. Ambos finalizaron repartiendo una recompensa similar tras deal a cuatro bandas. El Opener cont\u00f3 con cuatro vuelos clasificatorios (dos a velocidad turbo) y 372 entradas totales, superando su garantizado y distribuyendo MXN$ 1.106.700 entre los mejores 45 participantes en D\u00eda 2.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-10-27", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-10-27-98a25df8", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Joel Trevi\u00f1o [nacionalidad a confirmar] gana PSOP Calaverita Opener tras deal a cuatro bandas"}, {"bajada": "", "cat": "Tema caliente", "credito": "", "destacada": false, "dia": "2026-10-27", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-10-27-tema-d9177b87", "nf": 1, "region": "", "sec": "tema", "secs": ["temas"], "titulo": "Tema: Adri\u00e1n Mateos"}]}</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById('datos').textContent);
  const T = D.tarjetas, SEC = D.secciones.filter(s => s.visible !== false);
  const PALO = ['♠', '♥', '♦', '♣'];
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const fechaLarga = iso => { const [y, m, d] = iso.split('-').map(Number); return `${d} de ${MESES[m - 1]} de ${y}`; };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const st = { sec: 'portada', q: '', vistos: 12 };

  const nav = document.getElementById('nav');
  const pintarMenu = () => nav.querySelectorAll('button[data-k]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === st.sec)));
  const ir = k => { st.sec = SEC.some(s => s.id === k) ? k : 'portada'; st.vistos = 12; pintarMenu(); render();
    try { history.replaceState(null, '', st.sec === 'portada' ? location.pathname : '#' + st.sec); } catch (e) {} };
  nav.addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (!b) return; ir(b.dataset.k); scrollTo({ top: 0 }); });
  document.querySelector('[data-ir="portada"]').addEventListener('click', e => { e.preventDefault(); ir('portada'); });

  const franja = document.getElementById('franja');
  const vistos = new Set(), temas = T.filter(x => x.sec === 'tema' && !vistos.has(x.titulo) && vistos.add(x.titulo)).slice(0, 12);
  if (!temas.length) document.getElementById('franja-caja').hidden = true;
  franja.insertAdjacentHTML('beforeend', temas.map(t => `<a href="n/${esc(t.id)}.html" style="flex:none;padding:9px 14px;white-space:nowrap;border-right:1px solid rgb(255 255 255 / .12)">${esc(t.titulo)}</a>`).join(''));

  document.getElementById('b-buscar').onclick = () => { const c = document.getElementById('caja-buscar'); c.classList.toggle('abierto'); if (c.classList.contains('abierto')) document.getElementById('q').focus(); };
  document.getElementById('q').addEventListener('input', e => { st.q = norm(e.target.value); st.vistos = 12; render(); });
  const root = document.documentElement;
  const oscuro = () => (root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
  document.getElementById('b-tema').onclick = () => { const nuevo = oscuro() ? 'light' : 'dark'; root.setAttribute('data-theme', nuevo); try { localStorage.setItem('mc-tema', nuevo); } catch (e) {} };

  const palo = id => PALO[[...id].reduce((a, c) => a + c.charCodeAt(0), 0) % 4];
  const foto = x => `<div class="foto" data-palo="${palo(x.id)}">${x.foto ? `<img src="${esc(x.foto)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">${x.credito ? `<small>Foto: ${esc(x.credito)}</small>` : ''}` : ''}</div>`;
  const secHtml = x => `<span>${esc(x.cat)}</span>${x.sec === 'latam' ? '<span class="latam">Latam</span>' : ''}${x.region === 'europa' ? '<span class="latam">Europa</span>' : ''}`;
  const href = x => `href="n/${esc(x.id)}.html"`;
  const fuente = x => x.fuente ? `<span class="fuente">${esc(x.fuente)}${x.nf > 1 ? ` y ${x.nf - 1} más` : ''}</span>` : '';
  const principal = x => `<article class="principal"><a ${href(x)} tabindex="-1" aria-hidden="true">${foto(x)}</a>
    <div class="sec">${secHtml(x)}</div><h1 class="tit"><a ${href(x)}>${esc(x.titulo)}</a></h1><p class="baj">${esc(x.bajada)}</p>
    <div class="fecha">${fechaLarga(x.dia)}${x.fuente ? ' · ' + esc(x.fuente) : ''}</div></article>`;
  const mini = x => `<article class="mini"><div><div class="sec">${secHtml(x)}</div><h3 class="tit"><a ${href(x)}>${esc(x.titulo)}</a></h3><div class="fecha">${fechaLarga(x.dia)}</div></div><a ${href(x)} tabindex="-1" aria-hidden="true">${foto(x)}</a></article>`;
  const tarjeta = x => `<article class="tarjeta${x.destacada ? ' destacada' : ''}"><div><div class="sec">${secHtml(x)}</div><h3 class="tit"><a ${href(x)}>${esc(x.titulo)}</a></h3>
    <p class="baj">${esc(x.bajada)}</p><div class="pie"><span class="fecha">${fechaLarga(x.dia)}</span>${fuente(x)}</div></div><a ${href(x)} tabindex="-1" aria-hidden="true">${foto(x)}</a></article>`;
  const orden = (a, b) => (b.destacada ? 1 : 0) - (a.destacada ? 1 : 0) || b.dia.localeCompare(a.dia);
  const bloque = (titulo, lista, mas) => `<section class="bloque"><h2>${esc(titulo)}</h2><div class="rejilla">${lista.map(tarjeta).join('')}</div></section>` +
    (mas ? '<div class="mas"><button type="button" id="mas">Mostrar más</button></div>' : '');

  function render() {
    const out = document.getElementById('out');
    let r = T.slice();
    if (st.sec !== 'portada') r = r.filter(x => x.secs.includes(st.sec));
    if (st.q) r = r.filter(x => norm(`${x.titulo} ${x.bajada} ${x.fuente} ${x.cat}`).includes(st.q));
    r.sort(orden);
    if (!r.length) { out.innerHTML = '<div class="vacio">' + (st.q ? 'No hay noticias para esta búsqueda. Pruebe con otra palabra o vuelva a la portada.' : 'Todavía no hay noticias en esta sección.') + '</div>'; return; }
    let html = '';
    if (st.sec === 'portada' && !st.q) {
      const conFoto = r.filter(x => x.sec !== 'tema');
      const p = conFoto.find(x => x.destacada) || conFoto.find(x => x.foto) || conFoto[0] || r[0];
      const resto = r.filter(x => x !== p);
      const ultimo = resto.slice(0, 4), usados = new Set([p.id, ...ultimo.map(x => x.id)]);
      html += `<section class="portada">${principal(p)}<div class="lateral"><h2>Lo último</h2>${ultimo.map(mini).join('')}</div></section>`;
      SEC.filter(s => s.portada).forEach(s => { const lista = resto.filter(x => x.secs.includes(s.id) && !usados.has(x.id)).slice(0, s.cantidad || 6);
        lista.forEach(x => usados.add(x.id)); if (lista.length) html += bloque(s.nombre, lista, false); });
      const otras = resto.filter(x => !usados.has(x.id));
      if (otras.length) html += bloque('Más noticias', otras.slice(0, st.vistos), otras.length > st.vistos);
    } else {
      const s = SEC.find(x => x.id === st.sec);
      html += bloque(st.q ? 'Resultados de la búsqueda' : (s ? s.nombre : 'Noticias'), r.slice(0, st.vistos), r.length > st.vistos);
    }
    out.innerHTML = html;
    const m = document.getElementById('mas'); if (m) m.onclick = () => { st.vistos += 12; render(); };
  }
  const inicial = (location.hash || '').slice(1);
  window.addEventListener('hashchange', () => ir((location.hash || '').slice(1)));
  ir(inicial);
})();
</script>
</body>
