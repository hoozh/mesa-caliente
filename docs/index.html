to": "", "fuente": "Poker Noticias", "id": "2026-11-14-a5b7cf66", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Rafael Pardo gana su primer anillo WSOP Circuit Panam\u00e1 2026"}, {"bajada": "El BSOP Millions 2026 comenz\u00f3 el viernes 13 de noviembre en el WTC Sheraton de S\u00e3o Paulo y se extender\u00e1 hasta el 28 de noviembre con 105 torneos numerados. El festival incluye el Start-Up Mystery Million (R$1.500 buy-in con R$1 mill\u00f3n misterioso garantizado), el Championship (R$15 millones garantidos), el Main Event (R$10 millones garantidos), el Millionaire Maker (R$5 millones garantidos) y el tradicional Uma Milha (R$1 mill\u00f3n garantizado), entre otros eventos.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-14", "foto": "", "fuente": "PokerNews Brasil", "id": "2026-11-14-a2786fd7", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "BSOP Millions 2026 comienza con 105 torneos en 16 d\u00edas de festival"}, {"bajada": "", "cat": "Tema caliente", "credito": "", "destacada": false, "dia": "2026-11-14", "foto": "", "fuente": "PokerNewsDaily", "id": "2026-11-14-tema-a0ddaeeb", "nf": 1, "region": "", "sec": "tema", "secs": ["temas"], "titulo": "Tema: Vito Branciforte"}, {"bajada": "El jugador italiano radicado en Alemania Vito Branciforte se consagr\u00f3 campe\u00f3n del Main Event de \u20ac3.000 del WSOP Super Circuit en King\u0027s Resort, Rozvadov, Rep\u00fablica Checa, tras superar un field de 505 entradas. Branciforte gan\u00f3 su primer anillo de la WSOP Circuit y \u20ac370.000. El jugador lleg\u00f3 a la mesa final como chip leader tras haber terminado quinto en un Monster Stack del mismo festival, y calific\u00f3 al torneo a trav\u00e9s de un sat\u00e9lite online en GGPoker.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-13", "foto": "", "fuente": "WSOP.com", "id": "2026-11-13-af88254d", "nf": 3, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Vito Branciforte gana el WSOP Super Circuit KINGS Main Event en Rozvadov"}, {"bajada": "PokerStars ha revelado el calendario completo de la European Poker Tour (EPT) 2027, confirmando el regreso de cinco paradas por primera vez en varios a\u00f1os.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-13", "foto": "", "fuente": "Poker Industry PRO", "id": "2026-11-13-a6729809", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "PokerStars anuncia calendario completo del EPT 2027 con cinco paradas"}, {"bajada": "Jason Koon encabeza la carrera de t\u00edtulos de Triton Poker con un r\u00e9cord de 12 trofeos, cinco victorias m\u00e1s que su perseguidor m\u00e1s cercano. El jugador de 41 a\u00f1os tambi\u00e9n colidera el circuito en cashes con 81 y es segundo en ganancias en Triton con US$ 40,9 millones, por debajo de Bryn Kenney con US$ 51,3 millones. La final de la d\u00e9cima temporada de Triton se llevar\u00e1 a cabo en North Cyprus.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-11-13", "foto": "", "fuente": "CardPlayer", "id": "2026-11-13-9b81f9be", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "Jason Koon lidera el ranking de trofeos Triton con 12 victorias"}, {"bajada": "Las autoridades de Harris County, Texas, realizaron un raid en Katy Poker, una sala con ocho mesas de juego de estacas bajas y medias. Cuatro personas fueron arrestadas acusadas de participar en actividad delictiva organizada, con cargos potenciales adicionales de lavado de dinero. El distrito de fiscal\u00eda se\u00f1al\u00f3 que la sala operaba ilegalmente al cobrar rake, en violaci\u00f3n de la ley de Texas que permite salas legales solo si cobran cuotas de membres\u00eda o asiento en lugar de rake.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-11-13", "foto": "", "fuente": "PokerNews", "id": "2026-11-13-e292e4f3", "nf": 2, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "Autoridades rastrean salas de p\u00f3ker en Houston por cobro ilegal de rake"}, {"bajada": "Jumalon tambi\u00e9n se convirti\u00f3 en embajador de la WSOP Academy.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-11-13", "foto": "", "fuente": "PokerNews", "id": "2026-11-13-47ce23d0", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "Lucas Jumalon habla sobre su vida tras ganar el WSOP Main Event 2026 por US$ 10 millones"}, {"bajada": "El jugador venezolano Jacson Rodr\u00edguez se consagr\u00f3 campe\u00f3n del Evento #9 US$ 400 PLO 4 Championship de la WSOP Circuit Panam\u00e1 2026 en el Sortis Hotel, Spa \u0026 Casino. Rodr\u00edguez lleg\u00f3 a la mesa final con apenas 196.000 fichas (13 BB) y remont\u00f3 para vencer al colombiano Jorge Guzm\u00e1n Fl\u00f3rez en heads-up, ganando su primer anillo de la WSOP Circuit y US$ 8.870 en efectivo. El torneo reuni\u00f3 102 registros.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-13", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-13-a44a6efa", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Jacson Rodr\u00edguez gana su primer anillo WSOP Circuit Panam\u00e1 en PLO 4 Championship"}, {"bajada": "El jugador mexicano H\u00e9ctor Hern\u00e1ndez fue el protagonista del D\u00eda 1C del Main Event NLH (US$ 1.700 buy-in) de la WSOP Circuit Panam\u00e1 2026, cerrando como l\u00edder absoluto con 2.200.000 fichas (146 BB). El evento ya ha superado el garantizado de US$ 500.000 tras acumular 329 registros y una recaudaci\u00f3n de US$ 559.300. El D\u00eda 1C reuni\u00f3 139 registros con una recaudaci\u00f3n de US$ 236.300, de los cuales 14 jugadores avanzaron al D\u00eda 2.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-11-13", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-13-b410798f", "nf": 1, "region": "", "sec": "latam", "secs": ["latam"], "titulo": "H\u00e9ctor Hern\u00e1ndez lidera D\u00eda 1C del Main Event WSOP Circuit Panam\u00e1 con 2.200.000 fichas"}, {"bajada": "Un jugador conocido como Justin protagoniz\u00f3 un presunto angle shoot durante una mano de cash en The Lodge Card Club, Texas, que fue retransmitida en directo. Tras anunciar call e intentar retirar sus fichas, el floor lo oblig\u00f3 a pagar. El bote de aproximadamente US$ 28.000 termin\u00f3 siendo repartido entre los jugadores tras una decisi\u00f3n controvertida del floor, generando cr\u00edticas en redes sociales. La controversia fue compartida por Skull Mike, comentarista habitual de las retransmisiones del club.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-11-13", "foto": "", "fuente": "PokerNews en espa\u00f1ol", "id": "2026-11-13-2bbcad97", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "polemicas"], "titulo": "Angle shoot controvertido termina en reparto de bote en The Lodge Card Club, Texas"}, {"bajada": "El brasile\u00f1o Murilo Fidelis (nick \"M.Flush.N\") lleg\u00f3 a la mesa final del Mystery Bounty Main Event de 888 y termin\u00f3 en segundo lugar tras una field de 558 entradas. Fidelis gan\u00f3 US$ 4.438 por su runner-up.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-13", "foto": "", "fuente": "PokerNews Brasil", "id": "2026-11-13-3b85ef7c", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Murilo Fidelis es runner-up en el 888 $109 Mystery Bounty Main Event"}, {"bajada": "Roman Narulin, quien reside en Buenos Aires, se consagr\u00f3 campe\u00f3n del Main Event de la WSOP Circuit Rosario tras remontar una desventaja de m\u00e1s de 5 a 1 en fichas en heads-up contra el argentino Gast\u00f3n Mart\u00ednez. Narulin gan\u00f3 su anillo de la WSOP Circuit y US$ 126.000. Mart\u00ednez obtuvo US$ 84.000 como runner-up, mientras que Ricardo Sald\u00edas complet\u00f3 el podio con US$ 57.000. El torneo reuni\u00f3 401 entradas de US$ 1.700 y gener\u00f3 un pozo de US$ 603.505.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-13", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-13-5cb56ad6", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Roman Narulin remonta 5 a 1 y gana el Main Event WSOP Circuit Rosario"}, {"bajada": "Martin Zamani se convirti\u00f3 en el segundo jugador en ganar cinco brazaletes de la World Series of Poker en l\u00ednea al vencer en el evento $500 No-Limit Hold\u0027em Fall Saver de WSOP Online en Nevada. Zamani derrot\u00f3 a Shane Martin en heads-up para llevarse $83.961, en un torneo que reuni\u00f3 610 entradas. Entre sus rivales en la mesa final figuraban David Peters (cuarto brazalete), James Collopy (ganador de tres brazaletes WSOP) y Daniel Maor (campe\u00f3n del WSOP Online Championship 2024).", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-12", "foto": "", "fuente": "PokerNews", "id": "2026-11-12-dceca8e4", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Martin Zamani gana su quinto brazalete WSOP online"}, {"bajada": "Craig Mason gan\u00f3 su primer t\u00edtulo de World Poker Tour al vencer el Main Event del WPT Venetian Las Vegas Fall Championship tras una propuesta de tres v\u00edas. Mason super\u00f3 a 510 entradas en el evento de $5.000 y se llev\u00f3 $358.800, derrotando en heads-up al experimentado Matt Affleck.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-12", "foto": "", "fuente": "tightpoker.com", "id": "2026-11-12-9201b54a", "nf": 3, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Craig Mason gana el WPT Venetian Las Vegas Fall Championship Main Event"}, {"bajada": "Benedek Farkas, jugador h\u00fangaro de 22 a\u00f1os, super\u00f3 un d\u00e9ficit de fichas de 15:1 en heads-up para ganar el Triton ONE North Cyprus $10.000 seven-max no-limit hold\u0027em. Farkas se llev\u00f3 $572.000, su primer score de seis cifras en torneos en vivo, tras acumular m\u00e1s de $782.000 en cashes registrados. Dmitrii Kukhtarev fue runner-up e Igor Provkin tercero.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-12", "foto": "", "fuente": "CardPlayer", "id": "2026-11-12-9dd49704", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Benedek Farkas vence con comeback de 15:1 en el Triton ONE North Cyprus High Roller"}, {"bajada": "Kayhan \u0027KayhanMok\u0027 Mokri gan\u00f3 US$ 1 mill\u00f3n en dos sesiones de cash en CoinPoker la semana pasada enfrent\u00e1ndose a \u0027WhaleVibez\u0027 en juego $500-$1.000 con ante de $250. Esta victoria se suma a sus ganancias previas de alrededor de $500.000 contra el mismo rival. El reporte de CardPlayer destaca manos y estrategia de juego de alto nivel durante esas sesiones.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-11-12", "foto": "", "fuente": "CardPlayer", "id": "2026-11-12-8ca8c2f7", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "Kayhan Mokri gana US$ 1 mill\u00f3n en sesiones de high-stakes en CoinPoker"}, {"bajada": "Artem Osmirko, quien no es jugador profesional pero juega torneos de high-stakes regularmente, gan\u00f3 su segundo t\u00edtulo del GGMillion$ en 2026 en GGPoker. Osmirko comenz\u00f3 la mesa final con la mayor pila de fichas y no la solt\u00f3, derrotando a Pedro Padilha en heads-up cuando Padilha apost\u00f3 con K9s y Osmirko llam\u00f3 con ATs.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-12", "foto": "", "fuente": "PokerListings", "id": "2026-11-12-5421dbd0", "nf": 2, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Artem Osmirko gana su segundo GGMillion$ de 2026"}, {"bajada": "El Poker Ecology Report, desarrollado por AceGuardian, revel\u00f3 que los 25 mayores ganadores de cash en no-limit hold\u0027em online acumularon US$ 39,6 millones en ganancias netas entre septiembre de 2020 y septiembre de 2026. El estudio cubri\u00f3 aproximadamente 2,6 mil millones de manos en GGPoker, PokerStars, ACR/WPN, CoinPoker, WPT Global y Club WPT Gold. WPT Global alberga ocho de los 25 jugadores, incluido el principal, huangyangliu, con US$ 5,31 millones en ganancias.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-11-12", "foto": "", "fuente": "Poker Media Australia", "id": "2026-11-12-bb88cf64", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "Poker Ecology Report documenta US$ 39,6 millones en ganancias de 25 grandes jugadores de cash"}, {"bajada": "888 Poker est\u00e1 probando una nueva funci\u00f3n que proporciona a los jugadores una estimaci\u00f3n de cu\u00e1nto tiempo se espera que dure un evento, ayud\u00e1ndoles a decidir si tienen tiempo suficiente para participar. La prueba se lleva a cabo en Alberta.", "cat": "Software", "credito": "", "destacada": false, "dia": "2026-11-12", "foto": "", "fuente": "Poker Industry PRO", "id": "2026-11-12-488466ef", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "888 Poker prueba estimador de duraci\u00f3n de torneos con IA en Alberta"}, {"bajada": "ClubWPT Gold introdujo una nueva forma de cobrar a jugadores en mesas de cash: asientos cronometrados sin rake, modelo similar al utilizado por Texas Card Club.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-11-12", "foto": "", "fuente": "Poker Industry PRO", "id": "2026-11-12-24d7ae9d", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "ClubWPT Gold prueba modelo de asientos cronometrados sin rake"}, {"bajada": "El jugador espa\u00f1ol Jon Ander Vallinas se coron\u00f3 campe\u00f3n del Evento #16: $2.000 NLH One Night de las Triton ONE North Cyprus, ganando su primer t\u00edtulo en el circuito Triton y $61.000. El evento de formato r\u00e1pido reuni\u00f3 143 entradas el 10 de noviembre en el Merit Royal Diamond Hotel \u0026 Spa.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-12", "foto": "", "fuente": "PokerNews en espa\u00f1ol", "id": "2026-11-12-ddc59dfb", "nf": 2, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Jon Ander Vallinas gana su primer tridente Triton en Chipre"}, {"bajada": "El costarricense Daniel Villalta se consagr\u00f3 campe\u00f3n del Evento #8 PLO 4 Turbo de la WSOP Circuit Panam\u00e1 2026, conquistando su primer anillo y US$ 11.880. Villalta lleg\u00f3 a la mesa final como chip leader con 618.000 fichas y super\u00f3 en heads-up al colombiano Jorge Guzm\u00e1n Fl\u00f3rez. El evento tuvo buy-in de US$ 400 y reuni\u00f3 142 registros.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-12", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-12-74c4db06", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Daniel Villalta gana su primer anillo WSOP Circuit en Panam\u00e1"}, {"bajada": "El colombiano Santiago Montes gan\u00f3 su primer anillo de la WSOP Circuit Panam\u00e1 2026. La fuente no precisa el evento, el monto del premio ni otros detalles del resultado.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-12", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-12-b77edb4d", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Santiago Montes conquista su primer anillo WSOP Circuit en Panam\u00e1"}, {"bajada": "Michael Hou se coron\u00f3 campe\u00f3n del evento Mystery Bounty de la WSOP Circuit Panam\u00e1 2026. La fuente no precisa el monto del premio ni otros detalles espec\u00edficos del torneo.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-12", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-12-1b0439c2", "nf": 2, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Michael Hou gana el Mystery Bounty de la WSOP Circuit Panam\u00e1"}, {"bajada": "El brasile\u00f1o Pedro Padilha fue runner-up en el $10.000 GGMillion$ High Rollers de GGPoker, cayendo ante Artem Osmirko en heads-up y ganando US$ 318.747. Su compatriota Gabriel Tavares, ambos del Samba Poker Team, termin\u00f3 cuarto con US$ 195.962. Padilha elimin\u00f3 a Tavares en cuarta posici\u00f3n antes de llegar al enfrentamiento final.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-12", "foto": "", "fuente": "PokerNews Brasil", "id": "2026-11-12-cd875133", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Brasile\u00f1os dominan GGMillion$ High Rollers: Padilha runner-up, Tavares cuarto"}, {"bajada": "PokerStars anunci\u00f3 el calendario completo del European Poker Tour (EPT) 2027 con cinco paradas principales. Por primera vez en m\u00e1s de 15 a\u00f1os, el Main Event del EPT se reduce de \u20ac5.300 a \u20ac5.000, medida orientada a simplificar el registro y adaptarse a cambios en el circuito. El EPT Malta regresa tras quedar fuera de 2026, y se incluyen paradas del PokerStars Open y patrocinio del Irish Open 2027.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-12", "foto": "", "fuente": "PokerNews Brasil", "id": "2026-11-12-b4251531", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "PokerStars anuncia EPT 2027 con cinco paradas y Main Event reducido a \u20ac5.000"}, {"bajada": "Simon Britton se consagr\u00f3 campe\u00f3n del Main Event de la WSOP Circuit en Choctaw Casino Resort, Durant, Oklahoma, con un triunfo de US$ 208.295 sobre un field de 793 entradas. Despu\u00e9s de siete finales sin victoria, Britton rompi\u00f3 la sequ\u00eda al derrotar a Chan Pelton en heads-up, tomando el chip lead temprano con un five-bet shove contra Mason Bodnar.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-11", "foto": "", "fuente": "WSOP.com", "id": "2026-11-11-0e569758", "nf": 2, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Simon Britton gana su primer anillo WSOP Circuit en Choctaw tras siete runner-ups"}, {"bajada": "Tobias Schwecht se llev\u00f3 el t\u00edtulo del evento $10.000 GGMillion$ Pot-Limit Omaha Bounty en GGPoker, venciendo a un field de 80 jugadores con un prize pool total de US$ 1.010.000. De sus US$ 301.133 en premios, US$ 166.800 provinieron de bounties. Ronnie Kaiser termin\u00f3 segundo con US$ 155.332, seguido por Eelis Parssinen en tercero con US$ 126.289.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-11", "foto": "", "fuente": "PokerNewsDaily", "id": "2026-11-11-9bc7fd33", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Tobias Schwecht gana el GGMillion$ Pot-Limit Omaha Bounty por US$ 301.133"}, {"bajada": "Sascha Wilhelm, especialista alem\u00e1n en Omaha, se llev\u00f3 el t\u00edtulo del BetMGM Poker Borgata Fall Poker Open $1.100 Pot-Limit Omaha Championship en Borgata Hotel Casino \u0026 Spa, venciendo a Sebastian Crema en heads-up. Wilhelm sum\u00f3 su tercer brazalete de poker en vivo, con dos anteriores WSOP bracelets en PLO en los \u00faltimos dos a\u00f1os.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-11", "foto": "", "fuente": "PokerNews", "id": "2026-11-11-027b7ba0", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Sascha Wilhelm gana el Borgata PLO Championship por US$ 20.360"}, {"bajada": "PokerStars revel\u00f3 el calendario completo del European Poker Tour 2027 con cinco grandes festivales. Por primera vez en m\u00e1s de 15 a\u00f1os, el buy-in del Main Event se redujo de \u20ac5.300 a \u20ac5.000, una medida que busca simplificar las inscripciones y adaptar los precios del circuito. El EPT Malta regresar\u00e1 al calendario tras su ausencia en 2026.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-11", "foto": "", "fuente": "PokerNews en espa\u00f1ol", "id": "2026-11-11-cb17e7f8", "nf": 3, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "PokerStars anuncia calendario EPT 2027 con cinco paradas y Main Event reducido a \u20ac5.000"}, {"bajada": "PokerStars en FanDuel, que opera en mercados norteamericanos con la plataforma Playtech, a\u00f1adi\u00f3 la funci\u00f3n Run It Twice (RIT) a sus mesas de cash game, permitiendo que los jugadores completen dos corridas del board.", "cat": "Software", "credito": "", "destacada": false, "dia": "2026-11-11", "foto": "", "fuente": "Poker Industry PRO", "id": "2026-11-11-1f74c497", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "PokerStars en FanDuel agrega funci\u00f3n Run It Twice a mesas de cash"}, {"bajada": "El festival de invierno Kings of Vilnius 2026 regresar\u00e1 a Vilnius del 4 al 13 de diciembre en Olympic Casino Lietuva, con una serie de 35 eventos. El Main Event tendr\u00e1 un buy-in de \u20ac1.100 con garant\u00eda de \u20ac250.000, precedido por el \u20ac555 Kings of Vilnius Championship con tres starting flights. La serie incluir\u00e1 variantes de NLH, PLO, Progressive Knockouts y Mixed Games.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-11", "foto": "", "fuente": "PokerNews", "id": "2026-11-11-cbbe45a5", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "OlyBet Kings of Vilnius 2026 arranca del 4 al 13 de diciembre con Main Event de \u20ac250K GTD"}, {"bajada": "Kerryjane Craigie, embajadora de PokerStars, document\u00f3 r\u00e9cords de participaci\u00f3n en eventos femeninos tras paradas en The Hippodrome Casino (Londres), Malta y Aix-en-Provence. La iniciativa subraya c\u00f3mo entrenamiento dedicado, ambientes inclusivos y lazos comunitarios se traducen en progreso tangible en el poker femenino.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-11-11", "foto": "", "fuente": "PokerNews", "id": "2026-11-11-cc4001fc", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "Kerryjane Craigie reporta crecimiento r\u00e9cord en poker femenino en Europa"}, {"bajada": "El field de 9.128 entradas gener\u00f3 un overlay de US$ 87.200 sobre la garant\u00eda de US$ 1 mill\u00f3n. Cinco brasile\u00f1os ocuparon asientos en la mesa final, cuatro de ellos en el top 5.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-11", "foto": "", "fuente": "PokerNews", "id": "2026-11-11-402d58ce", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Brasile\u00f1os dominan Sunday Million Spooky Season de PokerStars; \"Kume23\" campe\u00f3n"}, {"bajada": "Jherson \"Yeyo\" \u00c1lvarez, jugador colombiano, se consagr\u00f3 campe\u00f3n del Evento #6 Bounty Turbo de la WSOP Circuit Panam\u00e1 2026 con buy-in de US$ 400, 193 registros y recaudaci\u00f3n de US$ 77.200. \u00c1lvarez lleg\u00f3 a la mesa final con 212.000 fichas (7 BB), uno de los stacks m\u00e1s cortos, y remont\u00f3 para vencer en heads-up al guyan\u00e9s Philip Jaiserrisingh. Se llev\u00f3 US$ 10.325 en efectivo m\u00e1s un paquete de US$ 5.000 para WSOP Bahamas, sumando su segundo anillo del circuito.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-11", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-11-d97568d4", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Jherson \"Yeyo\" \u00c1lvarez gana segundo anillo WSOP Circuit Panam\u00e1 en Evento #6 Bounty Turbo"}, {"bajada": "Adri\u00e1n Cesarini se consagr\u00f3 campe\u00f3n del Evento #8 Mystery Bounty de la WSOP Circuit Rosario en City Center con buy-in de US$ 600, 422 entradas y prize pool de US$ 208.890. Cesarini se llev\u00f3 US$ 21.200 en premios por ubicaci\u00f3n m\u00e1s recompensas de bounties y su anillo del circuito. Agust\u00edn Naranja termin\u00f3 segundo con US$ 14.000 y Alejandro Romero tercero con US$ 9.400.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-11", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-11-45cb23e3", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Adri\u00e1n Cesarini [nacionalidad a confirmar] gana Mystery Bounty WSOP Circuit Rosario por US$ 21.200 + anillo"}, {"bajada": "El BSOP Millions 2026 anunci\u00f3 que entregar\u00eda R$ 2 millones en entradas para el Main Event del pr\u00f3ximo BSOP Summer (22-30 de enero de 2027 en Costa de Sau\u00edpe), como premios extra en met\u00e1lico. Los premios no se descuentan de las premiaciones de la serie actual; cada jugador puede recibir un m\u00e1ximo de una entrada no transferible.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-11", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-11-c84ef840", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "BSOP Millions 2026 entrega R$ 2 millones extra en entradas a BSOP Summer 2027"}, {"bajada": "", "cat": "Tema caliente", "credito": "", "destacada": false, "dia": "2026-11-11", "foto": "", "fuente": "PokerListings", "id": "2026-11-11-tema-5058be4d", "nf": 1, "region": "", "sec": "tema", "secs": ["temas"], "titulo": "Tema: Lex Veldhuis"}, {"bajada": "Umut Ozturk se llev\u00f3 el MSPT de Riverside Casino Iowa ($1.110 buy-in, 406 entradas) tras un heads-up deal con Jacob Tourville; ambos ganaron $69.451. Este es el tercer t\u00edtulo MSPT del jugador de Minnesota en 2026, despu\u00e9s de ganar el Ohio Poker State Championship ($89.638) y el MSPT Spade Poker Championship en FireKeepers Casino ($280.290), su mayor premio de carrera.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-10", "foto": "", "fuente": "CardPlayer", "id": "2026-11-10-563f550b", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Umut Ozturk gana su tercer MSPT Main Event de 2026"}, {"bajada": "Cesar Garcia fue s\u00e9ptimo con $55.423, Marcus Dieleman sexto con $46.391, \"TripleBarr\" quinto con $54.200, y Artisom Lasouskii cuarto con $76.949. La fuente no precisa el nombre completo del ganador ni la cifra exacta de su premio.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-10", "foto": "", "fuente": "PokerNews", "id": "2026-11-10-89aa1396", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Tobias Schwecht gana el GGMillion$ Pot-Limit Omaha Bounty por US$ 301.000"}, {"bajada": "Christopher Marcadet, originario de Francia pero residente en Hungr\u00eda, se impuso sobre 859 entradas en el PokerStars Open Aix-en-Provence \u20ac1.100 Main Event para ganar \u20ac130.000 ($145.689 USD). Derrot\u00f3 a John Rezzonico en la final. Este es su mayor premio en una competencia de poker en vivo y su primer score calificado de 2026 en Player of the Year, lo que lo situ\u00f3 dentro del top 1.000 de la clasificaci\u00f3n POY 2026 de CoinPoker.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-10", "foto": "", "fuente": "CardPlayer", "id": "2026-11-10-e00b4821", "nf": 4, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Christopher Marcadet gana el PokerStars Open Aix-en-Provence Main Event por \u20ac130.000"}, {"bajada": "Phil Hellmuth perdi\u00f3 un coin flip con tres mesas a\u00fan en juego en el $5.000 WPT Venetian Las Vegas Fall Championship y termin\u00f3 en 20\u00ba lugar por $22.200. El torneo reuni\u00f3 510 entradas con prize pool de $2.346.000, siendo el ganador premiado con $446.800. Esta fue la \u00faltima oportunidad de Hellmuth en este torneo para ganar su primer t\u00edtulo WPT, un logro que a\u00fan le falta a pesar de sus 17 brazaletes WSOP.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-10", "foto": "", "fuente": "PokerNews", "id": "2026-11-10-46c4aa60", "nf": 2, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Phil Hellmuth cae en 20\u00ba lugar en el WPT Venetian Las Vegas Fall Championship"}, {"bajada": "Roger Sippl, quien apareci\u00f3 m\u00faltiples veces en High Stakes Poker, falleci\u00f3 a los 71 a\u00f1os. Andrew Robl, quien lo consideraba amigo, lo describi\u00f3 como un caballero que nunca tuvo mala reputaci\u00f3n en la comunidad de poker.", "cat": "Obituario", "credito": "", "destacada": false, "dia": "2026-11-10", "foto": "", "fuente": "PokerNews", "id": "2026-11-10-b40617f0", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "Roger Sippl, jugador de poker y empresario, fallece a los 71 a\u00f1os"}, {"bajada": "Eric Tsai, vlogger de poker con m\u00e1s de 168.000 suscriptores en YouTube, gan\u00f3 un enorme bote de tres v\u00edas con ases en la final del $5.000 NLH 8-Handed Mystery Bounty en Triton ONE North Cyprus, eliminando dos rivales y coloc\u00e1ndose en posici\u00f3n l\u00edder hacia la mesa final de nueve jugadores. El ganador del torneo recibir\u00e1 $293.000. Tsai ya hab\u00eda ganado $1.046.600 hace poco en un $60.000 Super High Roller en KPC Jeju, su segundo torneo ganador de 2026.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-10", "foto": "", "fuente": "PokerNews", "id": "2026-11-10-cb54917a", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Eric Tsai avanza en el Triton ONE North Cyprus con ases en cooler de tres v\u00edas"}, {"bajada": "Gaspar Fern\u00e1ndez, jugador argentino, lidera el Evento #4 Mystery Bounty ($600 buy-in) de la WSOP Circuit Panam\u00e1 2026 tras el primer vuelo clasificatorio. Fern\u00e1ndez cerr\u00f3 con 709.000 fichas, siendo el stack de los 57 jugadores que avanzaron a D\u00eda 2. El torneo reuni\u00f3 376 registros totales con prize pool de $225.600.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-10", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-10-aa1b4e2e", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Gaspar Fern\u00e1ndez lidera el Mystery Bounty WSOP Circuit Panam\u00e1 con 709.000 fichas"}, {"bajada": "Alc\u00e2ntara embols\u00f3 US$ 71.118 (premio regular y bounties), mientras que Emmanuel garantiz\u00f3 US$ 79.397 totales con US$ 46.928 en bounties. Felipe Morelli cal\u00f3 en noveno con US$ 67.167. El torneo reuni\u00f3 554 entradas con prize pool de US$ 526.300.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-10", "foto": "", "fuente": "PokerNews Brasil", "id": "2026-11-10-f71411b0", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Leonardo Alc\u00e2ntara gana el Sunday Ocean KO HR de GGPoker con dobradinha brasile\u00f1a"}, {"bajada": "Mario D\u00edaz, jugador espa\u00f1ol, lleg\u00f3 a la mesa final del GGMasters High Rollers de US$ 1.050 en tercera posici\u00f3n con 1.251.102 fichas, pero termin\u00f3 en cuarto lugar por US$ 58.305. El torneo reuni\u00f3 783 entradas con prize pool final de US$ 783.000.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-10", "foto": "", "fuente": "PokerNews en espa\u00f1ol", "id": "2026-11-10-4ef76178", "nf": 2, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Mario D\u00edaz termina cuarto en el GGMasters High Rollers de GGPoker por US$ 58.305"}, {"bajada": "", "cat": "Tema caliente", "credito": "", "destacada": false, "dia": "2026-11-10", "foto": "", "fuente": "Reddit r/poker", "id": "2026-11-10-tema-d9177b87", "nf": 1, "region": "", "sec": "tema", "secs": ["temas"], "titulo": "Tema: Adri\u00e1n Mateos"}, {"bajada": "Adam Wilkinson se llev\u00f3 el t\u00edtulo del \u00a31.250 GUKPT Blackpool Main Event con un premio de \u00a355.035, m\u00e1s \u00a35.504 adicionales por compra de entrada v\u00eda GGPoker. Con 190 entradas, fue su primera victoria en un Main Event de la serie tras participar en casi 200 eventos GUKPT desde febrero de 2007.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-09", "foto": "", "fuente": "PokerNews", "id": "2026-11-09-036f341c", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Adam Wilkinson gana el GUKPT Blackpool Main Event tras casi 20 a\u00f1os"}, {"bajada": "El rumano Alin Ivan, de 26 a\u00f1os, se impuso en el $3.000 Triton ONE North Cyprus Genesis con 912 entradas y un pozo de $2.443.248, ganando $450.000 en su mejor resultado de carrera. Triton se\u00f1al\u00f3 que la victoria lo posicion\u00f3 dentro de los 500 mejores en la clasificaci\u00f3n 2026 de Player of the Year.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-09", "foto": "", "fuente": "CardPlayer", "id": "2026-11-09-2e44c7c4", "nf": 2, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Alin Ivan gana el Triton ONE North Cyprus Genesis por US$ 450.000"}, {"bajada": "Jason Nguyen venci\u00f3 a Sebastian Crema de Canad\u00e1 en heads-up del Borgata Fall Poker Open $600 Kickoff, derrotando a 1.862 entradas. Tras acuerdo de chop entre los tres finalistas, Nguyen se llev\u00f3 $126.727, cumpliendo su promesa personal de ganar un trofeo en la sala de Atlantic City.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-09", "foto": "", "fuente": "PokerNews", "id": "2026-11-09-c8929a2e", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Jason Nguyen gana Borgata Fall Poker Open Kickoff por US$ 126.727"}, {"bajada": "El WPT Seoul en la nueva sala YY Poker Club gener\u00f3 1.033 entradas y un pozo de KRW 1.56 billones (aproximadamente US$ 1,17 millones), superando su garant\u00eda de KRW 1 bill\u00f3n. Dong Li Shen encabezaba el D\u00eda Final de la INSPIRE Championship.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-11-09", "foto": "", "fuente": "PokerNews", "id": "2026-11-09-e73988e8", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "WPT Se\u00fal en YY Poker Club cierra con 1.033 entradas y pozo de aproximadamente US$ 1,17 millones"}, {"bajada": "El WSOP Circuit Sanremo se juega del 20 de noviembre al 1 de diciembre en Casino Sanremo, Italia, con 11 anillos en juego. Cada ganador de anillo elegible recibe un paquete WSOP Paradise de $5.000, incluyendo entrada al Circuit Championship Mystery Bounty y hospedaje en Bahamas, antes del inicio de WSOP Paradise el 2 de diciembre.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-09", "foto": "", "fuente": "PokerNews", "id": "2026-11-09-5aee95eb", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "WSOP Circuit Sanremo ofrece 11 anillos y paquetes de US$ 5.000 a WSOP Paradise"}, {"bajada": "El catal\u00e1n Adri\u00e0 D\u00edaz se proclam\u00f3 campe\u00f3n del \u00a31.500 High Roller del GUKPT Blackpool con 56 entradas, ganando \u00a333.250 tras derrotar a Chris Balmforth en heads-up. El triunfo llega semanas despu\u00e9s de su subcampe\u00f3n en el Super High Roller del APPT Manila por 4.320.000 PHP (US$ 68.628).", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-09", "foto": "", "fuente": "PokerNews en espa\u00f1ol", "id": "2026-11-09-74c67085", "nf": 2, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Adri\u00e0 D\u00edaz [nacionalidad a confirmar] gana High Roller GUKPT Blackpool por \u00a333.250"}, {"bajada": "Justin Fawcett encabeza el conteo de fichas tras el D\u00eda 1B del Main Event de la WSOP Circuit Panam\u00e1 2026 con 1.100.000 fichas (90 BB). El torneo de US$ 1.700 con garant\u00eda de US$ 500.000 acumula 190 registros (US$ 323.000) tras dos vuelos; 111 registros en el D\u00eda 1B generaron US$ 188.700.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-11-09", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-09-8f76b89f", "nf": 1, "region": "", "sec": "latam", "secs": ["latam"], "titulo": "Justin Fawcett lidera D\u00eda 1B del Main Event WSOP Circuit Panam\u00e1"}, {"bajada": "Tian Mengshi encabeza el conteo de fichas del Main Event WSOP Circuit Rosario tras el D\u00eda 1B con 1.000.000 de fichas. El D\u00eda 1B registr\u00f3 72 entradas (US$ 185.115 en pozo parcial); 11 jugadores avanzaron al D\u00eda 2 de los 16 niveles jugados. Roman Narulin es segundo con 654.000 fichas y Leandro Bianchini tercero con 362.000.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-11-09", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-09-99a75c23", "nf": 1, "region": "", "sec": "latam", "secs": ["latam"], "titulo": "Tian Mengshi [nacionalidad a confirmar] lidera D\u00eda 1B del Main Event WSOP Circuit Rosario"}, {"bajada": "Mark Lacoste gan\u00f3 el anillo del Evento #6 ($400 NLH Turbo Deepstack) de la WSOP Circuit Rosario tras 279 entradas y US$ 89.280 en pozo. Sebasti\u00e1n Lobo finaliz\u00f3 tercero por US$ 8.700 y Juli\u00e1n Ventura segundo por US$ 12.800.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-09", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-09-2957831a", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Mark Lacoste [nacionalidad a confirmar] gana anillo WSOP Circuit Rosario en evento Turbo Deepstack"}, {"bajada": "Thomas Heine lidera el D\u00eda 1C y Jorge Guzm\u00e1n el D\u00eda 1D del Mini Main Event de la WSOP Circuit Panam\u00e1 (US$ 500). El D\u00eda 1C tuvo 119 entradas con 12 clasificados al D\u00eda Final y 19 premios repartidos. La serie distribuye 12 anillos hasta el 15 de noviembre en el Sortis Hotel, Spa \u0026 Casino de Panam\u00e1.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-11-09", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-09-d1213c5e", "nf": 1, "region": "", "sec": "latam", "secs": ["latam"], "titulo": "Thomas Heine y Jorge Guzm\u00e1n lideran D\u00edas 1C y 1D del Mini Main Event WSOP Circuit Panam\u00e1"}, {"bajada": "Los reconocidos jugadores de high-stakes Alex Foxen y Kristen Foxen anunciaron una asociaci\u00f3n con la plataforma de criptomonedas Solana y la WSOP para facilitar compras de fichas de torneo con criptomonedas en WSOP Bahamas. La iniciativa busca simplificar el proceso de transferencia de fondos para buy-ins internacionales.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-08", "foto": "", "fuente": "PokerNews", "id": "2026-11-08-49d1f23b", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Alex Foxen y Kristen Foxen se asocian con Solana para WSOP Paradise"}, {"bajada": "PokerStars Big Game on Tour regresa en su tercera temporada con un elenco que incluye al comediante Tony Hinchcliffe, Doug Polk, Antonio Esfandiari, Esther Taylor, Princess Love y Scott Gaughan como Loose Cannon, quien compite con US$ 50.000 en fichas por 150 manos. El programa se estrena en YouTube.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-08", "foto": "", "fuente": "PokerNews", "id": "2026-11-08-64ecf1a0", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Doug Polk y Tony Hinchcliffe encabezan PokerStars Big Game on Tour"}, {"bajada": "Maria Konnikova y James Hartigan, embajadores de PokerStars, lanzaron el segundo episodio de The Tough Call con el periodista Jon Ralston como invitado. El episodio discute confianza medi\u00e1tica, desinformaci\u00f3n y pron\u00f3sticos electorales, disponible en YouTube, Apple Podcasts y Spotify. La primera temporada constar\u00e1 de 10 episodios.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-08", "foto": "", "fuente": "PokerNewsDaily", "id": "2026-11-08-2c905420", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "The Tough Call: podcast de PokerStars aborda confianza medi\u00e1tica y desinformaci\u00f3n"}, {"bajada": "En el Evento #1 $3.000 QQPK Genesis de Triton One Cyprus, Ren Lin perdi\u00f3 con ases de bolsillo ante un straight flush runner-runner de Bakbergen Absadyk El evento complet\u00f3 cuatro vuelos de Day 1 con 912 entradas y US$ 2.443.248 en bolsa, clasificando 146 jugadores al Day 2.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-08", "foto": "", "fuente": "PokerNews", "id": "2026-11-08-10a03715", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Runner-runner straight flush elimina ases de bolsillo en Triton One Cyprus"}, {"bajada": "El estadounidense Thomas Heine se impuso al paname\u00f1o \u00c1lvaro Beitia en heads-up del Mini Main Event de WSOP Circuit Panam\u00e1, ganando US$ 38.990 y un paquete de US$ 5.000 para competir en WSOP Bahamas. El torneo reuni\u00f3 453 registros en cuatro vuelos clasificatorios con buy-in de US$ 500.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-08", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-08-759b95da", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Thomas Heine gana primer anillo WSOP Circuit Panam\u00e1 en Mini Main Event"}, {"bajada": "El peruano Luis Armando Ore Ram\u00edrez cerr\u00f3 como chip leader del D\u00eda 1A del Main Event de WSOP Circuit Panam\u00e1 con 1.500.000 fichas (124 BB). El primer vuelo registr\u00f3 79 entradas generando US$ 134.300, con solo 7 jugadores avanzando al D\u00eda 2. La paname\u00f1a Natahalei Adames fue la \u00fanica mujer clasificada con 639.000 fichas.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-08", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-08-d3bb8cd9", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Luis Armando Ore Ram\u00edrez lidera D\u00eda 1A del Main Event WSOP Circuit Panam\u00e1"}, {"bajada": "Humberto Busico se consagr\u00f3 campe\u00f3n del Evento #1 US$ 500 Mini Main Event de WSOP Circuit Rosario tras vencer en mesa final a 51 jugadores. El torneo tuvo tres d\u00edas de duraci\u00f3n con dos jornadas clasificatorias de dos vuelos cada una.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-08", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-08-2f942a0b", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Humberto Busico [nacionalidad a confirmar] gana anillo WSOP Rosario en Mini Main Event"}, {"bajada": "Sergio Di Pego se consagr\u00f3 campe\u00f3n del Evento #4 US$ 500 NLH Seniors Event de WSOP Circuit Rosario, torneo exclusivo para mayores de 50 a\u00f1os. El evento registr\u00f3 112 entradas conformando un pozo de US$ 45.360 con 17 puestos premiados. Di Pego super\u00f3 a Guillermo Garc\u00eda en heads-up.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-08", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-08-de8227f2", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Sergio Di Pego gana anillo Seniors Event WSOP Circuit Rosario"}, {"bajada": "Juli\u00e1n Ventura encabez\u00f3 el primer vuelo del Main Event de WSOP Circuit Rosario con 948.000 fichas. El D\u00eda 1A registr\u00f3 51 entradas generando US$ 76.755 parciales, con 8 jugadores avanzando al D\u00eda 2 que se disputar\u00e1 el 9 de noviembre. Facundo Trigueiro acumul\u00f3 426.000 fichas.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-08", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-08-bfe58dd6", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Juli\u00e1n Ventura [nacionalidad a confirmar] lidera D\u00eda 1A del Main Event WSOP Circuit Rosario"}, {"bajada": "Cherish Andrews emergi\u00f3 como chip leader despu\u00e9s del D\u00eda 1a del $5.000 WPT Venetian Las Vegas Fall Championship en el Venetian de Nevada. El torneo, que corre del 5 al 10 de noviembre, tiene garant\u00eda de US$ 2 millones. El D\u00eda 1a reuni\u00f3 103 entradas, de las cuales 32 jugadores avanzaron al D\u00eda 2.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-07", "foto": "", "fuente": "PokerNewsDaily", "id": "2026-11-07-6ca554b4", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Cherish Andrews lidera el D\u00eda 1a del $5.000 WPT Venetian Las Vegas Fall Championship"}, {"bajada": "Daniel Lowery, de 52 a\u00f1os de Peter Pender, Arkansas, gan\u00f3 su 22\u00ba trofeo del World Series of Poker Circuit al vencer en el evento $400 40/40/40 del WSOPC Choctaw festival, ganando US$ 28.710 ante 449 entradas. Con esta victoria, asegur\u00f3 el segundo lugar en la tabla de anillos WSOPC, detr\u00e1s de Maurice Hawkins, quien tiene 26.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-07", "foto": "", "fuente": "CardPlayer", "id": "2026-11-07-22627584", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Daniel Lowery gana su 22\u00ba anillo WSOPC y toma segundo lugar en la carrera de t\u00edtulos"}, {"bajada": "Aleksandar Kosarkoski venci\u00f3 a un campo de 2.147 entradas para ganar el \u20ac600 MPF Grand Event con garant\u00eda de \u20ac200K. Kosarkoski comenz\u00f3 la mesa final de nueve jugadores con 39 BB en posici\u00f3n desventajosa y logr\u00f3 remontar para ganar tras casi dos horas de cabezas contra cabezas contra Gabriele Santoro.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-07", "foto": "", "fuente": "PokerListings", "id": "2026-11-07-1a11bbc6", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Aleksandar Kosarkoski gana el \u20ac600 Malta Poker Festival Grand Event"}, {"bajada": "CoinPoker registr\u00f3 batallas de cabezas contra cabezas a $500/$1.000 en no-limit hold\u0027em esta semana. El alto-stakes action contin\u00faa creciendo tras el lanzamiento de The Next Level, la actualizaci\u00f3n de software y producto de CoinPoker.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-11-07", "foto": "", "fuente": "CardPlayer", "id": "2026-11-07-817fcf4e", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "High-stakes no-limit hold\u0027em resurge en CoinPoker con botes de US$ 500.000"}, {"bajada": "El Grosvenor UK Poker Tour revel\u00f3 su cronograma para 2027 con nueve etapas GUKPT, m\u00e1s el retorno de tres festivales populares: UK Open, Goliath y Behemoth. El tour recorrer\u00e1 Londres, Manchester, Luton, Glasgow, Leeds, Blackpool y Coventry, comenzando en Londres el 14 de enero.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-07", "foto": "", "fuente": "PokerNews", "id": "2026-11-07-63fa61a0", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "GUKPT anuncia nueve etapas para 2027 en su 20\u00ba aniversario"}, {"bajada": "Matt Berkey confirm\u00f3 el regreso del podcast Only Friends despu\u00e9s de firmar su salida en abril de 2025 tras 719 episodios. El programa emitir\u00e1 de lunes a jueves con cuatro shows semanales, comenzando el 9 de noviembre a las 11 a.m. PT. Only Friends gan\u00f3 el award Global Poker Awards 2023 como Best Podcast.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-11-07", "foto": "", "fuente": "PokerNews", "id": "2026-11-07-37b517aa", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "Only Friends Podcast regresa con cuatro emisiones semanales a partir del 9 de noviembre"}, {"bajada": "El WPT Venetian Las Vegas Fall Championship ($5.000 buy-in, US$ 2 millones garantizados) es el primer evento WPT en Estados Unidos donde los dealers emplean slide dealing, t\u00e9cnica donde las cartas se deslizan sobre el feltro hacia los jugadores en lugar del pitch dealing tradicional. El South Point fue la primera sala de p\u00f3ker de Las Vegas en adoptar esta t\u00e9cnica a principios de 2026.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-11-07", "foto": "", "fuente": "PokerNews Brasil", "id": "2026-11-07-b759c15b", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "WPT Venetian Las Vegas usa slide dealing por primera vez en evento WPT de Estados Unidos"}, {"bajada": "El Evento #1 Mini Main Event del WSOP Circuit Panam\u00e1 ($500 buy-in) registr\u00f3 453 entradas repartidas en cuatro vuelos y dej\u00f3 47 jugadores avanzando al D\u00eda 2 en el Hotel Sortis, Spa \u0026 Casino de Ciudad de Panam\u00e1. Thomas Heine (estadounidense) lider\u00f3 los dos \u00faltimos vuelos con 649.000 fichas; Jorge Guzm\u00e1n Fl\u00f3rez (colombiano) fue el mejor del D\u00eda 1D.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-07", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-07-55d76ef1", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "47 jugadores avanzan en Mini Main Event WSOP Circuit Panam\u00e1 tras cuatro vuelos"}, {"bajada": "Vladimir Minko se impuso en el GGMillion$ High Roller de GGPoker tras una batalla heads-up de m\u00e1s de dos horas contra Juan Pardo, asegurando su segundo t\u00edtulo en el evento y $440.000 en premios.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-06", "foto": "", "fuente": "PokerListings", "id": "2026-11-06-c9599031", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Vladimir Minko gana segundo t\u00edtulo GGMillion$ High Roller, venciendo a Juan Pardo heads-up por US$ 440K"}, {"bajada": "Joe McKeehen, campe\u00f3n del 2015 WSOP Main Event, gan\u00f3 el evento final de la serie PGT Sprint, que const\u00f3 de siete eventos y termin\u00f3 en Las Vegas.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-06", "foto": "", "fuente": "tightpoker.com", "id": "2026-11-06-28db849b", "nf": 2, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Joe McKeehen gana el \u00faltimo evento de la serie PGT Sprint en Las Vegas"}, {"bajada": "El $5.000 WPT Venetian Las Vegas Fall Championship ($2 millones garantizados, del 5 al 10 de noviembre) es el primer evento WPT en Estados Unidos que utiliza la t\u00e9cnica de slide dealing en lugar del pitch tradicional, una medida adoptada para prevenir trucos.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-11-06", "foto": "", "fuente": "PokerNews", "id": "2026-11-06-cec85381", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "WPT Venetian Las Vegas usa slide dealing por primera vez en evento WPT de EE.UU."}, {"bajada": "Nicol\u00e1s Bokowski, de Alemania, fue coronado Player of the Series del 2026 European Mixed Poker Championship en Tallin tras acumular 809.5 puntos en cinco cashes, incluyendo una victoria en el \u20ac300 Nordic Special Mix y un segundo lugar en el \u20ac1.500 S.O.R.B.E.T. High Roller. Tapani Pulkkinen gan\u00f3 el \u20ac800 Main Event. El festival de 12 eventos gener\u00f3 \u20ac371.070 en prize pools totales.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-06", "foto": "", "fuente": "PokerNews", "id": "2026-11-06-777e90a1", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Nicolas Bokowski gana Player of the Series en European Mixed Poker Championship 2026"}, {"bajada": "Gabi Livshitz de Israel venci\u00f3 a 101 oponentes para ganar el \u20ac2.200 No-Limit Hold\u0027em High Roller del PokerStars Open Aix-en-Provence, generando un prize pool de \u20ac195.840. El evento reuni\u00f3 102 entradas incluyendo re-entries.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-06", "foto": "", "fuente": "PokerNews", "id": "2026-11-06-bafc9ac7", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Gabi Livshitz gana PokerStars Open Aix-en-Provence High Roller por \u20ac2.200"}, {"bajada": "El WSOP Circuit regresa a Grand Victoria Casino en Elgin, Illinois, del 5 al 16 de noviembre de 2026 con 18 eventos de anillo oficial y un $1.700 Main Event con $600.000 garantizados. El Main Event comienza el 12 de noviembre con tres starting flights y permite un re-entry. Cada ganador de anillo recibe un paquete exclusivo WSOP Paradise 2026 valorado en $5.000.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-06", "foto": "", "fuente": "WSOP.com", "id": "2026-11-06-72bec6ad", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "WSOP Circuit Grand Victoria abre series de 18 anillos del 5 al 16 de noviembre en Illinois"}, {"bajada": "La WSOP Circuit Panam\u00e1 abri\u00f3 en Hotel Sortis, Spa \u0026 Casino en Ciudad de Panam\u00e1 con el Evento #1 Mini Main Event (buy-in US$ 500). Tras dos primeros vuelos, el torneo acumula 178 registros y US$ 89.000 en recaudos, con 19 jugadores clasificados al D\u00eda 2.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-06", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-06-fb2b0372", "nf": 2, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "WSOP Circuit Panam\u00e1 comienza con Mini Main Event US$ 500; 19 jugadores avanzan a D\u00eda 2"}, {"bajada": "Felipe Olivieri gan\u00f3 el Evento #2 US$ 1.000 No-Limit Hold\u0027em Knockout de WSOP Circuit Rosario 2026, superando un field de 72 entradas (US$ 62.640 en pozo) para asegurar el primer anillo del festival y US$ 8.000 en premios. Derrot\u00f3 a Ricardo Sald\u00edas en heads-up tras eliminar en mesa final a Emiliano Guido, Fernando, Ra\u00fal Batalla, Iv\u00e1n Balzano, Micaela Yanigro, Luis Miretti y Leandro Bianchini.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-06", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-06-ba0116a4", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Felipe Olivieri [nacionalidad a confirmar] gana primer anillo de WSOP Circuit Rosario en Evento #2 US$ 1.000 Knockout"}, {"bajada": "Pardo elimin\u00f3 a Juho Suutari y Unelmavavy durante la jornada, pero perdi\u00f3 contra David Kaufmann (tercero, US$ 240.435) antes del heads-up final.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-06", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-06-acb32eb7", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Juan Pardo pierde heads-up GGMillion$ contra Vladimir Minko; suma US$ 311.806"}, {"bajada": "Fraser Bellamy de Sheffield gan\u00f3 el \u00a3250 GUKPT Blackpool Mini Main al superar 687 entradas. El evento gener\u00f3 un pool de \u00a3143.580. Bellamy venci\u00f3 a Michael Rosaman en la mesa final tras un pacto entre los tres \u00faltimos supervivientes que dej\u00f3 \u00a36.400 para el campe\u00f3n.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-05", "foto": "", "fuente": "PokerNews", "id": "2026-11-05-2e7f4d61", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Fraser Bellamy gana el GUKPT Blackpool Mini Main por \u00a327.945"}, {"bajada": "Tereza Vernerova, jugadora checa, se convirti\u00f3 en la primera mujer en ganar el Main Event del Battle of Malta tras vencer a Ofer Tadmor en heads-up. El evento de 600 \u20ac reuni\u00f3 5.368 entradas con pool inicial de 227.835 \u20ac; tras pacto ICM entre los tres \u00faltimos supervivientes, Vernerova se embols\u00f3 162.635 \u20ac y levant\u00f3 el trofeo tras m\u00e1s de doce horas de competici\u00f3n.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-05", "foto": "", "fuente": "PokerNews en espa\u00f1ol", "id": "2026-11-05-7d496dc6", "nf": 3, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Tereza Vernerova gana el Main Event del Battle of Malta por 162.635 \u20ac, primera mujer campeona"}, {"bajada": "Los votantes de Nebraska rechazaron dos refer\u00e9ndums para legalizar apuestas deportivas en l\u00ednea (Initiative Measure 440 e Initiative Measure 441); ambas iniciativas recibieron aproximadamente 54% de votos en contra. Virginia e Indiana tambi\u00e9n rechazaron propuestas para expandir juegos de azar. En Texas, la ola azul podr\u00eda abrir puertas a casinos minoristas o apuestas deportivas en el futuro.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-11-05", "foto": "", "fuente": "CardPlayer", "id": "2026-11-05-8511ab17", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "Votantes en Indiana, Nebraska y Virginia rechazan expansi\u00f3n de juegos de azar"}, {"bajada": "La RunGood Poker Series llegar\u00e1 a Jamul Casino en San Diego del 17 al 22 de noviembre con 12 eventos de anillo. El $600 Main Event garantiza US$ 150.000 y comienza el viernes 20 de noviembre con tres vuelos iniciales. El festival incluye eventos como $300 PokerNews PowerStack y competiciones Tag Team.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-05", "foto": "", "fuente": "PokerNews", "id": "2026-11-05-6f2b774d", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "RunGood Poker Series trae Golden Expedition a Jamul Casino con Main Event de US$ 150K garantizados"}, {"bajada": "Vladimir Minko de Rusia gan\u00f3 el $10.000 GGMillion$ High Roller en GGPoker, venciendo a Juan Dominguez en heads-up. Su premio fue US$ 404.362, su segundo t\u00edtulo en ese evento. Minko enfrent\u00f3 un field de 202 entradas, lo que niega a Dominguez lo que hubiera sido su sexto t\u00edtulo GGMillion$. Las ganancias totales de Minko en torneos GGPoker superan los US$ 19 millones.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-05", "foto": "", "fuente": "PokerNews", "id": "2026-11-05-541b76a6", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Vladimir Minko gana segundo t\u00edtulo GGMillion$ High Roller por US$ 404.362"}, {"bajada": "Fernando Habegger (alias JNandez), jugador de Pot-Limit Omaha de clase mundial, public\u00f3 su segundo libro PLO titulado \"100 Essential Tips to Master Pot-Limit Omaha\" con D+B Publishing. Su anterior trabajo fue \"Mastering Small Stakes Pot-Limit Omaha\". El nuevo libro cubre conceptos estrat\u00e9gicos incluyendo tama\u00f1o de stack, posici\u00f3n, blockers, estructura de mano, juego heads-up versus multiway.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-11-05", "foto": "", "fuente": "PokerNews", "id": "2026-11-05-16ffc8e6", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "Fernando Habegger publica nuevo libro sobre Pot-Limit Omaha con D+B Publishing"}, {"bajada": "La serie reparte 12 anillos de oro con Main Event de US$ 1.700 buy-in y US$ 500.000 garantizados. La jornada inaugural incluye dos vuelos del Mini Main Event de US$ 500 y el primero del Gladiator Turbo de US$ 300. En la edici\u00f3n anterior, Peisen Ma gan\u00f3 el Main Event con 341 entradas y premio de US$ 100.000.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-05", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-05-87f41f23", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "WSOP Circuit Panam\u00e1 arranca con 12 anillos; Main Event de US$ 500.000 garantizados"}, {"bajada": "La nueva sala YY Poker Club, ubicada en el INSPIRE Resort, cuenta con paneles LED de alta definici\u00f3n, decoraci\u00f3n que combina escenas tradicionales con exhibici\u00f3n art\u00edstica e inspiraci\u00f3n en est\u00e9tica del Este Asi\u00e1tico.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-05", "foto": "", "fuente": "PokerNews Brasil", "id": "2026-11-05-8be96463", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "WPT Se\u00fal destaca nueva sala YY Poker Club en INSPIRE Resort con dise\u00f1o de lujo"}, {"bajada": "", "cat": "Tema caliente", "credito": "", "destacada": false, "dia": "2026-11-05", "foto": "", "fuente": "CardPlayer", "id": "2026-11-05-tema-89923a9e", "nf": 1, "region": "", "sec": "tema", "secs": ["temas"], "titulo": "Tema: No-Limit Hold\u0027em"}, {"bajada": "El streamer neerland\u00e9s y popular personalidad de Twitch se incorpora a GGPoker como su m\u00e1s reciente embajador de streaming. Veldhuis se suma al roster del GGTeam junto a figuras como Daniel Negreanu y Michael Mizrachi.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-11-04", "foto": "", "fuente": "Pokerfuse", "id": "2026-11-04-c22d3bfc", "nf": 5, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "Lex Veldhuis se une al GGTeam como embajador global de streaming"}, {"bajada": "Hamid Izadi gan\u00f3 por segunda vez consecutiva el Main Event de WSOP Circuit Southern Indiana, derrotando a Robert Hankins heads-up en una mesa final de 282 entradas; recibi\u00f3 US$ 93.060 y su 11\u00ba anillo de oro, con lo que se empareja con Maurice Hawkins en cuatro t\u00edtulos de Main Event de WSOPC. Scott Stewart gan\u00f3 el Main Event de WSOP Circuit Lake Tahoe tras remontar un d\u00e9ficit de 3 a 1 contra Tyler Parker, sumando su noveno anillo de oro.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-04", "foto": "", "fuente": "WSOP.com", "id": "2026-11-04-267590dc", "nf": 2, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Hamid Izadi e Izadi defiende t\u00edtulo en WSOP Circuit Southern Indiana; Scott Stewart gana Lake Tahoe"}, {"bajada": "La serie corre del 8 al 24 de noviembre con cuatro Main Events adicionales.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-04", "foto": "", "fuente": "PokerListings", "id": "2026-11-04-59865e3c", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "ACR Poker divide Online Super Series en dos tracks con US$ 20 millones garantizados"}, {"bajada": "Jared \u0027Theblez\u0027 Bleznick derrot\u00f3 a Dirk \u0027venividi1993\u0027 Gerritse en una sesi\u00f3n heads-up de 5-card PLO a US$ 200-400 (US$ 100 ante) en CoinPoker el domingo, registrando una ganancia estimada de alrededor de US$ 500.000. Gerritse reporta estar en alza de aproximadamente US$ 1.5 millones seg\u00fan un sitio de seguimiento.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-04", "foto": "", "fuente": "CardPlayer", "id": "2026-11-04-c1a21553", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Jared Bleznick vence a Dirk Gerritse en 5-card PLO de high-stakes en CoinPoker"}, {"bajada": "Sam Soverel, de 38 a\u00f1os, extendi\u00f3 su ventaja en el contador de t\u00edtulos del PokerGO Tour con su 18\u00aa victoria, ganando el Event No. 5 de PGT Sprint 2026 en un torneo de US$ 10.500 no-limit hold\u0027em ante 61 entradas. Recibi\u00f3 US$ 195.200 como ganador, acumulando US$ 1.7 millones en 22 cashes en el circuito de high-stakes este a\u00f1o.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-04", "foto": "", "fuente": "CardPlayer", "id": "2026-11-04-bace1731", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Sam Soverel gana su 18\u00ba t\u00edtulo PGT Sprint, extendiendo r\u00e9cord de la serie"}, {"bajada": "El ganador de dos brazaletes WSOP Alex Livingston apareci\u00f3 en el podcast Table 1 revelando que invent\u00f3 el t\u00e9rmino Old Man Coffee (OMC), uno de los estereotipos m\u00e1s reconocibles del poker, alrededor de 2009 en los foros Two Plus Two como parte de una gu\u00eda introductoria sobre poker en vivo.", "cat": "Noticias", "credito": "", "destacada": false, "dia": "2026-11-04", "foto": "", "fuente": "PokerNews", "id": "2026-11-04-b39bc3d3", "nf": 1, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "Alex Livingston revela que acu\u00f1\u00f3 el t\u00e9rmino Old Man Coffee en 2009"}, {"bajada": "Texas Card House Houston agreg\u00f3 un guardia de seguridad adicional de manera permanente tras al menos cuatro asaltos a mano armada en salas de p\u00f3ker del \u00e1rea de Houston en las \u00faltimas semanas, incluido un incidente en Capri Poker Club donde m\u00e1s de una docena de asaltantes ingresaron a la sala de 20 mesas. TCH tambi\u00e9n increment\u00f3 seguridad en su ubicaci\u00f3n de Dallas por razones no relacionadas.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-11-04", "foto": "", "fuente": "PokerNews", "id": "2026-11-04-7af46a94", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "Texas Card House refuerza seguridad tras serie de asaltos en salas de p\u00f3ker de Houston"}, {"bajada": "El Malta Poker Festival, que tuvo lugar del 23 de octubre al 4 de noviembre de 2026, se posicion\u00f3 como espacio inclusivo para todos los niveles de jugadores. En su evento Ladies First se registr\u00f3 un r\u00e9cord de participantes, ganado por Andrea Yvonne King de Inglaterra.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-04", "foto": "", "fuente": "PokerListings", "id": "2026-11-04-44a8ca48", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Malta Poker Festival celebra edici\u00f3n oto\u00f1al enfocada en inclusi\u00f3n comunitaria"}, {"bajada": "Ian Simpson, embajador de 888poker, gan\u00f3 la 10\u00aa y \u00faltima edici\u00f3n de la Kav Cup en el festival GUKPT Blackpool y don\u00f3 su premio de \u00a3 4.950 a caridad, permitiendo que el evento beneficente alcanzara su meta de \u00a3 100.000. Desde su creaci\u00f3n en 2015, la Kav Cup ha recaudado \u00a3 86.648,42 para causas ben\u00e9ficas.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-04", "foto": "", "fuente": "PokerNews", "id": "2026-11-04-f6ef4196", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Ian Simpson dona premio de Kav Cup a caridad, ayudando a alcanzar meta de \u00a3 100.000"}, {"bajada": "El Battle of Malta Barcelona Edition se disputar\u00e1 del 20 al 24 de enero de 2027 en Casino Barcelona. El Main Event de \u20ac 600 contar\u00e1 con cuatro vuelos iniciales, 40.000 fichas de salida (400 ciegas en nivel 1), ciegas iniciales de 100/100 y niveles de 40 minutos.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-04", "foto": "", "fuente": "PokerNews", "id": "2026-11-04-96d6e21e", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Battle of Malta anuncia edici\u00f3n Barcelona para enero de 2027"}, {"bajada": "Juan Pardo alcanz\u00f3 por 40\u00aa vez la mesa final del GGMillion$ (torneo de US$ 10.000 en GGPoker) y lleg\u00f3 hasta el heads-up, donde cay\u00f3 ante Vladimir Minko y recibi\u00f3 US$ 311.806. Minko gan\u00f3 el torneo de 202 entradas con bolsa de premios de US$ 2.010.000 y se llev\u00f3 US$ 404.362. Pardo, quien ya cuenta con cinco t\u00edtulos en el evento, buscaba ampliar su palmar\u00e9s.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-04", "foto": "", "fuente": "PokerNews en espa\u00f1ol", "id": "2026-11-04-4c4ef194", "nf": 2, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Juan Pardo [nacionalidad a confirmar], runner-up en GGMillion$ por US$ 311.806, se acerca a sexto t\u00edtulo"}, {"bajada": "Raymond P\u00e9rez, venezolano radicado en Panam\u00e1, defiende su t\u00edtulo ganado en edici\u00f3n anterior.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-04", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-04-236f6258", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "WSOP Circuit Panam\u00e1 comienza con 12 anillos de oro en juego; Raymond P\u00e9rez defiende t\u00edtulo"}, {"bajada": "", "cat": "Tema caliente", "credito": "", "destacada": false, "dia": "2026-11-04", "foto": "", "fuente": "Poker Red", "id": "2026-11-04-tema-d9177b87", "nf": 1, "region": "", "sec": "tema", "secs": ["temas"], "titulo": "Tema: Adri\u00e1n Mateos"}, {"bajada": "CoinPoker lanz\u00f3 la versi\u00f3n 2.0 de su software con cash games de high-stakes bajo la marca High Stakes Poker (stakes desde $50/$100 hasta $5.000/$10.000 con rake del 5%), torneos Mystery Bounty, mesas privadas personalizables, mejoras de gameplay y nuevo lobby de torneos.", "cat": "Software", "credito": "", "destacada": false, "dia": "2026-11-03", "foto": "", "fuente": "PokerListings", "id": "2026-11-03-3cc391c8", "nf": 2, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "CoinPoker 2.0: high-stakes cash games, Mystery Bounty tournaments y private tables"}, {"bajada": "El evento anterior en Tall\u00edn fue en 2022, cuando Eirik Kristiansen de Noruega gan\u00f3 \u20ac56.100.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-03", "foto": "", "fuente": "PokerNews", "id": "2026-11-03-0bba373f", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "The Festival regresa a Tall\u00edn con m\u00e1s de 70 torneos del 20 al 29 de noviembre"}, {"bajada": "BetRivers Poker lanz\u00f3 torneos Mystery Bounty oficialmente, con el primer evento de prueba programado para el 4 de noviembre con buy-in de $5 y garant\u00eda de $400. La caracter\u00edstica estar\u00e1 disponible en los cuatro estados donde opera el operador.", "cat": "Software", "credito": "", "destacada": false, "dia": "2026-11-03", "foto": "", "fuente": "Pokerfuse", "id": "2026-11-03-42007321", "nf": 3, "region": "", "sec": "general", "secs": ["mundial"], "titulo": "BetRivers Poker lanza torneos Mystery Bounty con evento prueba el 4 de noviembre"}, {"bajada": "Phuong Ta se coron\u00f3 campe\u00f3n del Main Event de la RunGood Poker Series Jacksonville tras disputar una mesa final extensa. Paralelamente, la serie se dirige a Kentucky del 17 al 22 de noviembre con diez eventos de anillos y un Main Event de $600 con garant\u00eda de $100.000.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-03", "foto": "", "fuente": "PokerNews", "id": "2026-11-03-0a2e4a83", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Phuong Ta gana Main Event RunGood Poker Series Jacksonville tras mesa final marat\u00f3nica"}, {"bajada": "World Series of Poker Paradise (del 3 al 14 de diciembre en Baha Mar, Bahamas) permite a los jugadores comprar fichas utilizando Solana Pay a trav\u00e9s de la app WSOP Live, evitando comisiones de tarjeta de cr\u00e9dito y registro presencial.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-03", "foto": "", "fuente": "PokerNews", "id": "2026-11-03-c8c59298", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "WSOP Paradise 2026 acepta buy-ins en Solana para evitar comisiones y filas"}, {"bajada": "GGPoker lanz\u00f3 su PLO Series del 1 al 17 de noviembre con m\u00e1s de 450 torneos, buy-ins desde US$ 15 hasta US$ 10.000 y US$ 20 millones garantizados totales. La serie incluye seis eventos con US$ 1 mill\u00f3n garantido cada uno, incluyendo tres ediciones del US$ 10.000 GGMillion$ PLO el 1, 8 y 15 de noviembre, y torneos Ocean KO.", "cat": "Torneos y eventos", "credito": "", "destacada": false, "dia": "2026-11-03", "foto": "", "fuente": "PokerNews Brasil", "id": "2026-11-03-f65b1cf5", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "PLO Series regresa a GGPoker con US$ 20 millones garantizados del 1 al 17 de noviembre"}, {"bajada": "Fernando G\u00e1mez se consagr\u00f3 campe\u00f3n del Main Event de Winner Poker Series Medell\u00edn 2026 en Casino Hollywood Milla de Oro. Nacionalidad indicada por la fuente: Colombia.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-03", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-03-45b7536a", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Fernando G\u00e1mez gana Main Event WPS Medell\u00edn 2026; Henry Arroyave cierra con Closing Turbo"}, {"bajada": "Paul Tacsan, costarricense, se coron\u00f3 campe\u00f3n del Mini High Roller PLO5 K.O. en las WPS Medell\u00edn 2026, llev\u00e1ndose $16.000.000 COP. El torneo reuni\u00f3 61 registros, gener\u00f3 $85.400.000 COP (superando el garantizado de $70.000.000 COP). Su compatriota Miguel Solano fue runner-up con $10.500.000 COP.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-03", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-03-1719f15a", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Paul Tacsan (Costa Rica) gana Mini High Roller PLO5 K.O. en WPS Medell\u00edn 2026"}, {"bajada": "", "cat": "Tema caliente", "credito": "", "destacada": false, "dia": "2026-11-03", "foto": "", "fuente": "PokerNewsDaily", "id": "2026-11-03-tema-c6b774ea", "nf": 2, "region": "", "sec": "tema", "secs": ["temas"], "titulo": "Tema: Nacho Barbero"}, {"bajada": "", "cat": "Tema caliente", "credito": "", "destacada": false, "dia": "2026-11-03", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-03-tema-d9177b87", "nf": 2, "region": "", "sec": "tema", "secs": ["temas"], "titulo": "Tema: Adri\u00e1n Mateos"}, {"bajada": "", "cat": "Tema caliente", "credito": "", "destacada": false, "dia": "2026-11-03", "foto": "", "fuente": "tightpoker.com", "id": "2026-11-03-tema-89923a9e", "nf": 1, "region": "", "sec": "tema", "secs": ["temas"], "titulo": "Tema: No-Limit Hold\u0027em"}, {"bajada": "Bo Hoebe derrot\u00f3 a Nacho Barbero en heads-up para conquistar el WSOP Circuit Madrid Main Event (\u20ac1.500 buy-in) de 918 entradas. El premio fue \u20ac207.000 de un prize pool de \u20ac1.164.942, adem\u00e1s de un paquete de US$ 5.000 para WSOP Paradise.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-02", "foto": "", "fuente": "PokerNews", "id": "2026-11-02-88dafa0f", "nf": 3, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Bo Hoebe gana Main Event WSOP Circuit Madrid por \u20ac207.000, su segundo anillo del circuito"}, {"bajada": "Una operaci\u00f3n sofisticada dirigida a jugadores de altas apuestas comprometi\u00f3 las aplicaciones de terceros Jurojin e IntuitiveTables, que permiten jugar m\u00faltiples mesas simult\u00e1neamente. Los atacantes habr\u00edan instalado MeshAgent, una herramienta de acceso remoto, a trav\u00e9s de actualizaciones falsificadas entre junio de 2025 y enero de 2026. Seg\u00fan WolfSec, m\u00e1s de 1.000 usuarios podr\u00edan haber recibido software comprometido. Se estima que el robo alcanz\u00f3 entre US$ 1,5 millones y US$ 4 millones en ganancias il\u00edcitas, con la operaci\u00f3n posiblemente activa durante a\u00f1os.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-11-02", "foto": "", "fuente": "GamblingNews", "id": "2026-11-02-db517489", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "Softwares de terceros Jurojin e IntuitiveTables comprometidos en ataque malicioso que afect\u00f3 high-stakes players"}, {"bajada": "El premio empuj\u00f3 sus ganancias de por vida por encima de US$ 1,1 millones. Kislinskii tambi\u00e9n gan\u00f3 240 Card Player Player of the Year points patrocinados por CoinPoker. Brandon Sunshine fue runner-up, reventando la burbuja al eliminar a Dan Sepiol.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-02", "foto": "", "fuente": "CardPlayer", "id": "2026-11-02-e71b9c5c", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "eventos"], "titulo": "Sergei Kislinskii gana PGT Sprint Event No. 4 con US$ 91.200 y primer t\u00edtulo PGT"}, {"bajada": "Kellie de Celis anunci\u00f3 su salida como Director of Poker Operations de Borgata tras 12 a\u00f1os en el cargo, siendo la primera mujer directora de poker en la historia de MGM Resorts. Su partida gener\u00f3 reacciones mixtas entre jugadores: algunos destacaron la p\u00e9rdida para la sala, mientras que otros en Reddit sugirieron que su \u00e9nfasis en torneos afect\u00f3 la escena de cash games. Borgata posee 52 mesas de cash games y ha sido hist\u00f3ricamente una de las salas de p\u00f3ker de la costa este.", "cat": "Pol\u00e9mica e industria", "credito": "", "destacada": false, "dia": "2026-11-02", "foto": "", "fuente": "CardPlayer", "id": "2026-11-02-e748d062", "nf": 1, "region": "", "sec": "general", "secs": ["mundial", "polemicas"], "titulo": "Kellie de Celis deja direcci\u00f3n de p\u00f3ker en Borgata tras 12 a\u00f1os"}, {"bajada": "Camilo Correa conquist\u00f3 el Mystery Bounty de las Winner Poker Series 2026 en Medell\u00edn, derrotando en heads-up al venezolano Ace Vinotinto. El torneo reuni\u00f3 192 entradas con buy-in de $1.500.000 COP, generando un prize pool de $288.000.000 COP ($153.600.000 COP en premios y $76.800.000 COP en sobres misteriosos). En la mesa final, Correa, Vinotinto y el ecuatoriano Carlos Velasco negociaron los premios restantes, pero mantuvieron la contienda por el trofeo de campe\u00f3n. Correa gan\u00f3 $29.300.000 COP.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-02", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-02-9df1d8c8", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Camilo Correa (Colombia) gana Mystery Bounty WPS Medell\u00edn derrotando a Ace Vinotinto (Venezuela)"}, {"bajada": "El venezolano Eduardo Osorio encabeza la mesa final del Main Event de las Winner Poker Series 2026 Medell\u00edn con 6.300.000 fichas. El torneo reuni\u00f3 671 registros con buy-in de $2.200.000 COP, superando ampliamente el garantizado inicial de $800.000.000 COP, llegando a un recaudo total de $1.476.200.000 COP. Fernando G\u00e1mez (Colombia) ocupa segundo lugar con 5.115.000 fichas. Entre los nueve finalistas tambi\u00e9n est\u00e1 Cristian Ca\u00f1ola.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-02", "foto": "", "fuente": "Poker Noticias", "id": "2026-11-02-a1cb4ac7", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Eduardo Osorio (Venezuela) lidera mesa final Main Event WPS Medell\u00edn con $250 millones COP en juego"}, {"bajada": "El torneo reuni\u00f3 497 entradas con buy-in MXN$ (moneda a confirmar), repartiendo MXN$ 4.000.000 en garant\u00eda entre los mejores 63 competidores. Hinneman reclam\u00f3 MXN$ 856.000.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-02", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-02-a81a8a88", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Benjam\u00edn Hinneman [nacionalidad a confirmar] gana Main Event PSOP Calaverita por MXN$ 856.000, frustrando bicampeonato de Joel Trevi\u00f1o"}, {"bajada": "Dorian Pavon (Venezuela) logr\u00f3 una destacada quinta posici\u00f3n en el PGT Sprint Event #4 disputado en PokerGO Studio Las Vegas con buy-in US$ 5.300, ganando US$ 21.375. El torneo de 57 entradas reparti\u00f3 US$ 285.000. Pavon fue eliminado cuando restaban cinco jugadores en confrontaci\u00f3n directa contra Brandon Sunshine.", "cat": "Resultados", "credito": "", "destacada": false, "dia": "2026-11-02", "foto": "", "fuente": "C\u00f3digo Poker", "id": "2026-11-02-adb8de88", "nf": 1, "region": "", "sec": "latam", "secs": ["latam", "eventos"], "titulo": "Dorian Pavon (Venezuela) quinta posici\u00f3n en PGT Sprint Event #4 por US$ 21.375"}, {"bajada": "", "cat": "Tema caliente", "credito": "", "destacada": false, "dia": "2026-11-02", "foto": "", "fuente": "PokerNews en esp
