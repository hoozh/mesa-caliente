<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administrador · Mesa Caliente</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=PT+Serif:wght@700&family=Roboto+Condensed:wght@700&family=Montserrat:wght@500;800&family=Oswald:wght@600&family=Bebas+Neue&display=swap">
<style>
/* Administrador de Mesa Caliente: menú lateral oscuro, cabecera y bloques (organización tipo panel). */
:root { --mc-side: #2c343f; --mc-side-ink: #c9d1dc; --mc-red: #d9262c; --mc-bg: #f2f4f7; }
body { background: var(--mc-bg); font-family: Inter, system-ui, sans-serif; font-size: 14.5px; }
.layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
aside.side { background: var(--mc-side); color: var(--mc-side-ink); padding: 18px 0; position: sticky; top: 0; height: 100vh; overflow: auto; }
.side .marca { display: flex; align-items: center; gap: 10px; padding: 0 20px 18px; color: #fff; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; }
.side .marca i { width: 26px; height: 26px; border-radius: 50%; background: var(--mc-red); box-shadow: inset 0 0 0 4px var(--mc-side), inset 0 0 0 6px var(--mc-red); }
.side .grupo { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .55; padding: 14px 20px 6px; }
.side button { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--mc-side-ink); padding: 9px 20px; font-weight: 500; }
.side button:hover { background: rgba(255,255,255,.06); color: #fff; }
.side button.activo { background: rgba(255,255,255,.1); color: #fff; box-shadow: inset 3px 0 0 var(--mc-red); }
header.cab { background: #fff; border-bottom: 1px solid #e3e7ec; padding: 12px 24px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 5; }
header.cab h1 { font-size: 18px; margin: 0; font-weight: 700; }
main.contenido { padding: 22px 24px 60px; min-width: 0; }
.bloque { background: #fff; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.05); margin-bottom: 20px; }
.bloque > .bh { padding: 12px 18px; border-bottom: 1px solid #eef0f3; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bloque > .bh h2 { font-size: 15px; font-weight: 700; margin: 0; text-transform: uppercase; letter-spacing: .03em; }
.bloque > .bc { padding: 16px 18px; }
.tabla-wrap { overflow-x: auto; }
table.table { font-size: 13.5px; }
td.titulo { min-width: 220px; }
.badge-sec { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.ayuda { color: #6b7380; font-size: 13px; }
.estado-ok { color: #1f7a55; } .estado-error { color: var(--mc-red); }
.btn-mc { background: var(--mc-red); border-color: var(--mc-red); color: #fff; }
.btn-mc:hover { background: #b81f24; border-color: #b81f24; color: #fff; }
#aviso { position: fixed; right: 20px; bottom: 20px; z-index: 2000; max-width: 420px; }
.menu-movil { display: none; }
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  aside.side { position: fixed; z-index: 1500; width: 250px; transform: translateX(-100%); transition: transform .2s; }
  aside.side.abierto { transform: none; }
  .menu-movil { display: inline-block; }
  main.contenido { padding: 16px 14px 60px; }
}
</style>
</head>
<body>
<div class="layout">
  <aside class="side" id="side">
    <div class="marca"><i></i>Mesa Caliente</div>
    <div class="grupo">Contenido</div>
    <button data-v="noticias">Noticias</button>
    <button data-v="sitio">Menú y secciones</button>
    <button data-v="instagram">Instagram</button>
    <button data-v="videos">Videos</button>
    <button data-v="marcas">Marcas</button>
    <button data-v="biblioteca">Biblioteca (fotos, videos, música)</button>
    <div class="grupo">Barrido</div>
    <button data-v="claves">Palabras clave prioritarias</button>
    <button data-v="busquedas">Búsquedas activas</button>
    <button data-v="barrido">Correr el barrido</button>
    <button data-v="costos">Costos</button>
    <div class="grupo">Bases de datos</div>
    <button data-v="personalidades">Personalidades</button>
    <button data-v="bases">Consultar registros</button>
    <button data-v="archivos">Archivos de SEI</button>
    <a href="../historial.html" target="_blank" rel="noopener" style="display:block;padding:9px 20px;color:var(--mc-side-ink);text-decoration:none;font-weight:500">Historial por día ↗</a>
    <div class="grupo">Proyecto</div>
    <button data-v="propuestas">Propuestas</button>
    <div class="grupo">Cuenta</div>
    <button data-v="conexion">Conexión</button>
  </aside>
  <div>
    <header class="cab">
      <button class="btn btn-sm btn-outline-secondary menu-movil" id="b-menu" type="button">Menú</button>
      <h1 id="titulo-vista" class="text-truncate">Noticias</h1>
      <span class="ms-auto ayuda" id="estado-conexion">Sin conectar</span>
      <button class="btn btn-sm btn-mc" id="b-propuesta" type="button">+ Propuesta</button>
      <a class="btn btn-sm btn-outline-secondary" href="../index.html" target="_blank" rel="noopener">Ver página ↗</a>
    </header>
    <main class="contenido" id="vista"></main>
  </div>
</div>
<div id="aviso"></div>

<script>
(function () {
  const REPO = 'hoozh/mesa-caliente';
  const REPO_PRIV = 'hoozh/mesa-caliente-privado'; // perfiles completos, archivo de resultados y archivos de SEI
  const API = 'https://api.github.com/repos/' + REPO, API_PRIV = 'https://api.github.com/repos/' + REPO_PRIV;
  const RUTA_ARCHIVO = 'resultados/archivo.jsonl';
  let TOKEN = '';
  try { TOKEN = localStorage.getItem('mc-admin-token') || ''; } catch (e) {}
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const hoyISO = () => new Date().toISOString().slice(0, 10);
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const fechaLarga = iso => { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return `${d} de ${MESES[m - 1]} de ${y}`; };

  // ---------------------------------------------------------------- GitHub
  const b64 = txt => { const bytes = new TextEncoder().encode(txt); let s = ''; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s); };
  const deb64 = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g, '')), c => c.charCodeAt(0)));
  async function gh(ruta, opciones = {}, priv = false) {
    if (!TOKEN) throw new Error('Falta conectar el administrador: vaya a «Conexión» y pegue su clave de GitHub.');
    const r = await fetch((priv ? API_PRIV : API) + ruta, { ...opciones, headers: { Authorization: 'Bearer ' + TOKEN, Accept: 'application/vnd.github+json', ...(opciones.headers || {}) } });
    if (r.status === 401) throw new Error('GitHub rechazó la clave. Revise que esté bien copiada y que no haya vencido.');
    if (r.status === 403) throw new Error('La clave no tiene permiso para esto' + (priv ? ' en el repositorio privado' : '') + '. Revise los permisos en «Conexión».');
    if (r.status === 409) throw new Error('El archivo cambió mientras usted editaba (por ejemplo, terminó un barrido). Vuelva a abrir la sección e intente otra vez.');
    if (r.status === 404 && priv && ruta === '') throw new Error('La clave no llega al repositorio privado: agréguelo en «Repository access» de la clave (ver «Conexión»).');
    if (!r.ok && r.status !== 404) throw new Error('GitHub respondió con un error (' + r.status + ').');
    return r;
  }
  async function leer(ruta, priv = false) { // {texto, sha} o {texto: null} si no existe
    const r = await gh('/contents/' + ruta + '?ref=main&t=' + Date.now(), {}, priv);
    if (r.status === 404) return { texto: null, sha: null };
    const j = await r.json();
    if (j.content) return { texto: deb64(j.content), sha: j.sha };
    const raw = await gh('/contents/' + ruta + '?ref=main', { headers: { Accept: 'application/vnd.github.raw+json' } }, priv);
    return { texto: await raw.text(), sha: j.sha };
  }
  async function guardar(ruta, texto, sha, mensaje, priv = false) {
    const cuerpo = { message: mensaje, content: b64(texto), branch: 'main' };
    if (sha) cuerpo.sha = sha;
    const r = await gh('/contents/' + ruta, { method: 'PUT', body: JSON.stringify(cuerpo) }, priv);
    if (!r.ok) throw new Error('No se pudo guardar ' + ruta + '.');
    return (await r.json()).content.sha;
  }
  async function leerBlob(ruta, priv = false) { // archivo binario (imagen, video) del repositorio
    const r = await gh('/contents/' + ruta + '?ref=main&t=' + Date.now(), { headers: { Accept: 'application/vnd.github.raw+json' } }, priv);
    if (r.status === 404) return null; return await r.blob(); }
  async function guardarBinario(ruta, buffer, mensaje, priv = false) {
    let bin = ''; const bytes = new Uint8Array(buffer); for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    const previo = await gh('/contents/' + ruta + '?ref=main', {}, priv); const sha = previo.status === 404 ? null : (await previo.json()).sha;
    const cuerpo = { message: mensaje, content: btoa(bin), branch: 'main' }; if (sha) cuerpo.sha = sha;
    const r = await gh('/contents/' + ruta, { method: 'PUT', body: JSON.stringify(cuerpo) }, priv); if (!r.ok) throw new Error('No se pudo subir ' + ruta + '.'); }
  const leerJSONL = async (ruta, priv = false) => ((await leer(ruta, priv)).texto || '').split('\n').filter(Boolean)
    .map(l => { try { return JSON.parse(l); } catch (e) { return null; } }).filter(Boolean);
  async function leerJSON(ruta, vacio, priv = false) { const x = await leer(ruta, priv); return { datos: x.texto ? JSON.parse(x.texto) : vacio, sha: x.sha }; }
  const json = d => JSON.stringify(d, null, 2) + '\n';

  // ---------------------------------------------------------------- avisos y navegación
  function aviso(texto, tipo = 'success') {
    const el = document.createElement('div');
    el.className = 'alert alert-' + tipo + ' shadow-sm'; el.textContent = texto;
    document.getElementById('aviso').appendChild(el); setTimeout(() => el.remove(), tipo === 'danger' ? 9000 : 4500);
  }
  const vista = document.getElementById('vista');
  const VISTAS = {};
  const TITULOS = { noticias: 'Noticias', claves: 'Palabras clave prioritarias', busquedas: 'Búsquedas activas', barrido: 'Correr el barrido', costos: 'Costos',
    personalidades: 'Personalidades', bases: 'Consultar registros', archivos: 'Archivos de SEI', conexion: 'Conexión',
    sitio: 'Menú y secciones', instagram: 'Instagram', propuestas: 'Propuestas', videos: 'Videos', marcas: 'Marcas', biblioteca: 'Biblioteca' };
  const slugId = t => norm(t).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  async function ir(v) {
    document.querySelectorAll('.side button').forEach(b => b.classList.toggle('activo', b.dataset.v === v));
    document.getElementById('titulo-vista').textContent = TITULOS[v];
    document.getElementById('side').classList.remove('abierto');
    if (!TOKEN && v !== 'conexion') v = 'conexion';
    vista.innerHTML = '<p class="ayuda">Cargando…</p>';
    try { await VISTAS[v](); } catch (e) { vista.innerHTML = `<div class="alert alert-danger">${esc(e.message)}</div>`; }
    try { location.hash = v; } catch (e) {}
  }
  document.getElementById('side').addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (b) ir(b.dataset.v); });
  document.getElementById('b-menu').onclick = () => document.getElementById('side').classList.toggle('abierto');

  // ---------------------------------------------------------------- Conexión
  VISTAS.conexion = async () => {
    vista.innerHTML = `
    <div class="bloque"><div class="bh"><h2>Clave de GitHub</h2></div><div class="bc">
      <p class="ayuda">El administrador guarda los cambios directamente en los repositorios con una clave suya: el público (la página) y el privado (perfiles completos, archivo de resultados y archivos de SEI, que solo ve quien tiene la clave). La clave queda solo en este navegador; quien abra la página pública no puede editar nada ni correr el barrido.</p>
      <ol class="ayuda">
        <li>En GitHub, haga clic en su foto (arriba a la derecha) → <b>Settings</b> → <b>Developer settings</b> (abajo, a la izquierda) → <b>Personal access tokens</b> → <b>Fine-grained tokens</b> → <b>Generate new token</b>.</li>
        <li>Nombre: «Administrador Mesa Caliente». Vencimiento: el que prefiera (por ejemplo, 1 año).</li>
        <li>En <b>Repository access</b> elija <b>Only select repositories</b> y marque <b>hoozh/mesa-caliente</b> y <b>hoozh/mesa-caliente-privado</b>.</li>
        <li>En <b>Permissions</b> → <b>Repository permissions</b>: <b>Contents</b> = Read and write y <b>Actions</b> = Read and write.</li>
        <li>Haga clic en <b>Generate token</b>, copie la clave y péguela aquí abajo.</li>
      </ol>
      <div class="row g-2 align-items-end"><div class="col-md-8"><label class="form-label" for="c-token">Clave</label>
        <input class="form-control" id="c-token" type="password" autocomplete="off" placeholder="github_pat_…" value="${esc(TOKEN)}"></div>
        <div class="col-md-4 d-flex gap-2"><button class="btn btn-mc" id="c-guardar" type="button">Conectar</button><button class="btn btn-outline-secondary" id="c-borrar" type="button">Olvidar clave</button></div></div>
      <p class="mt-3 mb-0" id="c-estado"></p>
    </div></div>`;
    document.getElementById('c-guardar').onclick = async () => {
      TOKEN = document.getElementById('c-token').value.trim();
      try { localStorage.setItem('mc-admin-token', TOKEN); } catch (e) {}
      await probar(); };
    document.getElementById('c-borrar').onclick = () => { TOKEN = ''; try { localStorage.removeItem('mc-admin-token'); } catch (e) {} ; document.getElementById('c-token').value = ''; probar(); };
    if (TOKEN) probar();
  };
  async function probar() {
    const est = document.getElementById('c-estado'), cab = document.getElementById('estado-conexion');
    if (!TOKEN) { cab.textContent = 'Sin conectar'; if (est) est.textContent = ''; return false; }
    try { const r = await gh(''); const j = await r.json(); const ok = j.permissions && j.permissions.push;
      let priv = '';
      try { const jp = await (await gh('', {}, true)).json(); priv = jp.permissions && jp.permissions.push ? '' : ' El repositorio privado se puede leer pero no editar (Contents = Read and write).'; }
      catch (e) { priv = ' ' + e.message; }
      cab.textContent = ok && !priv ? 'Conectado' : 'Conectado (revisar permisos)';
      if (est) { est.className = ok && !priv ? 'estado-ok' : 'estado-error';
        est.textContent = (ok ? 'Conectado: puede editar la página.' : 'La clave funciona pero no tiene permiso de escritura (Contents = Read and write).') + (priv || ' Repositorio privado: conectado.'); }
      return ok;
    } catch (e) { cab.textContent = 'Error de conexión'; if (est) { est.className = 'estado-error'; est.textContent = e.message; } return false; }
  }

  // ---------------------------------------------------------------- Noticias
  const SECC = { general: 'Escena mundial', latam: 'Latinoamérica', tema: 'Tema caliente' };
  VISTAS.noticias = async () => {
    const [tj, ed, st] = await Promise.all([leerJSON('docs/datos/tarjetas.json', { tarjetas: [] }), leerJSON('data/ediciones.json', { tarjetas: {} }),
      leerJSON('config/sitio.json', { secciones: [], botones: [] })]);
    let SITIO = st.datos, shaSitio = st.sha;
    const T = tj.datos.tarjetas; let E = ed.datos; let sha = ed.sha;
    const dias = [...new Set(T.map(t => t.dia))].sort().reverse();
    vista.innerHTML = `
    <div class="bloque"><div class="bh"><h2>Noticias publicadas</h2>
      <select class="form-select form-select-sm w-auto" id="n-dia"><option value="">Últimos 60 días</option>${dias.map(d => `<option value="${d}">${fechaLarga(d)}</option>`).join('')}</select>
      <select class="form-select form-select-sm w-auto" id="n-sec"><option value="">Todo el barrido</option><option value="general">Escena mundial</option><option value="latam">Latinoamérica</option><option value="europa">Europa</option><option value="tema">Temas calientes</option></select>
      <select class="form-select form-select-sm w-auto" id="n-secc"><option value="">Todas las secciones del sitio</option>${(SITIO.secciones || []).map(sc => `<option value="${esc(sc.id)}">${esc(sc.nombre)}</option>`).join('')}</select>
      <input class="form-control form-control-sm w-auto flex-grow-1" id="n-q" type="search" placeholder="Buscar…">
      <select class="form-select form-select-sm w-auto" id="n-est"><option value="">Todas</option><option value="ed">Editadas</option><option value="ocu">Ocultas</option><option value="ig">Marcadas para Instagram</option><option value="rev">Para revisar</option></select>
    </div><div class="bc"><p class="ayuda">Haga clic en «Editar» para corregir título, resumen o texto de la noticia, cambiar la foto, destacarla, ocultarla o marcarla para Instagram. Cada corrección queda registrada con el texto original, para que SEI aprenda de ella. La página se actualiza sola en uno o dos minutos.</p>
    <div class="tabla-wrap"><table class="table table-hover align-middle mb-0"><thead><tr><th class="d-none d-md-table-cell">Fecha</th><th class="d-none d-md-table-cell">Sección</th><th>Título</th><th class="d-none d-md-table-cell">Estado</th><th></th></tr></thead><tbody id="n-filas"></tbody></table></div></div></div>
    <div class="modal fade" id="m-ed" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Editar noticia</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
      <div class="modal-body" id="m-cuerpo"></div>
      <div class="modal-footer"><button class="btn btn-outline-secondary me-auto" id="m-restaurar" type="button">Volver al original</button><button class="btn btn-outline-secondary" data-bs-dismiss="modal" type="button">Cancelar</button><button class="btn btn-mc" id="m-guardar" type="button">Guardar</button></div>
    </div></div></div>`;
    const filas = document.getElementById('n-filas');
    const pintar = () => {
      const secc = document.getElementById('n-secc').value;
      const dia = document.getElementById('n-dia').value, sec = document.getElementById('n-sec').value, q = norm(document.getElementById('n-q').value), est = document.getElementById('n-est').value;
      const r = T.filter(t => (!secc || (t.secs || []).includes(secc) || ((E.tarjetas[t.id] || {}).secciones || []).includes(secc)) && (!dia || t.dia === dia) && (!sec || (sec === 'europa' ? t.region === 'europa' : t.seccion === sec)) &&
        (!q || norm(t.titulo + ' ' + (t.resumen || '')).includes(q)) && (!est || (est === 'rev' ? (t.revisar || []).length && !(E.tarjetas[t.id] || {}).revisada : est === 'ed' ? E.tarjetas[t.id] : est === 'ocu' ? (E.tarjetas[t.id] || {}).oculta : (E.tarjetas[t.id] || {}).instagram)));
      filas.innerHTML = r.slice(0, 300).map(t => { const e = E.tarjetas[t.id] || {};
        const estado = [(t.revisar || []).length && !e.revisada && `<span class="badge text-bg-warning" title="${esc(t.revisar.join(' · '))}">Revisar</span>`, e.oculta && '<span class="badge text-bg-secondary">Oculta</span>', e.destacada && '<span class="badge text-bg-danger">Destacada</span>', e.instagram && '<span class="badge text-bg-info">Instagram</span>', Object.keys(e).length && !e.oculta && '<span class="badge text-bg-light border">Editada</span>'].filter(Boolean).join(' ');
        const sec = esc(t.region === 'europa' ? 'Europa' : SECC[t.seccion] || t.seccion);
        return `<tr><td class="text-nowrap d-none d-md-table-cell">${esc(fechaLarga(t.dia))}</td><td class="d-none d-md-table-cell"><span class="badge text-bg-light border badge-sec">${sec}</span></td>
          <td class="titulo"><a href="../n/${esc(t.id)}.html" target="_blank" rel="noopener">${esc(e.titulo || t.titulo)}</a><div class="d-md-none ayuda mt-1">${esc(fechaLarga(t.dia))} · ${sec} ${estado}</div></td><td class="d-none d-md-table-cell">${estado}</td>
          <td><button class="btn btn-sm btn-outline-dark" data-id="${esc(t.id)}" type="button">Editar</button></td></tr>`; }).join('') || '<tr><td colspan="5" class="ayuda">No hay noticias con estos filtros.</td></tr>';
    };
    ['n-dia', 'n-sec', 'n-secc', 'n-q', 'n-est'].forEach(id => document.getElementById(id).addEventListener('input', pintar));
    pintar();
    const modal = new bootstrap.Modal(document.getElementById('m-ed'));
    let actual = null;
    filas.addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (!b) return;
      actual = T.find(t => t.id === b.dataset.id); const x = E.tarjetas[actual.id] || {};
      document.getElementById('m-cuerpo').innerHTML = `
        ${(actual.revisar || []).length ? `<div class="alert alert-warning py-2"><b>Para revisar:</b><ul class="mb-1">${actual.revisar.map(m => `<li>${esc(m)}</li>`).join('')}</ul><label class="form-check mb-0"><input class="form-check-input" type="checkbox" id="e-revisada" ${x.revisada ? 'checked' : ''}> <span class="form-check-label">Revisada (quita la marca)</span></label></div>` : ''}
        <p class="ayuda mb-3">${esc(fechaLarga(actual.dia))} · Fuentes: ${actual.fuentes.map(f => `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.nombre)}</a>`).join(', ')}</p>
        <div class="mb-3"><label class="form-label" for="e-tit">Título</label><input class="form-control" id="e-tit" value="${esc(x.titulo || actual.titulo)}"></div>
        <div class="mb-3"><label class="form-label" for="e-res">Bajada (resumen corto de la tarjeta)</label><textarea class="form-control" id="e-res" rows="3">${esc(x.resumen || actual.resumen || '')}</textarea></div>

          <div class="row g-2 mb-3">
            <div class="col-md-4"><label class="form-label small" for="vv-marca">Marca</label><select class="form-select form-select-sm" id="vv-marca">${opc(MS.marcas.map(m => [m.id, m.nombre]), v.marca || MS.activa)}</select></div>
            <div class="col-md-4"><label class="form-label small" for="vv-fmt">Formato</label><select class="form-select form-select-sm" id="vv-fmt">${opc(FM.formatos.map(f => [f.id, f.nombre]), v.formato, 'Libre')}</select></div>
            <div class="col-md-4"><label class="form-label small" for="vv-vozn">Voz en off</label><select class="form-select form-select-sm" id="vv-vozn">${opc(Object.entries(VOCES), v.voz ? (v.voz_nombre || marcaDe(MS, v.marca).voz || 'es_MX-claude-high') : '', 'Sin voz')}</select></div>
            <div class="col-md-6"><label class="form-label small" for="vv-mus">Música</label><select class="form-select form-select-sm" id="vv-mus">${opc(AUDS.map(a => [a.nombre, a.nombre]), v.musica || '', 'Sin música')}</select></div>
            <div class="col-md-6"><label class="form-label small" for="vv-vol">Volumen de la música</label><input class="form-range" id="vv-vol" type="range" min="0.1" max="1" step="0.05" value="${v.volumen_musica || 0.5}"></div></div>
          <div class="border rounded p-3 mb-3"><label class="form-label fw-semibold" for="vv-pedido">${versiones.length || v.guion ? 'Pedirle cambios a Claude' : 'Primera versión'}</label>
            <textarea class="form-control" id="vv-pedido" rows="3" placeholder="${versiones.length || v.guion ? 'Ej.: que el dato del premio vaya primero, menos texto en la tercera escena y usar la foto de la mesa final.' : 'Opcional: indicaciones para la primera versión (tono, qué destacar, qué foto usar).'}"></textarea>
            <button class="btn btn-mc mt-2" id="vv-claude" type="button">${versiones.length || v.guion ? 'Pedir cambios y renderizar' : 'Generar con Claude'}</button></div>
          <div class="d-flex align-items-center mb-2"><h6 class="text-uppercase fw-bold small mb-0">Guion (editable a mano)</h6><button class="btn btn-sm btn-outline-dark ms-auto" id="vv-add" type="button">+ Escena</button></div>
          <div id="vv-escenas" class="d-grid gap-2"></div>
          <div class="mt-2"><input class="form-control form-control-sm" id="vv-subir" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/webm"><div class="ayuda">Subir una foto o un video propio para el fondo de las escenas (repositorio privado). Música: en «Biblioteca».</div></div>
          <div class="d-flex flex-wrap gap-2 mt-3"><button class="btn btn-outline-dark" id="vv-guardar" type="button">Guardar guion</button><button class="btn btn-outline-dark" id="vv-render" type="button">Guardar y renderizar sin Claude</button>
            <select class="form-select form-select-sm w-auto ms-auto" id="vv-est">${['nuevo', 'listo', 'publicado'].map(e => `<option value="${e}" ${v.estado === e ? 'selected' : ''}>${{ nuevo: 'Sin generar', listo: 'Listo', publicado: 'Publicado' }[e]}</option>`).join('')}</select></div>
        </div></div></div></div>`;
      const caja = document.getElementById('vv-escenas');
      const pintarEscenas = () => { caja.innerHTML = g.escenas.map((e, i) => `<div class="border rounded p-2" data-e="${i}"><div class="row g-1 align-items-center">
          <div class="col-4 col-md-3"><select class="form-select form-select-sm" data-k="tipo">${Object.entries(TIPOS_ESC).map(([k, n]) => `<option value="${k}" ${e.tipo === k ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
          <div class="col-3 col-md-2"><input class="form-control form-control-sm" data-k="duracion" type="number" min="2" max="8" step="0.5" value="${e.duracion || 4}" title="Segundos"></div>
          <div class="col-5 col-md-4"><select class="form-select form-select-sm" data-k="imagen"><option value="">Sin foto</option>${IMGS.map(n => `<option ${e.imagen === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>
          <div class="col-12 col-md-3 text-md-end"><button class="btn btn-sm btn-outline-secondary" data-m="-1" type="button" aria-label="Subir">↑</button> <button class="btn btn-sm btn-outline-secondary" data-m="1" type="button" aria-label="Bajar">↓</button> <button class="btn btn-sm btn-outline-danger" data-x type="button" aria-label="Quitar escena">×</button></div>
          <div class="col-md-4"><input class="form-control form-control-sm" data-k="seccion" placeholder="Sección" value="${esc(e.seccion || '')}"></div>
          <div class="col-md-4"><input class="form-control form-control-sm" data-k="dato" placeholder="Dato (cifra)" value="${esc(e.dato || '')}"></div>
          <div class="col-md-4"><input class="form-control form-control-sm" data-k="fuente" placeholder="Fuente" value="${esc(e.fuente || '')}"></div>
          <div class="col-12"><input class="form-control form-control-sm" data-k="titulo" placeholder="Título" value="${esc(e.titulo || '')}"></div>
          <div class="col-12"><textarea class="form-control form-control-sm" data-k="texto" rows="2" placeholder="Texto">${esc(e.texto || '')}</textarea></div>
          <div class="col-md-4"><select class="form-select form-select-sm" data-k="video"><option value="">Sin video de fondo</option>${VIDS.map(a => `<option ${e.video === a.nombre ? 'selected' : ''}>${esc(a.nombre)}</option>`).join('')}</select></div>
          <div class="col-md-8"><textarea class="form-control form-control-sm" data-k="voz" rows="2" placeholder="Voz en off de la escena (las cifras, escritas como se dicen)">${esc(e.voz || '')}</textarea></div></div></div>`).join('') || '<p class="ayuda">Sin escenas: genere la primera versión con Claude o agregue escenas a mano.</p>';
        caja.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { leerG(); const i = +b.closest('[data-e]').dataset.e, j = i + +b.dataset.m; if (j < 0 || j >= g.escenas.length) return; [g.escenas[i], g.escenas[j]] = [g.escenas[j], g.escenas[i]]; pintarEscenas(); });
        caja.querySelectorAll('[data-x]').forEach(b => b.onclick = () => { leerG(); g.escenas.splice(+b.closest('[data-e]').dataset.e, 1); pintarEscenas(); }); };
      const leerG = () => { g.escenas = [...caja.querySelectorAll('[data-e]')].map(el => { const e = {}; el.querySelectorAll('[data-k]').forEach(i => { const val = i.value.trim(); if (val) e[i.dataset.k] = i.dataset.k === 'duracion' ? +val : val; }); return e; }); };
      pintarEscenas();
      const prev = document.getElementById('vv-prev');
      const vistaPrevia = async () => { leerG(); const imgs = {}, vids = {}; for (const e of g.escenas) { if (e.imagen) { try { imgs[e.imagen] = (await imagenIG(e.imagen)).url; } catch (er) {} }
          if (e.video) { try { vids[e.video] = await urlVideoIG(e.video); } catch (er) {} } }
        const marca = await marcaConLogo(marcaDe(MS, document.getElementById('vv-marca').value)); delete marca._logo;
        prev.contentWindow.postMessage({ tipo: 'cargar', guion: g, marca, imagenes: imgs, videos: vids, reproducir: true }, location.origin); };
      prev.onload = () => { if (g.escenas.length) vistaPrevia(); };
      document.getElementById('vv-play').onclick = vistaPrevia;
      document.getElementById('vv-volver').onclick = () => { clearInterval(sondeo); lista(); };
      document.getElementById('vv-add').onclick = () => { leerG(); g.escenas.push({ tipo: 'texto', duracion: 4 }); pintarEscenas(); };
      document.getElementById('vv-subir').onchange = async e => { const f = e.target.files[0]; if (!f) return; const esVideo = f.type.startsWith('video/');
        try { aviso('Subiendo…', 'info'); const n = await subirArchivoIG(e.target, esVideo ? 'videos' : 'imagenes', esVideo ? 40 : 8); if (!n) return;
          (esVideo ? VIDS : IMGS).push(esVideo ? { nombre: n } : n); leerG(); pintarEscenas(); aviso((esVideo ? 'Video' : 'Foto') + ' subido: elíjalo en la escena.'); } catch (er) { aviso(er.message, 'danger'); } };
      const leerAjustes = () => { const vn = document.getElementById('vv-vozn').value; Object.assign(v, { marca: document.getElementById('vv-marca').value, formato: document.getElementById('vv-fmt').value,
        voz: !!vn, voz_nombre: vn, musica: document.getElementById('vv-mus').value, volumen_musica: +document.getElementById('vv-vol').value }); };
      const guardarGuion = async () => { leerG(); leerAjustes(); v.guion = g; v.estado = document.getElementById('vv-est').value; v.actualizado = hoyISO(); await guardarV('Guion de video: ' + v.titulo.slice(0, 50)); };
      document.getElementById('vv-guardar').onclick = async () => { try { await guardarGuion(); aviso('Guion guardado.'); } catch (e) { aviso(e.message, 'danger'); } };
      document.getElementById('vv-est').onchange = async () => { try { await guardarGuion(); aviso('Estado guardado.'); } catch (e) { aviso(e.message, 'danger'); } };
      let sondeo = null;
      const seguir = () => { const el = document.getElementById('vv-estado'); el.innerHTML = '<div class="alert alert-info py-2 mb-0">Generando el video en GitHub (2 o 3 minutos)…</div>';
        clearInterval(sondeo); const inicio = Date.now();
        sondeo = setInterval(async () => { if (!document.getElementById('vv-estado')) return clearInterval(sondeo);
          const run = await estadoFlujoVideo().catch(() => null); if (!run || Date.parse(run.created_at) < inicio - 60000 || run.status !== 'completed') return;
          clearInterval(sondeo);
          if (run.conclusion !== 'success') { el.innerHTML = `<div class="alert alert-danger py-2 mb-0">No se pudo generar. <a href="${esc(run.html_url)}" target="_blank" rel="noopener">Ver el detalle en GitHub</a></div>`; return; }
          const f = await leerJSON(RUTA_VID, { videos: [] }, true); V = f.datos; shaV = f.sha; abrir(V.videos.find(x => x.id === v.id) || v); aviso('Nueva versión lista.'); }, 10000); };
      const lanzar = async (pedido, solo) => { try { await guardarGuion(); await lanzarVideo(v.id, pedido, solo); seguir(); } catch (e) { aviso(e.message, 'danger'); } };
      document.getElementById('vv-claude').onclick = () => lanzar(document.getElementById('vv-pedido').value.trim(), false);
      document.getElementById('vv-render').onclick = () => { leerG(); if (!g.escenas.length) return aviso('Agregue al menos una escena.', 'warning'); lanzar('', true); };
      vista.querySelectorAll('[data-ver], [data-bajar]').forEach(b => b.onclick = async () => { try { const blob = await leerBlob(b.dataset.ver || b.dataset.bajar, true); if (!blob) throw new Error('No se encontró el archivo.');
        const url = URL.createObjectURL(new Blob([blob], { type: 'video/mp4' }));
        if (b.dataset.ver) { const el = document.getElementById('vv-mp4'); el.src = url; el.hidden = false; el.play().catch(() => {}); }
        else { const a = document.createElement('a'); a.href = url; a.download = (b.dataset.bajar.split('/').slice(-2).join('-')); document.body.appendChild(a); a.click(); a.remove(); } } catch (e) { aviso(e.message, 'danger'); } });
    };
    lista();
  };

  // ---------------------------------------------------------------- Marcas (instagram/marcas.json, privado)
  VISTAS.marcas = async () => {
    let { datos: MS, sha } = await cargarMarcas();
    const IMGS = await listaImagenesIG().catch(() => []);
    const sel = (lista, valor, vacio) => (vacio ? `<option value="">${vacio}</option>` : '') + lista.map(([k, n]) => `<option value="${esc(k)}" ${valor === k ? 'selected' : ''}>${esc(n)}</option>`).join('');
    const pintar = () => { vista.innerHTML = `<div class="bloque"><div class="bh"><h2>Marcas</h2><button class="btn btn-sm btn-outline-dark ms-auto" id="mc-add" type="button">+ Marca</button></div><div class="bc">
      <p class="ayuda">Cada marca define colores, fuentes, logo, voz y cuentas. La <b>activa</b> se usa por defecto en posteos y videos nuevos; cada uno puede elegir otra. Para GipsyTeam, use sus colores y su logo oficial cuando empiecen a publicar con esa cuenta.</p>
      <div class="d-grid gap-3" id="mc-lista">${MS.marcas.map((m, i) => `<div class="border rounded p-3" data-m="${i}">
        <div class="row g-2 align-items-end">
          <div class="col-md-3"><label class="form-label small">Nombre</label><input class="form-control form-control-sm" data-k="nombre" value="${esc(m.nombre)}"></div>
          <div class="col-md-3"><label class="form-label small">Usuario</label><input class="form-control form-control-sm" data-k="usuario" value="${esc(m.usuario)}" placeholder="@usuario"></div>
          <div class="col-md-4"><label class="form-label small">Lema</label><input class="form-control form-control-sm" data-k="lema" value="${esc(m.lema)}"></div>
          <div class="col-md-2"><label class="form-check"><input class="form-check-input" type="radio" name="mc-activa" value="${esc(m.id)}" ${MS.activa === m.id ? 'checked' : ''}> <span class="form-check-label small">Activa</span></label></div>
          <div class="col-4 col-md-1"><label class="form-label small">Fondo</label><input class="form-control form-control-color" type="color" data-k="fondo" value="${esc(m.fondo || '#16171a')}"></div>
          <div class="col-4 col-md-1"><label class="form-label small">Acento</label><input class="form-control form-control-color" type="color" data-k="acento" value="${esc(m.acento || '#d9262c')}"></div>
          <div class="col-4 col-md-1"><label class="form-label small">Texto</label><input class="form-control form-control-color" type="color" data-k="texto" value="${esc(m.texto || '#f1f2f4')}"></div>
          <div class="col-md-3"><label class="form-label small">Fuente de títulos</label><select class="form-select form-select-sm" data-k="fuente_titulo">${sel(FUENTES_MARCA.map(f => [f, f]), m.fuente_titulo || 'PT Serif')}</select></div>
          <div class="col-md-3"><label class="form-label small">Fuente de textos</label><select class="form-select form-select-sm" data-k="fuente_texto">${sel(FUENTES_MARCA.map(f => [f, f]), m.fuente_texto || 'Inter')}</select></div>
          <div class="col-md-3"><label class="form-label small">Fuente de etiquetas</label><select class="form-select form-select-sm" data-k="fuente_etiquetas">${sel(FUENTES_MARCA.map(f => [f, f]), m.fuente_etiquetas || 'Roboto Condensed')}</select></div>
          <div class="col-md-4"><label class="form-label small">Logo (de la biblioteca de fotos; PNG con fondo transparente)</label><select class="form-select form-select-sm" data-k="logo">${sel(IMGS.map(n => [n, n]), m.logo || '', 'Sin logo')}</select></div>
          <div class="col-md-3"><label class="form-check mt-4"><input class="form-check-input" type="checkbox" data-k="ocultar_nombre" ${m.ocultar_nombre ? 'checked' : ''}> <span class="form-check-label small">Solo logo, sin nombre</span></label></div>
          <div class="col-md-3"><label class="form-label small">Voz de los videos</label><select class="form-select form-select-sm" data-k="voz">${sel(Object.entries(VOCES), m.voz || 'es_MX-claude-high')}</select></div>
          <div class="col-md-2 text-md-end"><button class="btn btn-sm btn-outline-danger" data-quitar type="button" ${MS.marcas.length < 2 ? 'disabled' : ''}>Quitar marca</button></div>
        </div>
        <p class="mt-3 mb-2 small"><b>Cuentas y accesos</b> <span class="ayuda">(quién maneja cada cuenta y su estado; nunca escriba contraseñas)</span></p>
        <div class="d-grid gap-2" data-cuentas>${(m.cuentas || []).map(ct => `<div class="row g-2 fila-cuenta"><div class="col-md-3"><input class="form-control form-control-sm" data-c="red" value="${esc(ct.red)}"></div><div class="col-md-3"><input class="form-control form-control-sm" data-c="usuario" value="${esc(ct.usuario)}"></div><div class="col-md-2"><select class="form-select form-select-sm" data-c="estado">${['prueba', 'activa', 'pausada'].map(e => `<option ${ct.estado === e ? 'selected' : ''}>${e}</option>`).join('')}</select></div><div class="col-md-4"><input class="form-control form-control-sm" data-c="notas" value="${esc(ct.notas)}"></div></div>`).join('')}</div>
        <button class="btn btn-sm btn-link px-0" data-cuenta type="button">+ Cuenta</button></div>`).join('')}</div>
      <button class="btn btn-mc mt-3" id="mc-guardar" type="button">Guardar marcas</button></div></div>`;
      const leer = () => { MS.marcas = [...vista.querySelectorAll('[data-m]')].map(el => { const m = { ...MS.marcas[+el.dataset.m] };
          el.querySelectorAll('[data-k]').forEach(i => { m[i.dataset.k] = i.type === 'checkbox' ? i.checked : i.value.trim(); });
          m.cuentas = [...el.querySelectorAll('.fila-cuenta')].map(f => Object.fromEntries([...f.querySelectorAll('[data-c]')].map(i => [i.dataset.c, i.value.trim()]))).filter(ct => ct.usuario);
          return m; });
        const a = vista.querySelector('input[name="mc-activa"]:checked'); if (a) MS.activa = a.value; };
      vista.querySelectorAll('[data-cuenta]').forEach(b => b.onclick = () => b.previousElementSibling.insertAdjacentHTML('beforeend', `<div class="row g-2 fila-cuenta"><div class="col-md-3"><input class="form-control form-control-sm" data-c="red" value="Instagram"></div><div class="col-md-3"><input class="form-control form-control-sm" data-c="usuario" placeholder="Usuario"></div><div class="col-md-2"><select class="form-select form-select-sm" data-c="estado"><option>prueba</option><option>activa</option><option>pausada</option></select></div><div class="col-md-4"><input class="form-control form-control-sm" data-c="notas" placeholder="Quién tiene acceso, conexión con la API…"></div></div>`));
      vista.querySelectorAll('[data-quitar]').forEach(b => b.onclick = () => { leer(); MS.marcas.splice(+b.closest('[data-m]').dataset.m, 1); if (!MS.marcas.some(m => m.id === MS.activa)) MS.activa = MS.marcas[0].id; pintar(); });
      document.getElementById('mc-add').onclick = () => { leer(); const id = 'marca-' + Date.now().toString(36);
        MS.marcas.push({ id, nombre: 'Marca nueva', usuario: '', lema: '', fondo: '#16171a', acento: '#d9262c', texto: '#f1f2f4', cuentas: [] }); pintar(); };
      document.getElementById('mc-guardar').onclick = async () => { leer(); try { sha = await guardar(RUTA_MARCAS, json(MS), sha, 'Marcas de Instagram', true); aviso('Marcas guardadas.'); pintar(); } catch (e) { aviso(e.message, 'danger'); } };
    };
    pintar();
  };

  // ---------------------------------------------------------------- Biblioteca (fotos, videos y música propios; privado)
  VISTAS.biblioteca = async () => {
    const TIPOS_B = [{ c: 'imagenes', n: 'Fotos', acepta: 'image/jpeg,image/png,image/webp', max: 8, nota: 'Fondos de posteos y escenas, y logos (PNG con transparencia).' },
      { c: 'videos', n: 'Videos', acepta: 'video/mp4,video/quicktime,video/webm', max: 40, nota: 'Videos propios para el fondo de las escenas (hasta 40 MB; conviene recortarlos a lo que se va a usar).' },
      { c: 'audio', n: 'Música', acepta: 'audio/mpeg,audio/wav,audio/mp4,audio/ogg,audio/aac', max: 15, nota: 'Solo música con licencia para usar en redes (propia, comprada o libre de derechos).' }];
    const listas = await Promise.all(TIPOS_B.map(t => listaCarpetaIG(t.c).catch(() => [])));
    vista.innerHTML = TIPOS_B.map((t, i) => `<div class="bloque"><div class="bh"><h2>${t.n}</h2><span class="badge text-bg-dark">Privado</span></div><div class="bc">
      <p class="ayuda">${t.nota}</p><div class="d-flex gap-2 mb-3" style="max-width:560px"><input class="form-control form-control-sm" type="file" accept="${t.acepta}" data-subir="${i}"></div>
      <ul class="mb-0">${listas[i].map(a => `<li><button class="btn btn-link btn-sm p-0 align-baseline" data-ver="${t.c}/${esc(a.nombre)}" type="button">${esc(a.nombre)}</button> <span class="ayuda">(${a.kb} KB)</span></li>`).join('') || '<li class="ayuda">Vacío.</li>'}</ul></div></div>`).join('') +
      '<div id="bi-ver" class="bloque" hidden><div class="bc" id="bi-ver-c"></div></div>';
    vista.querySelectorAll('[data-subir]').forEach(inp => inp.onchange = async () => { const t = TIPOS_B[+inp.dataset.subir];
      try { aviso('Subiendo…', 'info'); await subirArchivoIG(inp, t.c, t.max); aviso('Archivo subido.'); VISTAS.biblioteca(); } catch (e) { aviso(e.message, 'danger'); } });
    vista.querySelectorAll('[data-ver]').forEach(b => b.onclick = async () => { try { const blob = await leerBlob('instagram/' + b.dataset.ver, true); const url = URL.createObjectURL(blob);
      const tipo = b.dataset.ver.split('/')[0]; const c = document.getElementById('bi-ver-c'); document.getElementById('bi-ver').hidden = false;
      c.innerHTML = tipo === 'imagenes' ? `<img src="${url}" alt="" style="max-width:100%;max-height:420px">` : tipo === 'videos' ? `<video src="${url}" controls style="max-width:100%;max-height:420px"></video>` : `<audio src="${url}" controls></audio>`;
      c.scrollIntoView({ behavior: 'smooth' }); } catch (e) { aviso(e.message, 'danger'); } });
  };

  // ---------------------------------------------------------------- inicio
  probar();
  const inicial = (location.hash || '').slice(1);
  ir(VISTAS[inicial] ? inicial : (TOKEN ? 'noticias' : 'conexion'));
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
